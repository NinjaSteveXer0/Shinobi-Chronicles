<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shinobi Chronicles - Battle Arena</title>
  <style>
    /* Shinobi Chronicles Battle Screen Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #040608;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .battle-arena {
      position: relative;
      width: 900px;
      height: 600px;
      background-color: #080C10; /* Obsidian Primary */
      border: 1px solid #082B30; /* Deep Teal */
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    /* Layer 1: Environment */
    .environment-bg {
      position: absolute;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: linear-gradient(to bottom, rgba(8,12,16,0.5), rgba(8,43,48,0.85));
      z-index: 1;
    }

    /* Layer 2: Combatants Stage */
    .combatants-stage {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 30px 20px;
      height: 65%;
    }

    .combatant {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .character-card-frame {
      width: 180px;
      height: 260px;
      background: #080C10;
      border-radius: 8px;
      border: 2px solid #082B30;
      overflow: hidden;
      transition: transform 0.3s ease;
      position: relative;
    }

    .character-card-frame.glow-cyan {
      box-shadow: 0 0 20px rgba(0, 217, 232, 0.4); /* Chakra Cyan */
    }

    .character-card-frame.glow-red {
      box-shadow: 0 0 20px rgba(229, 57, 53, 0.4); /* Blood Red */
    }

    .character-card-frame:hover {
      transform: translateY(-5px);
    }

    .art-placeholder {
      width: 100%;
      height: 100%;
      background-position: center;
      background-size: cover;
    }

    .shadow-ninja-art {
      background-color: #121c24; /* Placeholder tint for player art */
    }

    .sasuke-art {
      background-color: #241212; /* Placeholder tint for boss art */
    }

    .versus-badge {
      font-size: 24px;
      font-weight: 900;
      color: #D6A93A;
      text-shadow: 0 0 10px rgba(214, 169, 58, 0.6);
      letter-spacing: 2px;
    }

    .health-bar-container {
      width: 180px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: center;
    }

    .health-bar-container .name {
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #C0C0C0;
    }

    .bar {
      width: 100%;
      height: 8px;
      background: #040608;
      border: 1px solid #082B30;
      border-radius: 4px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: #00D9E8;
      box-shadow: 0 0 8px #00D9E8;
    }

    .fill.enemy {
      background: #E53935;
      box-shadow: 0 0 8px #E53935;
    }

    /* Layer 3: Obsidian Glass Console */
    .combat-console {
      position: relative;
      z-index: 2;
      background: rgba(8, 12, 16, 0.9);
      backdrop-filter: blur(8px);
      border-top: 1px solid #082B30;
      padding: 15px 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-feedback-log {
      font-size: 13px;
      color: #00D9E8;
      text-shadow: 0 0 5px rgba(0, 217, 232, 0.3);
    }

    .action-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-ninja {
      flex: 1;
      background: #082B30;
      color: #FFFFFF;
      border: 1px solid #00D9E8;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      transition: all 0.2s ease-in-out;
    }

    .btn-ninja:hover {
      background: #00D9E8;
      color: #080C10;
      box-shadow: 0 0 12px #00D9E8;
    }

    .btn-ninja.gold-border {
      border-color: #D6A93A; /* Ninja Gold */
    }
    
    .btn-ninja.gold-border:hover {
      background: #D6A93A;
      box-shadow: 0 0 12px #D6A93A;
      color: #080C10;
    }
  </style>
</head>
<body>

  <div class="battle-arena">
    <!-- Layer 1: Environment Atmosphere -->
    <div class="environment-bg"></div>

    <!-- Layer 2: Characters Showdown -->
    <div class="combatants-stage">
      <!-- Player Card / Character -->
      <div class="combatant">
        <div class="character-card-frame glow-cyan">
          <div class="art-placeholder shadow-ninja-art"></div>
        </div>
        <div class="health-bar-container">
          <span class="name">SHADOW NINJA</span>
          <div class="bar"><div class="fill" style="width: 100%;"></div></div>
        </div>
      </div>

      <div class="versus-badge">VS</div>

      <!-- Enemy / Boss Card -->
      <div class="combatant">
        <div class="character-card-frame glow-red">
          <div class="art-placeholder sasuke-art"></div>
        </div>
        <div class="health-bar-container">
          <span class="name">JONIN SASUKE</span>
          <div class="bar"><div class="fill enemy" style="width: 65%;"></div></div>
        </div>
      </div>
    </div>

    <!-- Layer 3: Combat Feedback & Action Console -->
    <div class="combat-console">
      <div class="action-feedback-log">
        <span>⚡ Shadow Ninja readies a strike... Waiting for user input.</span>
      </div>
      <div class="action-buttons">
        <button class="btn-ninja gold-border">NINJUTSU</button>
        <button class="btn-ninja">CHAKRA CHARGE</button>
        <button class="btn-ninja">FLEE</button>
      </div>
    </div>
  </div>

</body>
</html>
