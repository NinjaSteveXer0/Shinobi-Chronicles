<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Difficulty Selection — Flatter Diagonal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /* ---------- CONFIG (single place to edit) ---------- */
    :root{
      --bg-color: #000;
      --bg-image: none; /* set to url("Assets/Backgrounds/level-bg.png") if you want a background */
      --overlay-dark: rgba(0,0,0,0.22);

      /* Formation tuning: make the diagonal flatter by reducing step-v */
      --anchor-left: 14%;   /* leftmost starting point (Academy) */
      --anchor-top: 92%;    /* vertical start (Academy) */
      --step-h: 9.5%;       /* horizontal step between stones */
      --step-v: 9%;         /* vertical step between stones (smaller = flatter tilt) */

      /* Canvas and icon sizing */
      --canvas-max-width: 1200px;
      --canvas-aspect-ratio: 16/9; /* standard screen ratio */
      --icon-size: 110px; /* all PNGs will be this size (same for every icon) */

      /* Paid item offsets (multipliers of step values) */
      --paid-offset-x: 6.0;
      --paid-offset-y: 1.6;
    }

    /* ---------- Base layout ---------- */
    * { box-sizing: border-box; }
    html,body { height:100%; margin:0; background:var(--bg-color); color:#eaeaea; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing:antialiased; }
    .page { min-height:100vh; padding:18px; display:flex; flex-direction:column; align-items:center; gap:12px; }

    h1 { color:#ff1a1a; margin:6px 0 6px; font-weight:700; }

    /* Canvas: uses standard 16:9 aspect ratio and scales responsively */
    .difficulty-path {
      position: relative;
      width: 100%;
      max-width: var(--canvas-max-width);
      aspect-ratio: var(--canvas-aspect-ratio);
      margin-top: 8px;
      margin-bottom: 8px;
      overflow: visible;
      border-radius: 10px;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      background-color: #0a0a0a;
    }

    /* subtle overlay to improve contrast if a background is used */
    .difficulty-path::after{
      content:"";
      position:absolute; left:0; top:0; right:0; bottom:0;
      background: var(--overlay-dark);
      pointer-events:none;
      border-radius:10px;
      z-index:1;
    }

    /* Natural PNG look — no cards, icons are all the same size */
    .difficulty-level {
      position: absolute;
      transform: translate(-50%,-50%);
      text-align: center;
      background: transparent;
      padding: 0;
      z-index: 3;
      pointer-events: auto;
    }

    /* All icons same size (user requested) */
    .rock-icon {
      width: var(--icon-size);
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,0.6));
      transition: transform .16s ease, filter .16s ease;
      border-radius: 6px;
      will-change: transform;
      max-width: 100%;
    }
    .difficulty-level:hover .rock-icon {
      transform: translateY(-6px) scale(1.03);
      filter: drop-shadow(0 20px 36px rgba(0,0,0,0.65));
    }

    .difficulty-info {
      margin-top: 8px;
      color: #d0d0d0;
      font-weight: 700;
      font-size: 13px;
      text-shadow: 0 1px 0 rgba(0,0,0,0.6);
      line-height: 1;
      z-index: 4;
      position: relative;
    }

    .paid-badge { display:inline-block; background:linear-gradient(90deg,#b8860b,#ffd27a); color:#111; padding:4px 8px; border-radius:999px; font-weight:800; font-size:11px; margin-left:6px; vertical-align:middle; }

    /* Responsive adjustments */
    @media (max-width:1100px){
      :root { --step-h: 8%; --step-v: 7.5%; --icon-size: 100px; }
      .difficulty-info { font-size: 12px; }
    }
    @media (max-width:700px){
      :root { --step-h: 7%; --step-v: 6.5%; --anchor-left: 18%; --anchor-top: 90%; --icon-size: 84px; }
      .difficulty-info { font-size: 12px; }
    }

    /* small helper so images scale smoothly */
    img.rock-icon { display:block; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Select Your Difficulty</h1>

    <div class="difficulty-path" id="difficulty-canvas">
      <!-- Stones (IDs required for positioning script) -->
      <div id="academy" class="difficulty-level academy">
        <img src="Assets/Icons/Academy student.png" class="rock-icon" alt="Academy Student">
        <div class="difficulty-info">Academy Student</div>
      </div>

      <div id="genin" class="difficulty-level genin">
        <img src="Assets/Icons/Genin.png" class="rock-icon" alt="Genin">
        <div class="difficulty-info">Genin</div>
      </div>

      <div id="chunin" class="difficulty-level chunin">
        <img src="Assets/Icons/Chunin.png" class="rock-icon" alt="Chunin">
        <div class="difficulty-info">Chunin</div>
      </div>

      <div id="specialjonin" class="difficulty-level specialjonin">
        <img src="Assets/Icons/Special Jonin.png" class="rock-icon" alt="Special Jonin">
        <div class="difficulty-info">Special Jōnin</div>
      </div>

      <div id="jonin" class="difficulty-level jonin">
        <img src="Assets/Icons/Jonin.png" class="rock-icon" alt="Jonin">
        <div class="difficulty-info">Jōnin</div>
      </div>

      <div id="anbu" class="difficulty-level anbu">
        <img src="Assets/Icons/Anbu.png" class="rock-icon" alt="ANBU">
        <div class="difficulty-info">ANBU</div>
      </div>

      <div id="kage" class="difficulty-level kage">
        <img src="Assets/Icons/Kage.png" class="rock-icon" alt="Kage">
        <div class="difficulty-info">Kage</div>
      </div>

      <!-- Paid items -->
      <div id="akatsuki" class="difficulty-level paid-level akatsuki">
        <img src="Assets/Icons/Akatsuki.png" class="rock-icon" alt="Akatsuki">
        <div class="difficulty-info">Akatsuki <span class="paid-badge">PAID</span></div>
      </div>

      <div id="jinchuriki" class="difficulty-level paid-level jinchuriki">
        <img src="Assets/Icons/Jinchuriki.png" class="rock-icon" alt="Jinchuriki">
        <div class="difficulty-info">Jinchūriki <span class="paid-badge">PAID</span></div>
      </div>
    </div>

    <div style="margin-top:6px;">
      <button onclick="alert('Back')">← Back</button>
    </div>
  </div>

  <script>
    /* Positioning script (flatter diagonal). This version:
       - reduces vertical step (--step-v) so the diagonal is more level
       - uses the canvas element's pixel size (respecting 16:9 aspect ratio)
       - places each stone on a regular diagonal using CSS variables
       - all icons are uniform size via CSS --icon-size
    */
    (function positionStones(){
      const order = ['academy','genin','chunin','specialjonin','jonin','anbu','kage'];

      function getVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
      function px(v){ return parseFloat(v) || 0; }

      function setPositions(){
        const canvas = document.getElementById('difficulty-canvas');
        if(!canvas) return;
        const rect = canvas.getBoundingClientRect();

        const anchorLeftPct = parseFloat(getVar('--anchor-left')) || 14;
        const anchorTopPct  = parseFloat(getVar('--anchor-top'))  || 92;
        const stepHPct = parseFloat(getVar('--step-h')) || 9.5;
        const stepVPct = parseFloat(getVar('--step-v')) || 9;

        const anchorLeftPx = anchorLeftPct/100 * rect.width;
        const anchorTopPx  = anchorTopPct/100 * rect.height;
        const stepHPx = stepHPct/100 * rect.width;
        const stepVPx = stepVPct/100 * rect.height;

        // place main order
        order.forEach((id, idx) => {
          const el = document.getElementById(id);
          if(!el) return;
          const leftPx = anchorLeftPx + idx * stepHPx;
          const topPx  = anchorTopPx  - idx * stepVPx;
          el.style.left = (leftPx / rect.width) * 100 + '%';
          el.style.top  = (topPx  / rect.height) * 100 + '%';
        });

        // paid items: slightly higher than far bottom-right
        const paidOffsetX = parseFloat(getVar('--paid-offset-x')) || 6.0;
        const lastIdx = order.length - 1;
        const baseX = anchorLeftPx + lastIdx * stepHPx;
        const baseY = anchorTopPx  - lastIdx * stepVPx;

        const ak = document.getElementById('akatsuki');
        if(ak){
          const leftPx = baseX + paidOffsetX * (stepHPx / 1);
          const topPx  = anchorTopPx - 1.6 * stepVPx;
          ak.style.left = (leftPx / rect.width) * 100 + '%';
          ak.style.top  = (topPx  / rect.height) * 100 + '%';
        }

        const ji = document.getElementById('jinchuriki');
        if(ji){
          const leftPx = baseX + (paidOffsetX + 0.8) * (stepHPx / 1);
          const topPx  = anchorTopPx - 2.2 * stepVPx;
          ji.style.left = (leftPx / rect.width) * 100 + '%';
          ji.style.top  = (topPx  / rect.height) * 100 + '%';
        }
      }

      // run on load and resize; update after images load
      window.addEventListener('resize', setPositions);
      window.addEventListener('load', ()=> setTimeout(setPositions, 80));
      document.querySelectorAll('.rock-icon').forEach(img => {
        if(!img.complete) img.addEventListener('load', setPositions);
      });

      // helper to nudge the whole diagonal live from console
      window.nudgeDiagonal = function(deltaLeftPct, deltaTopPct){
        const root = document.documentElement;
        const curLeft = parseFloat(getComputedStyle(root).getPropertyValue('--anchor-left')) || 14;
        const curTop  = parseFloat(getComputedStyle(root).getPropertyValue('--anchor-top'))  || 92;
        root.style.setProperty('--anchor-left', (curLeft + deltaLeftPct) + '%');
        root.style.setProperty('--anchor-top', (curTop + deltaTopPct) + '%');
        setPositions();
      };

      // helper to nudge a single stone live from console (id, dxPct, dyPct)
      window.nudgeStone = function(id, dxPct, dyPct){
        const el = document.getElementById(id);
        if(!el) return;
        const left = parseFloat(el.style.left || 0);
        const top  = parseFloat(el.style.top  || 0);
        el.style.left = (left + dxPct) + '%';
        el.style.top  = (top  + dyPct) + '%';
      };

      setPositions();
    })();
  </script>
</body>
</html>
