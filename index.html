<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shinobi Chronicles - Dark Anime RPG</title>
  <style>
    /* ==========================================
       SHINOBI CHRONICLES DESIGN SYSTEM (CSS)
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #040608;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Main App Wrapper */
    .game-container {
      position: relative;
      width: 960px;
      height: 640px;
      background-color: #080C10; /* Obsidian Primary */
      border: 1px solid #082B30; /* Deep Teal */
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
    }

    /* Top Navigation / HUD */
    .game-header {
      height: 50px;
      background: rgba(8, 12, 16, 0.95);
      border-bottom: 1px solid #082B30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 10;
    }

    .hud-stats {
      display: flex;
      gap: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .hud-item span {
      color: #00D9E8; /* Chakra Cyan */
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .nav-tab {
      background: #082B30;
      border: 1px solid #00D9E8;
      color: #FFF;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .nav-tab:hover, .nav-tab.active {
      background: #00D9E8;
      color: #080C10;
      box-shadow: 0 0 8px #00D9E8;
    }

    /* Game Screen Panels */
    .screen {
      display: none;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    /* ==========================================
       PART 2: BATTLE SCREEN STYLES
       ========================================== */
    .battle-arena {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .environment-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(8,12,16,0.4), rgba(8,43,48,0.85));
      z-index: 1;
    }

    .combatants-stage {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 20px;
      flex: 1;
    }

    .combatant {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .character-card-frame {
      width: 170px;
      height: 240px;
      background: #080C10;
      border-radius: 8px;
      border: 2px solid #082B30;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    .character-card-frame.glow-cyan {
      box-shadow: 0 0 20px rgba(0, 217, 232, 0.4);
    }

    .character-card-frame.glow-red {
      box-shadow: 0 0 20px rgba(229, 57, 53, 0.4);
    }

    .art-placeholder {
      width: 100%;
      height: 100%;
      background-position: center;
      background-size: cover;
    }

    .shadow-ninja-art { background-color: #121c24; }
    .sasuke-art { background-color: #241212; }

    .versus-badge {
      font-size: 22px;
      font-weight: 900;
      color: #D6A93A;
      text-shadow: 0 0 10px rgba(214, 169, 58, 0.6);
    }

    .health-bar-container {
      width: 170px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: center;
    }

    .health-bar-container .name {
      font-size: 11px;
      font-weight: bold;
      color: #C0C0C0;
      letter-spacing: 1px;
    }

    .bar {
      width: 100%;
      height: 8px;
      background: #040608;
      border: 1px solid #082B30;
      border-radius: 4px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: #00D9E8;
      box-shadow: 0 0 6px #00D9E8;
      transition: width 0.3s ease;
    }

    .fill.enemy {
      background: #E53935;
      box-shadow: 0 0 6px #E53935;
    }

    .combat-console {
      position: relative;
      z-index: 2;
      background: rgba(8, 12, 16, 0.95);
      border-top: 1px solid #082B30;
      padding: 15px 25px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-feedback-log {
      font-size: 13px;
      color: #00D9E8;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-ninja {
      flex: 1;
      background: #082B30;
      color: #FFFFFF;
      border: 1px solid #00D9E8;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-ninja:hover {
      background: #00D9E8;
      color: #080C10;
      box-shadow: 0 0 10px #00D9E8;
    }

    .btn-ninja.gold-border {
      border-color: #D6A93A;
    }
    .btn-ninja.gold-border:hover {
      background: #D6A93A;
      box-shadow: 0 0 10px #D6A93A;
      color: #080C10;
    }

    /* ==========================================
       PART 3: CHARACTER INSPECT & ROSTER STYLES
       ========================================== */
    .roster-screen {
      flex: 1;
      padding: 25px;
      display: flex;
      gap: 20px;
      background: #080C10;
      z-index: 2;
    }

    .roster-list {
      width: 250px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid #082B30;
      padding-right: 15px;
    }

    .roster-card-item {
      background: #082B30;
      border: 1px solid #00D9E8;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
    }

    .roster-card-item:hover {
      background: #00D9E8;
      color: #080C10;
    }

    .inspector-panel {
      flex: 1;
      display: flex;
      gap: 20px;
      background: rgba(8, 43, 48, 0.15);
      border: 1px solid #082B30;
      border-radius: 8px;
      padding: 20px;
    }

    .inspector-art {
      width: 200px;
      height: 280px;
      background: #121c24;
      border: 2px solid #00D9E8;
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(0, 217, 232, 0.3);
    }

    .inspector-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .inspector-details h2 {
      color: #D6A93A;
      font-size: 20px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      border-bottom: 1px solid rgba(8, 43, 48, 0.6);
      padding-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- Top HUD Navigation -->
    <div class="game-header">
      <div class="hud-stats">
        <div class="hud-item">RYO: <span>14,500</span></div>
        <div class="hud-item">CHAKRA: <span>850/850</span></div>
        <div class="hud-item">RANK: <span>Jonin</span></div>
      </div>
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchScreen('battle')">BATTLE</button>
        <button class="nav-tab" onclick="switchScreen('roster')">ROSTER & INSPECT</button>
      </div>
    </div>

    <!-- SCREEN 1: BATTLE ARENA -->
    <div id="screen-battle" class="screen active">
      <div class="battle-arena">
        <div class="environment-bg"></div>

        <div class="combatants-stage">
          <!-- Player -->
          <div class="combatant">
            <div class="character-card-frame glow-cyan">
              <div class="art-placeholder shadow-ninja-art"></div>
            </div>
            <div class="health-bar-container">
              <span class="name">SHADOW NINJA</span>
              <div class="bar"><div id="player-hp-bar" class="fill" style="width: 100%;"></div></div>
            </div>
          </div>

          <div class="versus-badge">VS</div>

          <!-- Enemy Boss -->
          <div class="combatant">
            <div class="character-card-frame glow-red">
              <div class="art-placeholder sasuke-art"></div>
            </div>
            <div class="health-bar-container">
              <span class="name">JONIN SASUKE</span>
              <div class="bar"><div id="enemy-hp-bar" class="fill enemy" style="width: 100%;"></div></div>
            </div>
          </div>
        </div>

        <!-- Combat Action Console -->
        <div class="combat-console">
          <div id="combat-log" class="action-feedback-log">
            <span>⚡ Battle initialized. Choose your action!</span>
          </div>
          <div class="action-buttons">
            <button class="btn-ninja gold-border" onclick="playerAttack()">NINJUTSU STRIKE</button>
            <button class="btn-ninja" onclick="playerHeal()">CHAKRA RESTORE</button>
            <button class="btn-ninja" onclick="resetBattle()">FLEE / RESET</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SCREEN 2: CHARACTER ROSTER & INSPECT -->
    <div id="screen-roster" class="screen">
      <div class="roster-screen">
        <div class="roster-list">
          <div class="roster-card-item" onclick="inspectNinja('Shadow Ninja', '2,840', 'Jonin')">
            <span>Shadow Ninja</span> <span>[Lv. 45]</span>
          </div>
          <div class="roster-card-item" onclick="inspectNinja('Jonin Sasuke', '3,150', 'Elite')">
            <span>Jonin Sasuke</span> <span>[Lv. 50]</span>
          </div>
        </div>
        <div class="inspector-panel">
          <div class="inspector-art"></div>
          <div class="inspector-details">
            <h2 id="inspect-name">Shadow Ninja</h2>
            <p style="color: #00D9E8; font-size: 12px;" id="inspect-rank">JONIN RANK</p>
            <br>
            <div class="stat-row"><span>POWER:</span> <span id="inspect-power" style="color: #D6A93A; font-weight:bold;">2,840</span></div>
            <div class="stat-row"><span>HP:</span> <span>1,260 / 1,260</span></div>
            <div class="stat-row"><span>CHAKRA:</span> <span>850 / 850</span></div>
            <div class="stat-row"><span>SPEED:</span> <span>410</span></div>
            <br>
            <p style="font-size: 12px; color: #8899A6;">ABILITIES: Chidori, Shadow Clone, Dark Mist</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    // Screen Navigation Controller
    function switchScreen(screenName) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

      if (screenName === 'battle') {
        document.getElementById('screen-battle').classList.add('active');
        event.target.classList.add('active');
      } else if (screenName === 'roster') {
        document.getElementById('screen-roster').classList.add('active');
        event.target.classList.add('active');
      }
    }

    // Simple Interactive Battle Loop Mechanics
    let playerHp = 100;
    let enemyHp = 100;

    function playerAttack() {
      if (playerHp <= 0 || enemyHp <= 0) return;
      
      let damageToEnemy = Math.floor(Math.random() * 15) + 20;
      enemyHp = Math.max(0, enemyHp - damageToEnemy);
      document.getElementById('enemy-hp-bar').style.width = enemyHp + '%';
      
      if (enemyHp === 0) {
        document.getElementById('combat-log').innerHTML = `<span style="color: #D6A93A;">🎉 Victory! Enemy defeated.</span>`;
        return;
      }

      let damageToPlayer = Math.floor(Math.random() * 10) + 10;
      playerHp = Math.max(0, playerHp - damageToPlayer);
      document.getElementById('player-hp-bar').style.width = playerHp + '%';

      document.getElementById('combat-log').innerHTML = 
        `<span>⚡ You struck for ${damageToEnemy} damage! Sasuke counters for ${damageToPlayer}.</span>`;
      
      if (playerHp === 0) {
        document.getElementById('combat-log').innerHTML = `<span style="color: #E53935;">💀 Defeat... Your ninja fell in battle.</span>`;
      }
    }

    function playerHeal() {
      playerHp = Math.min(100, playerHp + 25);
      document.getElementById('player-hp-bar').style.width = playerHp + '%';
      document.getElementById('combat-log').innerHTML = `<span>💧 Chakra restored! Recovered health.</span>`;
    }

    function resetBattle() {
      playerHp = 100;
      enemyHp = 100;
      document.getElementById('player-hp-bar').style.width = '100%';
      document.getElementById('enemy-hp-bar').style.width = '100%';
      document.getElementById('combat-log').innerHTML = `<span>⚡ Battle reset. Ready for combat!</span>`;
    }

    // Inspect Screen Selector Logic
    function inspectNinja(name, power, rank) {
      document.getElementById('inspect-name').innerText = name;
      document.getElementById('inspect-rank').innerText = rank.toUpperCase() + ' RANK';
      document.getElementById('inspect-power').innerText = power;
    }
  </script>
</body>
</html>
