<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Difficulty Selection — Final Layout</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /* ---------- CONFIG (single place to edit) ---------- */
    :root{
      --bg-color: #000;
      --bg-image: none; /* set to url("Assets/Backgrounds/level-bg.png") if you want a background */
      --overlay-dark: rgba(0,0,0,0.22);

      /* Formation tuning (used by CSS calc rules below) */
      --anchor-left: 14%;   /* leftmost starting point (Academy) */
      --anchor-top: 92%;    /* vertical start (Academy) */
      --step-h: 9.5%;       /* horizontal step between stones */
      --step-v: 13%;        /* vertical step between stones */

      /* Icon sizing (max/min used for responsive scaling) */
      --icon-max: 140px;
      --icon-min: 72px;

      /* Canvas */
      --canvas-max-width: 1200px;
      --canvas-aspect-ratio: 16/9;
    }

    /* ---------- Base layout ---------- */
    * { box-sizing: border-box; }
    html,body { height:100%; margin:0; background:var(--bg-color); color:#eaeaea; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing:antialiased; }
    .page { min-height:100vh; padding:18px; display:flex; flex-direction:column; align-items:center; gap:12px; }

    h1 { color:#ff1a1a; margin:6px 0 6px; font-weight:700; }

    /* Canvas: 16:9 responsive area */
    .difficulty-path {
      position: relative;
      width: 100%;
      max-width: var(--canvas-max-width);
      aspect-ratio: var(--canvas-aspect-ratio);
      margin-top: 8px;
      margin-bottom: 8px;
      overflow: visible;
      border-radius: 10px;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      background-color: #0a0a0a;
    }

    /* subtle overlay to improve contrast if a background is used */
    .difficulty-path::after{
      content:"";
      position:absolute; left:0; top:0; right:0; bottom:0;
      background: var(--overlay-dark);
      pointer-events:none;
      border-radius:10px;
      z-index:1;
    }

    /* Arrow overlay fills the canvas and sits above the images */
    .arrow-overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* clicks pass through to images/buttons */
      overflow: visible;
      z-index: 5;
    }

    /* make sure difficulty-levels are above canvas background but below overlay for pointer events */
    .difficulty-level { z-index: 3; }

    /* Natural image look (no cards) */
    .difficulty-level { background: transparent; padding: 0; box-shadow: none; }
    .rock-icon { border-radius: 6px; }

    /* Positioning helpers: use CSS variables and calc for exact placement */
    /* Final positions (adjusted per your request) */
    /* Academy Student: closer to bottom-left */
    :root { --anchor-left:14%; --anchor-top:92%; --step-h:9.5%; --step-v:13%; --icon-max:140px; --icon-min:72px; }

    .academy      { left: var(--anchor-left); top: var(--anchor-top); }
    .genin        { left: calc(var(--anchor-left) + 1 * var(--step-h)); top: calc(var(--anchor-top) - 1 * var(--step-v)); }
    .chunin       { left: calc(var(--anchor-left) + 2 * var(--step-h)); top: calc(var(--anchor-top) - 2 * var(--step-v)); }
    .specialjonin { left: calc(var(--anchor-left) + 3 * var(--step-h)); top: calc(var(--anchor-top) - 3 * var(--step-v)); }
    .jonin        { left: calc(var(--anchor-left) + 4 * var(--step-h)); top: calc(var(--anchor-top) - 4 * var(--step-v)); }
    .anbu         { left: calc(var(--anchor-left) + 5 * var(--step-h)); top: calc(var(--anchor-top) - 5 * var(--step-v)); }

    /* Kage: closer to top-right */
    .kage         { left: calc(var(--anchor-left) + 6.6 * var(--step-h)); top: calc(var(--anchor-top) - 6.8 * var(--step-v)); }

    /* Paid items: slightly higher than the far bottom-right */
    .akatsuki     { left: calc(var(--anchor-left) + 6.0 * var(--step-h)); top: calc(var(--anchor-top) - 1.6 * var(--step-v)); }
    .jinchuriki   { left: calc(var(--anchor-left) + 6.8 * var(--step-h)); top: calc(var(--anchor-top) - 2.2 * var(--step-v)); }

    /* Paid badge small tweak */
    .paid-badge { font-size:11px; padding:4px 6px; margin-left:6px; vertical-align:middle; }

    /* Icon sizing: use --icon-max but clamp to container width so icons never overflow */
    .rock-icon {
      width: var(--icon-max);
      max-width: calc(100% - 12px);
      height: auto;
      display:block;
      filter: drop-shadow(0 12px 28px rgba(0,0,0,0.6));
      transition: transform .16s ease, filter .16s ease;
    }

    .difficulty-info {
      margin-top: 8px;
      color: #d0d0d0;
      font-weight: 700;
      font-size: 13px;
      text-shadow: 0 1px 0 rgba(0,0,0,0.6);
      line-height: 1;
      z-index: 4;
      position: relative;
    }

    /* ensure overlay scales on resize */
    @media (max-width:900px) {
      :root { --step-h:8%; --step-v:12%; --icon-max:120px; }
    }

    /* Additional responsive fallbacks so icons remain readable on small screens */
    @media (max-width:1400px){
      :root { --icon-max: 160px; }
    }
    @media (max-width:1100px){
      :root { --icon-max: 140px; }
      .difficulty-info { font-size: 12px; }
    }
    @media (max-width:700px){
      :root { --icon-max: 110px; --anchor-left: 18%; --anchor-top: 90%; }
      .difficulty-info { font-size: 12px; }
    }

    /* small helper so images scale smoothly */
    img.rock-icon { display:block; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Select Your Difficulty</h1>

    <div class="difficulty-path" id="difficulty-canvas">
      <!-- Optional arrow overlay (SVG or canvas) can be placed here if needed -->
      <div class="arrow-overlay" aria-hidden="true"></div>

      <!-- Stones (IDs required for positioning script) -->
      <div id="academy" class="difficulty-level academy">
        <img src="Assets/Icons/Academy student.png" class="rock-icon" alt="Academy Student">
        <div class="difficulty-info">Academy Student</div>
      </div>

      <div id="genin" class="difficulty-level genin">
        <img src="Assets/Icons/Genin.png" class="rock-icon" alt="Genin">
        <div class="difficulty-info">Genin</div>
      </div>

      <div id="chunin" class="difficulty-level chunin">
        <img src="Assets/Icons/Chunin.png" class="rock-icon" alt="Chunin">
        <div class="difficulty-info">Chunin</div>
      </div>

      <div id="specialjonin" class="difficulty-level specialjonin">
        <img src="Assets/Icons/Special Jonin.png" class="rock-icon" alt="Special Jonin">
        <div class="difficulty-info">Special Jōnin</div>
      </div>

      <div id="jonin" class="difficulty-level jonin">
        <img src="Assets/Icons/Jonin.png" class="rock-icon" alt="Jonin">
        <div class="difficulty-info">Jōnin</div>
      </div>

      <div id="anbu" class="difficulty-level anbu">
        <img src="Assets/Icons/Anbu.png" class="rock-icon" alt="ANBU">
        <div class="difficulty-info">ANBU</div>
      </div>

      <div id="kage" class="difficulty-level kage">
        <img src="Assets/Icons/Kage.png" class="rock-icon" alt="Kage">
        <div class="difficulty-info">Kage</div>
      </div>

      <!-- Paid items -->
      <div id="akatsuki" class="difficulty-level paid-level akatsuki">
        <img src="Assets/Icons/Akatsuki.png" class="rock-icon" alt="Akatsuki">
        <div class="difficulty-info">Akatsuki <span class="paid-badge">PAID</span></div>
      </div>

      <div id="jinchuriki" class="difficulty-level paid-level jinchuriki">
        <img src="Assets/Icons/Jinchuriki.png" class="rock-icon" alt="Jinchuriki">
        <div class="difficulty-info">Jinchūriki <span class="paid-badge">PAID</span></div>
      </div>
    </div>

    <div style="margin-top:6px;">
      <button onclick="alert('Back')">← Back</button>
    </div>
  </div>

  <script>
    /* JS positions the stones using the CSS-calculated left/top values.
       This keeps the layout responsive and ensures the CSS calc() positions are respected.
       The script also ensures positions are applied after layout and on resize.
    */
    (function applyPositions(){
      const ids = ['academy','genin','chunin','specialjonin','jonin','anbu','kage','akatsuki','jinchuriki'];

      function setCssPositions(){
        // Nothing to compute here — CSS classes already set left/top via calc()
        // But ensure elements are visible and reflowed after images load/resize.
        ids.forEach(id => {
          const el = document.getElementById(id);
          if(!el) return;
          // Force a reflow/read to ensure browser applies CSS calc positions
          el.getBoundingClientRect();
        });
      }

      window.addEventListener('resize', setCssPositions);
      window.addEventListener('load', ()=> setTimeout(setCssPositions, 60));
      document.querySelectorAll('.rock-icon').forEach(img => {
        if(!img.complete) img.addEventListener('load', setCssPositions);
      });

      // small helpers for live nudging from console if you want:
      window.nudgeDiagonal = function(dxPct, dyPct){
        const root = document.documentElement;
        const curLeft = parseFloat(getComputedStyle(root).getPropertyValue('--anchor-left')) || 14;
        const curTop  = parseFloat(getComputedStyle(root).getPropertyValue('--anchor-top'))  || 92;
        root.style.setProperty('--anchor-left', (curLeft + dxPct) + '%');
        root.style.setProperty('--anchor-top', (curTop + dyPct) + '%');
        setCssPositions();
      };

      window.nudgeStone = function(id, dxPct, dyPct){
        const el = document.getElementById(id);
        if(!el) return;
        const left = parseFloat(el.style.left || 0);
        const top  = parseFloat(el.style.top  || 0);
        el.style.left = (left + dxPct) + '%';
        el.style.top  = (top  + dyPct) + '%';
      };

      setCssPositions();
    })();
  </script>
</body>
</html>
