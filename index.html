<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi Chronicles</title>
    <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>

    <!-- FIXED-WIDTH APP CONTAINER (Matches .app in your CSS) -->
    <div class="app">

        <!-- Header -->
        <header>
            <h1>Shinobi Chronicles</h1>
            <div class="user">Not signed in</div>
        </header>

        <!-- Login / Register Page Panel -->
        <div class="page-panel" id="login-page">
            
            <form id="login-form">
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" value="stephenmurray91@hotmail.co.uk" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" value="12345678" placeholder="Enter password" required>
                </div>

                <button type="submit" class="primary">Login</button>
                <button type="button" class="ghost">Register</button>

            </form>

        </div>

        <!-- Difficulty Path Page Panel -->
        <div class="page-panel hidden" id="difficulty-page">
            <h2>Select Difficulty</h2>
            
            <div class="difficulty-path" id="difficulty-path">
                <!-- Rock icons will load here from game.js -->
            </div>

            <div class="controls-bar">
                <span class="hint-text">Select a level to proceed</span>
                <button class="primary" id="start-game-btn" disabled>Start Game</button>
            </div>
        </div>

    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay hidden" id="modal">
        <div class="modal-card">
            <h3 id="modal-title">Modal Title</h3>
            <div class="conversation-box" id="modal-content">
                Conversation text goes here...
            </div>
            <button class="ghost" id="modal-close-btn">Close</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
