<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi Chronicles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        
        <!-- =========================================================
             TOP HEADER
             ========================================================= -->
        <header class="game-header">
            <div class="header-brand">
                <div class="brand-logo">🍥</div>
                <div class="brand-text">
                    <span class="brand-title">SHINOBI CHRONICLES</span>
                    <span class="brand-subtitle">忍者年代記</span>
                </div>
            </div>

            <nav class="header-nav-tabs">
                <button class="nav-btn active" onclick="switchTab('village')">VILLAGE</button>
                <button class="nav-btn" onclick="switchTab('missions')">MISSIONS</button>
                <button class="nav-btn" onclick="switchTab('arena')">ARENA</button>
                <button class="nav-btn" onclick="switchTab('exams')">EXAMS</button>
                <button class="nav-btn" onclick="switchTab('practical')">PRACTICAL</button>
                <button class="nav-btn" onclick="switchTab('group')">GROUP</button>
                <button class="nav-btn" onclick="switchTab('defend')">DEFEND</button>
                <button class="nav-btn" onclick="switchTab('kage')">KAGE</button>
            </nav>

            <div class="header-right">
                <div class="currency-display">
                    <span>RYO:</span>
                    <b id="hud-ryo">14,500</b>
                </div>
                <div class="currency-display">
                    <span>CHAKRA:</span>
                    <b id="hud-chakra">1,200/1,200</b>
                </div>
                <div class="currency-display">
                    <span>RANK:</span>
                    <b id="hud-rank">Kage</b>
                </div>
            </div>
        </header>

        <!-- =========================================================
             WORLD MAP VIEWPORT
             ========================================================= -->
        <main class="world-map-viewport">
            
            <!-- MAP CANVAS CONTAINER (Locks map background and pins together) -->
            <div class="map-canvas-container">
                <div class="world-map-bg"></div>

                <!-- Region Pins (Positioned relative to map bounds) -->
                <button class="map-node-pin" style="top: 36%; left: 22%;" onclick="openRegion('Land of Wind')">
                    <div class="pin-glow" style="color: #ef4444;"></div>
                    <span class="pin-label">Land of Wind</span>
                </button>
                <button class="map-node-pin" style="top: 40%; left: 45%;" onclick="openRegion('Land of Fire')">
                    <div class="pin-glow" style="color: #00d9e8;"></div>
                    <span class="pin-label">Land of Fire</span>
                </button>
            </div>

            <!-- =========================================================
                 LEFT WORLD MAP SIDEBAR
                 ========================================================= -->
            <aside class="map-sidebar-left">

                <!-- MAP LEGEND -->
                <div class="sidebar-card">
                    <div class="sidebar-title">MAP LEGEND</div>
                    <div class="legend-items">
                        <div class="legend-row">
                            <div class="legend-dot unlocked"></div>
                            <span>Unlocked</span>
                        </div>
                        <div class="legend-row">
                            <div class="legend-dot locked"></div>
                            <span>Locked</span>
                        </div>
                        <div class="legend-row">
                            <div class="legend-dot premium"></div>
                            <span>Premium Area</span>
                        </div>
                        <div class="legend-row">
                            <div class="legend-dot threat"></div>
                            <span>High Threat</span>
                        </div>
                        <div class="legend-row">
                            <div class="legend-dot main"></div>
                            <span>Main Story Area</span>
                        </div>
                        <div class="legend-row">
                            <div class="legend-dot special"></div>
                            <span>Special Area</span>
                        </div>
                    </div>
                </div>

                <!-- CURRENT LOCATION -->
                <div class="sidebar-card interactive-loc" onclick="openRegion('Land of Fire')">
                    <div class="sidebar-title">CURRENT LOCATION</div>
                    <div class="location-preview-name">HIDDEN LEAF VILLAGE</div>
                    <div class="location-preview-sub">Land of Fire</div>
                    <button class="btn-enter-loc">EXPLORE LAND OF FIRE</button>
                </div>

                <!-- WORLD PROGRESS -->
                <div class="sidebar-card">
                    <div class="sidebar-title">WORLD PROGRESS</div>
                    <div class="progress-block">
                        <span>Regions Discovered</span>
                        <b>18 / 42</b>
                    </div>
                    <div class="progress-bar-shell">
                        <div class="progress-bar-fill" style="width: 42.8%;"></div>
                    </div>
                    <div class="progress-block" style="margin-top: 10px;">
                        <span>Missions Completed</span>
                        <b>84 / 350</b>
                    </div>
                    <div class="progress-bar-shell">
                        <div class="progress-bar-fill" style="width: 24%;"></div>
                    </div>
                </div>

            </aside>

        </main>

        <!-- =========================================================
             FOOTER DOCK
             ========================================================= -->
        <footer class="game-footer">
            <button class="footer-action-item">Quick Menu</button>
            <button class="footer-action-item">Settings</button>
            <button class="footer-action-item">Codex</button>
        </footer>

    </div>

    <script src="game.js"></script>
</body>
</html>
