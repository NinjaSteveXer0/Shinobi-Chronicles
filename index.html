<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shinobi Chronicles: World of Ninja</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- =====================================================
       POST-1992 — WORLD MAP HEADER + LOWER-GUTTER CLEANUP

       UI / Assets authority:
       - baked World Map masterbrand is the visible brand authority
       - legacy coded brand/logo block is retired on this shell
       - redundant bottom dock is removed
       - World Map terminates cleanly without a lower utility gutter
       - map canvas/aspect/hotspot geometry remain untouched
       ===================================================== -->
  <style id="world-map-shell-cleanup-post-1992">
    .game-header {
      gap: 14px;
      padding-left: 14px;
    }

    .header-ornament {
      position: relative;
      flex: 0 0 108px;
      width: 108px;
      height: 30px;
      overflow: hidden;
      border-left: 1px solid rgba(214, 169, 58, 0.42);
      border-right: 1px solid rgba(38, 52, 72, 0.72);
      background:
        linear-gradient(
          90deg,
          rgba(214, 169, 58, 0.05),
          rgba(0, 217, 232, 0.025) 58%,
          transparent
        );
      pointer-events: none;
    }

    .header-ornament::before {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      top: 50%;
      height: 1px;
      transform: translateY(-50%);
      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(214, 169, 58, 0.72) 24%,
          rgba(0, 217, 232, 0.42) 68%,
          transparent
        );
      box-shadow: 0 0 7px rgba(214, 169, 58, 0.16);
    }

    .header-ornament::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 7px;
      height: 7px;
      transform: translate(-50%, -50%) rotate(45deg);
      border: 1px solid rgba(214, 169, 58, 0.72);
      background: rgba(5, 8, 12, 0.96);
      box-shadow:
        0 0 5px rgba(214, 169, 58, 0.22),
        0 0 8px rgba(0, 217, 232, 0.08);
    }

    /*
       Removing the retired 48px footer lets the World Map viewport
       consume the shell directly. Preserve the existing map canvas
       sizing rule; do not stretch/crop/re-scale the approved map.
    */
    .world-map-viewport {
      flex: 1 1 auto;
      min-height: 0;
    }

    .world-map-display {
      padding-bottom: 0;
    }

    @media (max-width: 1320px) {
      .game-header {
        gap: 10px;
        padding-left: 10px;
        padding-right: 12px;
      }

      .header-ornament {
        flex-basis: 58px;
        width: 58px;
      }
    }

    @media (max-width: 1120px) {
      .header-ornament {
        flex-basis: 28px;
        width: 28px;
      }

      .header-ornament::before {
        left: 5px;
        right: 5px;
      }
    }
  </style>
</head>


<body>

  <!-- =====================================================
       MAIN GAME CONTAINER
       ===================================================== -->
  <div class="game-container">


    <!-- =====================================================
         TOP GAME HEADER
         ===================================================== -->
    <header class="game-header">


      <!--
        POST-1992: coded SHINOBI CHRONICLES / ramen-logo placeholder
        removed. The approved masterbrand is baked into WorldMap.png.
        This slim ornament preserves deliberate visual balance only.
      -->
      <div
        class="header-ornament"
        aria-hidden="true"
      ></div>


      <!-- =================================================
     MAIN NAVIGATION
     ================================================= -->
<nav class="header-nav-tabs">

  <button
    type="button"
    class="nav-btn nav-btn-clan"
    onclick="openOverlay('clan')"
  >
    YOUR CLAN
  </button>

  <button
    type="button"
    class="nav-btn active"
    onclick="openOverlay('village')"
  >
    VILLAGE
  </button>

  <button
    type="button"
    class="nav-btn"
    onclick="openOverlay('missions')"
  >
    MISSIONS
  </button>

  <button
    type="button"
    class="nav-btn"
    onclick="openOverlay('arena')"
  >
    ARENA
  </button>

  <button
    type="button"
    class="nav-btn"
    onclick="openKonohaExamFromVillage()"
  >
    EXAMS
  </button>

  <button
    type="button"
    class="nav-btn"
    onclick="openKonohaPracticalFromVillage()"
  >
    PRACTICAL
  </button>

  <button
    type="button"
    class="nav-btn"
    onclick="openTrainingGrounds('hub')"
  >
    TRAINING
  </button>

  <button
    type="button"
    class="nav-btn"
    onclick="openOverlay('group')"
  >
    GROUP
  </button>

  <button
    type="button"
    class="nav-btn"
    onclick="openOverlay('defend')"
  >
    DEFEND
  </button>

  <button
    type="button"
    class="nav-btn"
    onclick="openOverlay('kage')"
  >
    KAGE
  </button>

</nav>


<!-- =================================================
     PLAYER HUD
     ================================================= -->

      <div class="header-right">


        <div class="currency-display">

          <span>RYO:</span>

          <b id="hud-ryo">
            14,500
          </b>

        </div>


        <div class="currency-display">

          <span>CHAKRA:</span>

          <b id="hud-chakra">
            1200/1200
          </b>

        </div>


        <div class="currency-display">

          <span>RANK:</span>

          <b
            id="hud-rank"
            style="color: #D6A93A;"
          >
            Kage
          </b>

        </div>


      </div>

    </header>



    <main class="world-map-viewport">

  <!-- =====================================================
       LEFT COMMAND SIDEBAR
       ===================================================== -->
  <aside class="map-sidebar-left">

    <!-- CURRENT LOCATION -->
    <section class="sidebar-card sidebar-current-location">

      <div class="sidebar-title">
        CURRENT LOCATION
      </div>

      <div class="location-preview-name">
        HIDDEN LEAF VILLAGE
      </div>

      <div class="location-preview-sub">
        Land of Fire
      </div>

      <div class="location-status-row">
        <span class="status-dot online"></span>
        <span>Region Unlocked</span>
      </div>

      <button
        type="button"
        class="btn-enter-loc"
        onclick="openRegionHub('fire')"
      >
        EXPLORE LAND OF FIRE
      </button>

    </section>


    <!-- WORLD PROGRESS -->
    <section class="sidebar-card">

      <div class="sidebar-title">
        WORLD PROGRESS
      </div>

      <div class="progress-block">
        <span>Regions Discovered</span>
        <b>18 / 42</b>
      </div>

      <div class="progress-bar-shell">
        <div
          class="progress-bar-fill"
          style="width: 42%;"
        ></div>
      </div>


      <div
        class="progress-block"
        style="margin-top: 11px;"
      >
        <span>Missions Completed</span>
        <b>84 / 350</b>
      </div>

      <div class="progress-bar-shell">
        <div
          class="progress-bar-fill"
          style="width: 24%;"
        ></div>
      </div>

    </section>


    <!-- MAP LEGEND -->
    <section class="sidebar-card">

      <div class="sidebar-title">
        MAP LEGEND
      </div>

      <div class="legend-items">

        <div class="legend-row">
          <span class="legend-dot unlocked"></span>
          <span>Unlocked Region</span>
        </div>

        <div class="legend-row">
          <span class="legend-dot locked"></span>
          <span>Locked Region</span>
        </div>

        <div class="legend-row">
          <span class="legend-dot premium"></span>
          <span>Premium Area</span>
        </div>

        <div class="legend-row">
          <span class="legend-dot threat"></span>
          <span>High Threat</span>
        </div>

        <div class="legend-row">
          <span class="legend-dot main"></span>
          <span>Main Story</span>
        </div>

        <div class="legend-row">
          <span class="legend-dot special"></span>
          <span>Special Area</span>
        </div>

      </div>

    </section>


    <!-- QUICK LINKS -->
    <section class="sidebar-card sidebar-quick-links">

      <div class="sidebar-title">
        QUICK LINKS
      </div>

      <button
        class="sidebar-link"
        onclick="claimDailyReward()"
      >
        <span>🎁</span>
        <span>Daily Reward</span>
      </button>

      <button
        class="sidebar-link"
        onclick="openOverlay('events')"
      >
        <span>⚔️</span>
        <span>World Events</span>
      </button>

      <button
        class="sidebar-link"
        onclick="openOverlay('shop')"
      >
        <span>🛒</span>
        <span>Special Shop</span>
      </button>

    </section>

  </aside>


  <!-- =====================================================
       MAP DISPLAY AREA
       ===================================================== -->
  <section class="world-map-display">

    <!--
      IMPORTANT:
      The image and EVERY marker now live inside this one canvas.
      Therefore marker percentages are percentages of the MAP,
      not percentages of the browser viewport.
    -->
    <div class="world-map-canvas">

      <img
        class="world-map-image"
        src="Backgrounds/WorldMap.png"
        alt="Shinobi Chronicles World Map"
      >


      <!-- LAND OF EARTH -->
<button
  type="button"
  class="map-node-pin pin-earth"
  style="left: 17%; top: 27%;"
  onclick="openRegionHub('earth')"
  aria-label="Open Land of Earth"
>
  <span class="pin-glow"></span>
  <span class="pin-label">Land of Earth</span>
</button>


<!-- LAND OF WIND -->
<button
  type="button"
  class="map-node-pin pin-wind"
  style="left: 18%; top: 43%;"
  onclick="openRegionHub('wind')"
  aria-label="Open Land of Wind"
>
  <span class="pin-glow"></span>
  <span class="pin-label">Land of Wind</span>
</button>


<!-- LAND OF FIRE -->
<button
  type="button"
  class="map-node-pin pin-fire"
  style="left: 36%; top: 48%;"
  onclick="openRegionHub('fire')"
  aria-label="Open Land of Fire"
>
  <span class="pin-glow"></span>
  <span class="pin-label">Land of Fire</span>
</button>


<!-- LAND OF WATER -->
<button
  type="button"
  class="map-node-pin pin-water"
  style="left: 53%; top: 59%;"
  onclick="openRegionHub('water')"
  aria-label="Open Land of Water"
>
  <span class="pin-glow"></span>
  <span class="pin-label">Land of Water</span>
</button>


<!-- LAND OF LIGHTNING -->
<button
  type="button"
  class="map-node-pin pin-lightning"
  style="left: 69%; top: 58%;"
  onclick="openRegionHub('lightning')"
  aria-label="Open Land of Lightning"
>
  <span class="pin-glow"></span>
  <span class="pin-label">Land of Lightning</span>
</button>

</div> <!-- CLOSE .world-map-canvas -->

</section>

</main>


    <!--
      POST-1992: legacy bottom game dock removed.
      Daily Reward / Events / Special Shop remain available from
      the existing Quick Links panel in the left sidebar.
    -->


    <!-- =====================================================
         GLOBAL SCREEN OVERLAY

         IMPORTANT:
         This lives INSIDE .game-container.

         That means your existing absolute positioning works
         reliably against the entire game screen.
         ===================================================== -->
    <div
      id="screen-overlay"
      class="screen-overlay"
      style="display: none;"
    >


      <div class="overlay-content-box">


        <!-- CLOSE BUTTON -->
        <button
          type="button"
          class="overlay-close-btn"
          onclick="closeOverlay()"
        >
          ✕ CLOSE
        </button>



        <!--
            JS injects:

            Village
            Missions
            Battle
            Region Map
            Roster
            Shop
            etc.

            into this container.
        -->
        <div
          id="overlay-content-container"
          style="
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
          "
        >
        </div>


      </div>


    </div>


  </div>



  <!-- =====================================================
       GAME JAVASCRIPT
       ===================================================== -->
  <script src="game.js"></script>


</body>

</html>
