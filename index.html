<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shinobi Chronicles - Dark Anime RPG</title>
  <style>
    /* ==========================================
       SECTION 1: GLOBAL RESET & BASE STYLES
       ========================================== */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body { 
      background-color: #040608; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      color: #FFFFFF; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      overflow: hidden; 
    }

    /* ==========================================
       SECTION 2: MAIN APP CONTAINER & HUD
       ========================================== */
    .game-container { 
      position: relative; 
      width: 960px; 
      height: 640px; 
      background-color: #080C10; 
      border: 1px solid #082B30; 
      border-radius: 12px; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9); 
    }

    .game-header { 
      height: 50px; 
      background: rgba(8, 12, 16, 0.95); 
      border-bottom: 1px solid #082B30; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0 20px; 
      z-index: 10;
    }

    .hud-stats { 
      display: flex; 
      gap: 20px; 
      font-size: 13px; 
      font-weight: bold; 
    }

    .hud-item span { 
      color: #00D9E8; 
    }

    .nav-tabs { 
      display: flex; 
      gap: 10px; 
    }

    .nav-tab { 
      background: #082B30; 
      border: 1px solid #00D9E8; 
      color: #FFF; 
      padding: 5px 12px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 12px; 
      font-weight: bold; 
      transition: all 0.2s; 
    }

    .nav-tab:hover, .nav-tab.active { 
      background: #00D9E8; 
      color: #080C10; 
    }

    .screen { 
      display: none; 
      flex: 1; 
      position: relative; 
      flex-direction: column; 
    }

    .screen.active { 
      display: flex; 
    }

    /* ==========================================
       SECTION 3: BATTLE ARENA & ANIMATED ENVIRONMENT
       ========================================== */
    .battle-arena { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      position: relative; 
      overflow: hidden;
    }

    .battle-environment {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: rgba(214, 169, 58, 0.4);
      border-radius: 50%;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-500px) translateX(50px); opacity: 0; }
    }

    /* ==========================================
       SECTION 4: CHARACTER CARD SYSTEM
       ========================================== */
    .combatants-stage { 
      position: relative; 
      z-index: 2; 
      display: flex; 
      justify-content: space-around; 
      align-items: center; 
      padding: 20px; 
      flex: 1; 
    }

    .combatant { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 10px; 
    }

    .character-card-frame { 
      width: 190px; 
      height: 270px; 
      background: #080C10; 
      border-radius: 10px; 
      border: 2px solid #082B30; 
      overflow: hidden; 
      position: relative; 
      display: flex; 
      flex-direction: column; 
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7); 
      transition: all 0.3s ease;
    }

    .character-card-frame:hover {
      transform: translateY(-6px) scale(1.02);
    }

    .card-rarity-legendary { 
      border-color: #D6A93A !important; 
      box-shadow: 0 0 20px rgba(214, 169, 58, 0.35); 
    }

    .card-rarity-rare { 
      border-color: #00D9E8 !important; 
      box-shadow: 0 0 20px rgba(0, 217, 232, 0.35); 
    }

    .card-header-tag { 
      position: absolute; 
      top: 8px; 
      left: 8px; 
      background: rgba(8, 12, 16, 0.85); 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      padding: 2px 6px; 
      border-radius: 4px; 
      font-size: 10px; 
      font-weight: bold; 
      color: #D6A93A; 
      z-index: 3; 
    }

    .card-art-container { 
      width: 100%; 
      height: 175px; 
      background: #121c24; 
    }

    .card-footer-stats { 
      flex: 1; 
      background: rgba(8, 12, 16, 0.95); 
      border-top: 1px solid #082B30; 
      padding: 10px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }

    .card-title { 
      font-size: 11px; 
      font-weight: bold; 
      color: #FFFFFF; 
    }

    .card-stats-row { 
      display: flex; 
      justify-content: space-between; 
      font-size: 10px; 
      color: #8899A6; 
    }

    .card-stats-row b { 
      color: #00D9E8; 
    }

    .versus-badge { 
      font-size: 22px; 
      font-weight: 900; 
      color: #D6A93A; 
    }

    /* ==========================================
       SECTION 5: HEALTH BARS & COMBAT CONSOLE
       ========================================== */
    .health-bar-container { 
      width: 190px; 
      text-align: center; 
      z-index: 2;
    }

    .name { 
      font-size: 11px; 
      font-weight: bold; 
      color: #C0C0C0; 
    }

    .bar { 
      width: 100%; 
      height: 8px; 
      background: #040608; 
      border: 1px solid #082B30; 
      border-radius: 4px; 
      overflow: hidden;
    }

    .fill { 
      height: 100%; 
      background: #00D9E8; 
      transition: width 0.3s ease;
    }

    .fill.enemy { 
      background: #E53935; 
    }

    .combat-console { 
      position: relative;
      z-index: 2;
      background: rgba(8, 12, 16, 0.95); 
      border-top: 1px solid #082B30; 
      padding: 15px; 
    }

    .action-feedback-log {
      font-size: 13px;
    }

    .action-buttons { 
      display: flex; 
      gap: 10px; 
      margin-top: 10px; 
    }

    .btn-ninja { 
      flex: 1; 
      background: #082B30; 
      color: #FFF; 
      border: 1px solid #00D9E8; 
      padding: 10px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      transition: all 0.2s;
    }

    .btn-ninja:hover { 
      background: #00D9E8; 
      color: #080C10; 
    }
  </style>
</head>
<body>

  <!-- ==========================================
     MAIN APP WRAPPER
     ========================================== -->
  <div class="game-container">
    
    <!-- TOP NAVIGATION / HUD -->
    <div class="game-header">
     <div class="hud-stats">
        <div class="hud-item">RYO: <span id="hud-ryo">14,500</span></div>
        <div class="hud-item">CHAKRA: <span id="hud-chakra">850/850</span></div>
        <div class="hud-item">RANK: <span>Jonin</span></div>
      </div>
      <div class="nav-tabs">
        <button class="nav-tab active">BATTLE</button>
        <button class="nav-tab">ROSTER</button>
      </div>
    </div>

    <!-- SCREEN 1: BATTLE ARENA -->
    <div id="screen-battle" class="screen active">
      <div class="battle-arena">
        
        <!-- Environment Animation Layer -->
        <div class="battle-environment" id="particle-container"></div>

        <!-- Combatants Stage (Cards and Versus) -->
        <div class="combatants-stage">
          
          <!-- Player Card -->
          <div class="combatant">
            <div class="character-card-frame card-rarity-rare">
              <div class="card-header-tag">RTE-01</div>
              <div class="card-art-container"></div>
              <div class="card-footer-stats">
                <div class="card-title">SHADOW NINJA</div>
                <div class="card-stats-row"><span>ATK: <b>340</b></span><span>DEF: <b>280</b></span></div>
              </div>
            </div>
            <div class="health-bar-container">
              <span class="name">SHADOW NINJA</span>
              <div class="bar"><div id="player-fill-bar" class="fill" style="width: 100%;"></div></div>
            </div>
          </div>

          <!-- VS Badge -->
          <div class="versus-badge">VS</div>

          <!-- Enemy Card -->
          <div class="combatant">
            <div class="character-card-frame card-rarity-legendary">
              <div class="card-header-tag">ELITE</div>
              <div class="card-art-container"></div>
              <div class="card-footer-stats">
                <div class="card-title">JONIN SASUKE</div>
                <div class="card-stats-row"><span>ATK: <b>420</b></span><span>DEF: <b>350</b></span></div>
              </div>
            </div>
            <div class="health-bar-container">
              <span class="name">JONIN SASUKE</span>
              <div class="bar"><div id="enemy-fill-bar" class="fill enemy" style="width: 100%;"></div></div>
            </div>
          </div>

        </div>

        <!-- Combat Console -->
        <div class="combat-console">
          <div id="combat-log" class="action-feedback-log" style="color: #00D9E8;">⚡ Battle ready. Choose your action, Shinobi.</div>
          <div class="action-buttons">
            <button class="btn-ninja" onclick="performNinjutsuStrike()">NINJUTSU STRIKE</button>
            <button class="btn-ninja" onclick="performChakraRestore()">CHAKRA RESTORE</button>
            <button class="btn-ninja" onclick="performFlee()">FLEE</button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- ==========================================
     JAVASCRIPT CONTROLLERS & LOGIC
     ========================================== -->
  <script>
    // Initialize Animated Background Particles (Embers)
    const container = document.getElementById('particle-container');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 4 + 2;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 5 + 5) + 's';
      p.style.animationDelay = Math.random() * 5 + 's';
      container.appendChild(p);
    }

    // Battle State Logic
    let playerHp = 100;
    let enemyHp = 100;

    function playerAttack() {
      if (playerHp <= 0 || enemyHp <= 0) return;
      
      let damageToEnemy = Math.floor(Math.random() * 15) + 20;
      enemyHp = Math.max(0, enemyHp - damageToEnemy);
      document.getElementById('enemy-hp-bar').style.width = enemyHp + '%';
      
      if (enemyHp === 0) {
        document.getElementById('combat-log').innerHTML = `<span style="color: #D6A93A;">🎉 Victory! Enemy defeated.</span>`;
        return;
      }

      let damageToPlayer = Math.floor(Math.random() * 10) + 10;
      playerHp = Math.max(0, playerHp - damageToPlayer);
      document.getElementById('player-hp-bar').style.width = playerHp + '%';

      document.getElementById('combat-log').innerHTML = 
        `<span>⚡ You struck for ${damageToEnemy} damage! Sasuke counters for ${damageToPlayer}.</span>`;
      
      if (playerHp === 0) {
        document.getElementById('combat-log').innerHTML = `<span style="color: #E53935;">💀 Defeat... Your ninja fell in battle.</span>`;
      }
    }

    function playerHeal() {
      playerHp = Math.min(100, playerHp + 25);
      document.getElementById('player-hp-bar').style.width = playerHp + '%';
      document.getElementById('combat-log').innerHTML = `<span>💧 Chakra restored! Recovered health.</span>`;
    }

    function resetBattle() {
      playerHp = 100;
      enemyHp = 100;
      document.getElementById('player-hp-bar').style.width = '100%';
      document.getElementById('enemy-hp-bar').style.width = '100%';
      document.getElementById('combat-log').innerHTML = `<span>⚡ Battle reset. Ready for combat!</span>`;
    }
  </script>
</body>
</html>
