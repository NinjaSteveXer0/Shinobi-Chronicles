<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shinobi Chronicles - Dark Anime RPG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #040608; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #FFFFFF; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    .game-container { position: relative; width: 960px; height: 640px; background-color: #080C10; border: 1px solid #082B30; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9); }
    .game-header { height: 50px; background: rgba(8, 12, 16, 0.95); border-bottom: 1px solid #082B30; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
    .hud-stats { display: flex; gap: 20px; font-size: 13px; font-weight: bold; }
    .hud-item span { color: #00D9E8; }
    .nav-tabs { display: flex; gap: 10px; }
    .nav-tab { background: #082B30; border: 1px solid #00D9E8; color: #FFF; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: all 0.2s; }
    .nav-tab:hover, .nav-tab.active { background: #00D9E8; color: #080C10; }
    .screen { display: none; flex: 1; position: relative; flex-direction: column; }
    .screen.active { display: flex; }
    
    /* Battle & Cards */
    .battle-arena { flex: 1; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .combatants-stage { position: relative; z-index: 2; display: flex; justify-content: space-around; align-items: center; padding: 20px; flex: 1; }
    .combatant { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .character-card-frame { width: 190px; height: 270px; background: #080C10; border-radius: 10px; border: 2px solid #082B30; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7); }
    .card-rarity-legendary { border-color: #D6A93A !important; box-shadow: 0 0 20px rgba(214, 169, 58, 0.35); }
    .card-rarity-rare { border-color: #00D9E8 !important; box-shadow: 0 0 20px rgba(0, 217, 232, 0.35); }
    .card-header-tag { position: absolute; top: 8px; left: 8px; background: rgba(8, 12, 16, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; color: #D6A93A; z-index: 3; }
    .card-art-container { width: 100%; height: 175px; background: #121c24; }
    .card-footer-stats { flex: 1; background: rgba(8, 12, 16, 0.95); border-top: 1px solid #082B30; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 11px; font-weight: bold; color: #FFFFFF; }
    .card-stats-row { display: flex; justify-content: space-between; font-size: 10px; color: #8899A6; }
    .card-stats-row b { color: #00D9E8; }
    
    .versus-badge { font-size: 22px; font-weight: 900; color: #D6A93A; }
    .health-bar-container { width: 190px; text-align: center; }
    .name { font-size: 11px; font-weight: bold; color: #C0C0C0; }
    .bar { width: 100%; height: 8px; background: #040608; border: 1px solid #082B30; border-radius: 4px; }
    .fill { height: 100%; background: #00D9E8; }
    .fill.enemy { background: #E53935; }
    .combat-console { background: rgba(8, 12, 16, 0.95); border-top: 1px solid #082B30; padding: 15px; }
    .action-buttons { display: flex; gap: 10px; margin-top: 10px; }
    .btn-ninja { flex: 1; background: #082B30; color: #FFF; border: 1px solid #00D9E8; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-ninja:hover { background: #00D9E8; color: #080C10; }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="game-header">
      <div class="hud-stats">
        <div class="hud-item">RYO: <span>14,500</span></div>
        <div class="hud-item">CHAKRA: <span>850/850</span></div>
        <div class="hud-item">RANK: <span>Jonin</span></div>
      </div>
      <div class="nav-tabs">
        <button class="nav-tab active">BATTLE</button>
        <button class="nav-tab">ROSTER</button>
      </div>
    </div>

    <div id="screen-battle" class="screen active">
      <div class="battle-arena">
        <div class="combatants-stage">
          <div class="combatant">
            <div class="character-card-frame card-rarity-rare">
              <div class="card-header-tag">RTE-01</div>
              <div class="card-art-container"></div>
              <div class="card-footer-stats">
                <div class="card-title">SHADOW NINJA</div>
                <div class="card-stats-row"><span>ATK: <b>340</b></span><span>DEF: <b>280</b></span></div>
              </div>
            </div>
            <div class="health-bar-container"><span class="name">SHADOW NINJA</span><div class="bar"><div class="fill" style="width: 100%;"></div></div></div>
          </div>

          <div class="versus-badge">VS</div>

          <div class="combatant">
            <div class="character-card-frame card-rarity-legendary">
              <div class="card-header-tag">ELITE</div>
              <div class="card-art-container"></div>
              <div class="card-footer-stats">
                <div class="card-title">JONIN SASUKE</div>
                <div class="card-stats-row"><span>ATK: <b>420</b></span><span>DEF: <b>350</b></span></div>
              </div>
            </div>
            <div class="health-bar-container"><span class="name">JONIN SASUKE</span><div class="bar"><div class="fill enemy" style="width: 100%;"></div></div></div>
          </div>
        </div>

        <div class="combat-console">
          <div class="action-feedback-log" style="color: #00D9E8;">⚡ Battle ready. Choose action.</div>
          <div class="action-buttons">
            <button class="btn-ninja">NINJUTSU STRIKE</button>
            <button class="btn-ninja">CHAKRA RESTORE</button>
            <button class="btn-ninja">FLEE</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
