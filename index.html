<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shinobi Chronicles — Difficulty</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg-color:#050405;
      --accent:#ff1a1a;
      --muted:#cfcfcf;
      --overlay-dark:rgba(0,0,0,0.28);
      --anchor-left:10%;
      --anchor-top:88%;
      --step-h:12%;
      --step-v:14%;
      --icon-size:160px; /* larger icons */
      --icon-min:96px;
      --paid-offset-x:6.0;
      --canvas-max-width:1200px;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg-color);color:#eaeaea;font-family:Arial,Helvetica,sans-serif}
    .app{min-height:100vh;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}

    header{width:100%;max-width:var(--canvas-max-width);display:flex;justify-content:space-between;align-items:center}
    header h1{color:var(--accent);margin:0;font-size:20px}
    header .user{color:var(--muted);font-size:13px}

    .page-panel{width:100%;max-width:var(--canvas-max-width);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.22));border-radius:10px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
    .hidden{display:none}

    /* Difficulty canvas */
    .difficulty-path{
      position:relative;width:100%;max-width:var(--canvas-max-width);aspect-ratio:16/9;margin-top:8px;margin-bottom:8px;
      overflow:visible;border-radius:10px;background-size:cover;background-position:center;
      background-repeat:no-repeat;box-shadow:0 8px 30px rgba(0,0,0,0.6);background-color:#0a0a0a;
    }
    .difficulty-path::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:var(--overlay-dark);pointer-events:none;border-radius:10px;z-index:1}
    .difficulty-level{
      position:absolute;transform:translate(-50%,-50%);z-index:4;background:transparent;padding:0;box-shadow:none;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto;
      transition:transform .18s ease,filter .18s ease,opacity .18s ease;
    }

    /* Large stepping stone icons */
    .rock-icon{
      width:var(--icon-size);
      height:auto;
      max-width:calc(100% - 12px);
      border-radius:14px;
      object-fit:cover;
      filter:drop-shadow(0 18px 36px rgba(0,0,0,0.7));
      transition:transform .18s ease,filter .18s ease,opacity .18s ease;
      background:linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.28));
      border:2px solid rgba(255,255,255,0.02);
    }
    .difficulty-level:hover .rock-icon{transform:translateY(-8px) scale(1.04);filter:drop-shadow(0 30px 60px rgba(0,0,0,0.8))}

    .difficulty-info{margin-top:6px;color:#e6e6e6;font-weight:700;font-size:14px;text-shadow:0 1px 0 rgba(0,0,0,0.6);line-height:1;z-index:5;position:relative}
    .paid-badge{font-size:12px;padding:4px 6px;margin-left:6px;vertical-align:middle;background:rgba(255,26,26,0.08);color:var(--accent);border-radius:999px;border:1px solid rgba(255,26,26,0.06)}

    /* Disabled / locked visuals */
    .difficulty-level.disabled .rock-icon{filter:grayscale(0.7) brightness(0.55);opacity:0.55;cursor:not-allowed}
    .difficulty-level.locked .rock-icon{filter:grayscale(0.9) brightness(0.5);opacity:0.6;cursor:pointer}
    .difficulty-level.selected .rock-icon{outline:4px solid rgba(255,26,26,0.12);transform:translateY(-10px) scale(1.06)}

    /* Make icons responsive */
    @media (max-width:1200px){:root{--icon-size:140px;--step-h:11%}}
    @media (max-width:900px){:root{--icon-size:120px;--step-h:10%;--step-v:12%}}
    @media (max-width:700px){:root{--icon-size:96px;--anchor-left:14%;--anchor-top:90%;--step-h:9%;--step-v:11%}}

    /* Controls */
    .controls{margin-top:12px;display:flex;gap:8px;align-items:center}
    button.primary{background:linear-gradient(180deg,var(--accent),#c71f1f);border:none;color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer}
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer}

    /* small hint */
    .hint{color:var(--muted);font-size:13px;margin-left:8px}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Shinobi Chronicles</h1>
      <div class="user" id="header-user">Not signed in</div>
    </header>

    <!-- Difficulty page (this file focuses on difficulty canvas) -->
    <section id="difficulty-page" class="page-panel">
      <h2>Select Difficulty</h2>

      <div class="difficulty-path" id="difficulty-canvas" aria-label="Difficulty path">
        <div class="arrow-overlay" aria-hidden="true"></div>

        <!-- Stepping stones (IDs and data-level used by game.js) -->
        <div id="academy" class="difficulty-level academy" data-level="academy" aria-label="Academy Student">
          <img src="Assets/Icons/Academy student.png" class="rock-icon" alt="Academy Student">
          <div class="difficulty-info">Academy Student</div>
        </div>

        <div id="genin" class="difficulty-level genin disabled" data-level="genin" aria-label="Genin">
          <img src="Assets/Icons/Genin.png" class="rock-icon" alt="Genin">
          <div class="difficulty-info">Genin</div>
        </div>

        <div id="chunin" class="difficulty-level chunin disabled" data-level="chunin" aria-label="Chunin">
          <img src="Assets/Icons/Chunin.png" class="rock-icon" alt="Chunin">
          <div class="difficulty-info">Chunin</div>
        </div>

        <div id="specialjonin" class="difficulty-level specialjonin locked" data-level="specialjonin" aria-label="Special Jonin">
          <img src="Assets/Icons/Special Jonin.png" class="rock-icon" alt="Special Jonin">
          <div class="difficulty-info">Special Jōnin <span class="paid-badge">PAID</span></div>
        </div>

        <div id="jonin" class="difficulty-level jonin disabled" data-level="jonin" aria-label="Jonin">
          <img src="Assets/Icons/Jonin.png" class="rock-icon" alt="Jonin">
          <div class="difficulty-info">Jōnin</div>
        </div>

        <div id="anbu" class="difficulty-level anbu disabled" data-level="anbu" aria-label="ANBU">
          <img src="Assets/Icons/Anbu.png" class="rock-icon" alt="ANBU">
          <div class="difficulty-info">ANBU</div>
        </div>

        <div id="kage" class="difficulty-level kage disabled" data-level="kage" aria-label="Kage">
          <img src="Assets/Icons/Kage.png" class="rock-icon" alt="Kage">
          <div class="difficulty-info">Kage</div>
        </div>

        <div id="akatsuki" class="difficulty-level paid-level locked akatsuki" data-level="akatsuki" aria-label="Akatsuki">
          <img src="Assets/Icons/Akatsuki.png" class="rock-icon" alt="Akatsuki">
          <div class="difficulty-info">Akatsuki <span class="paid-badge">PAID</span></div>
        </div>

        <div id="jinchuriki" class="difficulty-level paid-level locked jinchuriki" data-level="jinchuriki" aria-label="Jinchuriki">
          <img src="Assets/Icons/Jinchuriki.png" class="rock-icon" alt="Jinchuriki">
          <div class="difficulty-info">Jinchūriki <span class="paid-badge">PAID</span></div>
        </div>
      </div>

      <div class="controls">
        <button class="ghost" onclick="goBackToJourney()">← Back</button>
        <div class="hint">Only Academy Student is selectable. Use arrow keys to navigate.</div>
      </div>
    </section>

  </div>

  <script src="game.js"></script>
</body>
</html>
