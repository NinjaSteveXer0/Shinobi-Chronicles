<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shinobi Chronicles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <!-- TOP HEADER -->
    <header class="game-header">
      <div class="header-brand">
        <span class="brand-logo">🍥</span>
        <div>
          <h1 class="brand-title">SHINOBI CHRONICLES</h1>
          <span class="brand-subtitle">忍者年代記</span>
        </div>
      </div>
      <div class="header-nav-tabs">
        <button class="nav-btn active" onclick="openOverlay('village')">VILLAGE</button>
        <button class="nav-btn" onclick="openOverlay('missions')">MISSIONS</button>
        <button class="nav-btn" onclick="openOverlay('battle')">ARENA</button>
      </div>
      <div class="header-right">
        <div class="currency-display"><span>RYO:</span> <b>14,500</b></div>
        <div class="currency-display"><span>CHAKRA:</span> <b>1200/1200</b></div>
        <div class="currency-display"><span>RANK:</span> <b style="color: #D6A93A;">Kage</b></div>
      </div>
    </header>

    <!-- WORLD MAP VIEWPORT -->
    <main class="world-map-viewport">
      <div class="world-map-bg"></div>

      <!-- LEFT SIDEBAR (Single Instance) -->
      <aside class="map-sidebar-left">
        <div class="sidebar-card">
          <div class="sidebar-title">CURRENT LOCATION</div>
          <div class="location-preview-name">HIDDEN LEAF VILLAGE</div>
          <div class="location-preview-sub">Land of Fire</div>
          <button class="btn-enter-loc" onclick="openOverlay('village')">ENTER VILLAGE</button>
        </div>

        <div class="sidebar-card">
          <div class="sidebar-title">WORLD PROGRESS</div>
          <div class="progress-block"><span>Regions Discovered</span><b>18 / 42</b></div>
          <div class="progress-bar-shell"><div class="progress-bar-fill" style="width: 42%;"></div></div>
          <div class="progress-block" style="margin-top: 8px;"><span>Missions Completed</span><b>84 / 350</b></div>
          <div class="progress-bar-shell"><div class="progress-bar-fill" style="width: 24%;"></div></div>
        </div>
      </aside>

      <!-- Clickable World Map Region Pin Example -->
      <div class="map-node-pin" style="left: 48%; top: 40%;" onclick="openRegionHub('fire')">
        <div class="pin-glow"></div>
        <span class="pin-label">Land of Fire</span>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="game-footer">
      <div class="footer-action-item" onclick="claimDailyReward()">Claim Daily Reward</div>
    </footer>
  </div>

  <!-- SCREEN OVERLAY MODAL -->
  <div id="screen-overlay" class="screen-overlay" style="display: none;">
    <div class="overlay-content-box">
      <button class="overlay-close-btn" onclick="closeOverlay()">✕ CLOSE</button>
      <div id="overlay-content-container" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        <!-- Dynamic content injected via game.js -->
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
