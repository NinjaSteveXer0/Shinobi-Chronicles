name: Issue 621 One-Shot Browser Sample Guard

# Temporary branch-only maintenance workflow. Delete after the QA-only patch lands.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/621-region-hud-stability-lane-c
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Correct impossible temporal sample-count guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/qa_issue_621_region_hud_stability_browser.js')
          text = path.read_text()
          old = 'assert(samples.length>=20,`${label}: insufficient samples`);'
          new = 'assert(samples.length>=10,`${label}: insufficient samples`);'
          if old in text:
              text = text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('expected #621 browser sample assertion seam not found')
          path.write_text(text)
          PY
          node --check tools/qa_issue_621_region_hud_stability_browser.js
      - name: Commit QA-only correction if needed
        run: |
          if git diff --quiet -- tools/qa_issue_621_region_hud_stability_browser.js; then
            echo 'QA-only correction already present.'
            exit 0
          fi
          git config user.name 'NinjaSteveXer0'
          git config user.email 'sc68957hcm@privaterelay.appleid.com'
          git add tools/qa_issue_621_region_hud_stability_browser.js
          git commit -m '#621 correct impossible browser temporal sample guard'
          git push origin HEAD:coding/621-region-hud-stability-lane-c
