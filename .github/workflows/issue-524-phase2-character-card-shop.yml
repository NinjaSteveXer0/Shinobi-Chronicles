name: Issue 524 Phase 2 Character Card Shop

on:
  push:
    branches:
      - coding/phase2-character-card-shop-524
    paths:
      - 'index.html'
      - 'runtime/alpha-phase2-character-card-shop-52400.js'
      - 'runtime/alpha-runtime-build-fingerprint-303.js'
      - 'tools/fixtures/runtime_build_manifest_303.json'
      - 'tools/fixtures/runtime_change_declarations_300.json'
      - 'tools/fixtures/runtime_responsibility_registry_300.json'
      - 'tools/qa_issue_141_pre_alpha_runtime_closure.py'
      - 'tools/qa_phase2_character_card_shop_524.js'
      - 'tools/qa_phase2_character_card_shop_524_browser.js'
      - '.github/workflows/issue-524-phase2-character-card-shop.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-character-card-shop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Source syntax
        run: |
          node --check runtime/alpha-phase2-character-card-shop-52400.js
          node --check tools/qa_phase2_character_card_shop_524.js
          node --check tools/qa_phase2_character_card_shop_524_browser.js

      - name: Character Card Shop static transaction contract
        run: node tools/qa_phase2_character_card_shop_524.js

      - name: Runtime build fingerprint
        run: node tools/qa_issue_303_runtime_build_fingerprint.js

      - name: Runtime ownership safety
        run: node tools/qa_runtime_ownership_safety_300.js

      - name: Existing save compatibility
        run: node tools/qa_save_compatibility_311.js

      - name: Basic Item Shop regression
        run: node tools/qa_phase2_basic_item_shop_517.js

      - name: Inventory regression
        run: node tools/qa_phase2_inventory_core_461.js

      - name: Live HUD regression
        run: node tools/qa_phase2_live_hud_499.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > phase2-524-server.log 2>&1 &
          echo $! > phase2-524-server.pid
          sleep 2

      - name: Installed-browser Character Card Shop
        run: node tools/qa_phase2_character_card_shop_524_browser.js

      - name: Existing Basic Item Shop installed-browser regression
        run: node tools/qa_phase2_basic_item_shop_517_browser.js

      - name: Existing live HUD installed-browser regression
        run: node tools/qa_phase2_live_hud_499_browser.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-character-card-shop-524-browser
          path: |
            artifacts/phase2-character-card-shop-524
            artifacts/phase2-basic-item-shop-517
            artifacts/phase2-live-hud-499
            phase2-524-server.log
          if-no-files-found: ignore
