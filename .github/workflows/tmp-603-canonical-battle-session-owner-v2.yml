name: TMP 603 Canonical Battle Session Owner V2
on:
  push:
    branches:
      - coding/603-step7-promotion-integration
    paths:
      - .github/workflows/tmp-603-canonical-battle-session-owner-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/603-step7-promotion-integration
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply canonical session-owner repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64

          courier=Path('runtime/alpha-promotion-courier-assessment-60310.js')
          text=courier.read_text(encoding='utf-8')
          start=text.find('function readPromotionCourierBattleTestState60310(){')
          end=text.find('function expireRogueFeintAtActionOpportunity60310(){')
          if start<0 or end<0 or end<=start:
              raise SystemExit(f'wrapper block not found start={start} end={end}')
          text=text[:start]+text[end:]
          anchor='function battleApis(){'
          if text.count(anchor)!=1:
              raise SystemExit(f'battleApis anchor count={text.count(anchor)}')
          helpers=base64.b64decode('').decode()
          text=text.replace(anchor,helpers+anchor,1)
          old_api='applyEligibleRewards,expireRogueFeintAtActionOpportunity:expireRogueFeintAtActionOpportunity60310,runDiagnostics:diagnostics'
          new_api='applyEligibleRewards,registerBattleEnemyProfile:registerRogue,captureBattleSessionState:captureBattleSessionState60310,prepareBattleSessionRestore:prepareBattleSessionRestore60310,restoreBattleSessionState:restoreBattleSessionState60310,expireRogueFeintAtActionOpportunity:expireRogueFeintAtActionOpportunity60310,runDiagnostics:diagnostics'
          if text.count(old_api)!=1:
              raise SystemExit(f'api export anchor count={text.count(old_api)}')
          text=text.replace(old_api,new_api,1)
          for forbidden in ['globalThis.saveTestState=function','globalThis.restoreTestState=function','PRE_SAVE_TEST_STATE_60310','PRE_RESTORE_TEST_STATE_60310']:
              if forbidden in text: raise SystemExit(f'wrapper leftover: {forbidden}')
          courier.write_text(text,encoding='utf-8')

          game=Path('game.js')
          g=game.read_text(encoding='utf-8')
          save_start=g.find('function saveTestState()')
          restore_start=g.find('function restoreTestState()')
          if save_start<0 or restore_start<0 or restore_start<=save_start:
              raise SystemExit('canonical save/restore owner missing')
          save_slice=g[save_start:restore_start]
          m=re.search(r'\n\s*battleReturnContext:\s*\n\s*normalizeBattleReturnContext\(currentBattle\.returnContext\),',save_slice)
          if not m: raise SystemExit('battleReturnContext save anchor missing')
          savefield=base64.b64decode('').decode()
          save_slice=save_slice[:m.end()]+"\n"+savefield+save_slice[m.end():]
          g=g[:save_start]+save_slice+g[restore_start:]

          restore_start=g.find('function restoreTestState()')
          tail=g[restore_start:]
          sm=re.search(r'(?m)^[ \t]*(?:const|let)\s+state\s*=\s*[^;\n]+;',tail[:14000])
          if not sm:
              print(tail[:7000])
              raise SystemExit('restore state binding missing')
          pre=base64.b64decode('').decode()
          tail=tail[:sm.end()]+"\n"+pre+tail[sm.end():]

          pm=re.search(r'(?m)^[ \t]*if\s*\(\s*state\.overlayType\s*===?\s*["\']combat["\']',tail)
          if not pm:
              pm=re.search(r'(?m)^[ \t]*if\s*\(\s*currentBattle\.defeat',tail)
          if not pm:
              print(tail[:14000])
              raise SystemExit('restore presentation anchor missing')
          post=base64.b64decode('').decode()
          tail=tail[:pm.start()]+post+tail[pm.start():]
          g=g[:restore_start]+tail
          game.write_text(g,encoding='utf-8')

          guard=Path('tools/qa_issue_603_installed_integration.js')
          q=guard.read_text(encoding='utf-8')
          old="  courierMidBattleRestore:read('runtime/alpha-promotion-courier-assessment-60310.js').includes('PRE_SAVE_TEST_STATE_60310')&&read('runtime/alpha-promotion-courier-assessment-60310.js').includes('PRE_RESTORE_TEST_STATE_60310'),"
          new="  courierMidBattleRestore:game.includes('promotionCourier60310Battle')&&game.includes('prepareBattleSessionRestore')&&game.includes('restoreBattleSessionState')&&read('runtime/alpha-promotion-courier-assessment-60310.js').includes('captureBattleSessionState60310')&&!read('runtime/alpha-promotion-courier-assessment-60310.js').includes('globalThis.saveTestState=function')&&!read('runtime/alpha-promotion-courier-assessment-60310.js').includes('globalThis.restoreTestState=function'),"
          if q.count(old)!=1: raise SystemExit(f'guard replacement count={q.count(old)}')
          guard.write_text(q.replace(old,new,1),encoding='utf-8')
          PY
          node --check game.js
          node --check runtime/alpha-promotion-courier-assessment-60310.js
          node --check tools/qa_issue_603_installed_integration.js
          node tools/qa_issue_603_step7_promotion.js
          node tools/qa_issue_607_courier_adapter.js
          node tools/qa_issue_603_installed_integration.js
          node tools/qa_issue_141_traversal_runtime.js
          node tools/qa_save_compatibility_311.js
          node tools/qa_runtime_ownership_safety_300.js
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-603-canonical-battle-session-owner-v2.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "codex-connector@users.noreply.github.com"
          git add game.js runtime/alpha-promotion-courier-assessment-60310.js tools/qa_issue_603_installed_integration.js .github/workflows/tmp-603-canonical-battle-session-owner-v2.yml
          git commit -m "[CODING][#603] Restore Courier Battle through canonical session owner"
          git push origin HEAD:coding/603-step7-promotion-integration
