name: UI Assets portrait export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-assets-portrait-export.yml'

permissions:
  contents: read

jobs:
  export-accepted-missing-five:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout accepted supplemental portrait wave
        uses: actions/checkout@v4
        with:
          ref: f36a0f4cbef77d3820b56389dbde4265feb5f346
          path: accepted
      - name: Export exact accepted binaries for current missing live-115 paths
        uses: actions/upload-artifact@v4
        with:
          name: live115-accepted-missing-five
          if-no-files-found: error
          retention-days: 1
          path: |
            accepted/Portraits/Transformation/curse_mark_hinata.png
            accepted/Portraits/Forced Manifestations/breakout_kurama.png
            accepted/Portraits/Variants/six_tail_dominion.png
            accepted/Portraits/Variants/three_tail_dominion.png
            accepted/Portraits/Tailed Beasts/nine_tails.png
