name: UI Assets live-115 portrait repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-assets-portrait-export.yml'

permissions:
  contents: write

jobs:
  normalize-current-live115:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Normalize exact current live-115 repair set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = [
              'Portraits/Rare Cards/black_sun_himawari.png',
              'Portraits/Variants/coercive_cloak.png',
              'Portraits/Constructs/iron_maiden.png',
              'Portraits/Tailed Beasts/menma_nine_tails.png',
              'Portraits/Constructs/triple_rashomon.png',
              'Portraits/Chunin/chunin_iruka.png',
              'Portraits/Special Jonin/sj_anko.png',
              'Portraits/Chunin/chunin_fugaku.png',
              'Portraits/Chunin/chunin_Itama.png',
              'Portraits/Genin/genin_mikoto.png',
              'Portraits/Genin/genin_orochimaru.png',
              'Portraits/Akatsuki/akatsuki_kakuzu.png',
              'Portraits/Special Jonin/sj_kiba.png',
              'Portraits/Special Jonin/sj_nono.png',
              'Portraits/Sannin/sannin_tenten.png',
              'Portraits/Sannin/sannin_hinata.png',
              'Portraits/Sannin/sannin_sumire.png',
              'Portraits/Rare Cards/kurama_resonance_himawari.png',
              'Portraits/Summons/nue.png',
              'Portraits/Transformation/curse_mark_hinata.png',
              'Portraits/Forced Manifestations/breakout_kurama.png',
              'Portraits/Variants/six_tail_dominion.png',
              'Portraits/Variants/three_tail_dominion.png',
              'Portraits/Tailed Beasts/nine_tails.png',
          ]

          for rel in paths:
              p = Path(rel)
              if not p.exists():
                  raise SystemExit(f'MISSING: {rel}')
              with Image.open(p) as im:
                  im.load()
                  if im.size != (1024, 1024):
                      im = im.resize((1024, 1024), Image.Resampling.LANCZOS)
                  im.save(p, format='PNG', optimize=False)

          # Physical verification before commit.
          for rel in paths:
              p = Path(rel)
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  im.load()
                  if im.size != (1024, 1024):
                      raise SystemExit(f'WRONG SIZE after normalization: {rel} -> {im.size}')
          print(f'Normalized and verified {len(paths)} live-115 repair targets.')
          PY
      - name: Run live-115 portrait QA before commit
        run: python tools/qa_battle_portraits.py
      - name: Commit repaired portrait binaries
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Portraits/
          if git diff --cached --quiet; then
            echo 'No portrait changes to commit.'
            exit 0
          fi
          git commit -m 'Repair live-115 portrait physical QA'
          git push origin HEAD:main
