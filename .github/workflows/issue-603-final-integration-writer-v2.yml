name: Issue 603 Final Integration Writer V2
on:
  push:
    branches:
      - coding/603-step7-promotion-integration
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: coding/603-step7-promotion-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply integration patch
        run: python3 tools/issue_603_final_integration_writer.py
      - name: Run focused QA
        run: |
          node tools/qa_issue_603_step7_promotion.js
          node tools/qa_issue_607_courier_adapter.js
          node tools/qa_issue_603_installed_integration.js
          node tools/qa_issue_141_traversal_runtime.js
      - name: Remove temporary writer files
        run: |
          rm -f .github/workflows/issue-603-final-integration-writer.yml
          rm -f .github/workflows/issue-603-final-integration-writer-v2.yml
          rm -f tools/issue_603_final_integration_writer.py
      - name: Commit integration
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "14957082+openai@users.noreply.github.com"
          git add -A
          git commit -m "[603-INTEGRATION-WRITER][CODING][#603] Wire canonical Step-7 Promotion runtime"
          git push origin HEAD:coding/603-step7-promotion-integration
