name: Issue 188 Kakashi Terminal Debrief QA

on:
  push:
    branches: [ main ]
    paths:
      - 'runtime/alpha-story-decision-realisation-34000.js'
      - 'runtime/alpha-kakashi-final-origin-adapter-34100.js'
      - 'runtime/alpha-kakashi-final-origin-adapter-34100-core.js'
      - 'runtime/alpha-kakashi-final-sequential-consumer-34410.js'
      - 'runtime/alpha-kakashi-factual-state-commit-34120.js'
      - 'runtime/alpha-kakashi-factual-bindings-34700.js'
      - 'runtime/alpha-kakashi-direct-opening-consumer-34710.js'
      - 'runtime/alpha-kakashi-origin-rewards-34800.js'
      - 'runtime/alpha-kakashi-terminal-debrief-35100.js'
      - 'tools/qa_kakashi_terminal_debrief_35100.js'
      - 'tools/qa_kakashi_direct_pickpocket_terminal_35100.js'
      - '.github/workflows/issue-188-kakashi-terminal-debrief.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kakashi-terminal-debrief:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Issue 188 Kakashi terminal debrief deterministic QA
        run: node tools/qa_kakashi_terminal_debrief_35100.js
      - name: Issue 188 direct Pickpocket terminal consumption QA
        run: node tools/qa_kakashi_direct_pickpocket_terminal_35100.js