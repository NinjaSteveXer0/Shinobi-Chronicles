name: Issue 544 One-Shot Terminal Compatibility

on:
  push:
    branches:
      - coding/544-terminal-result-presentation
    paths:
      - '.github/workflows/issue-544-one-shot-menma-compat.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/544-terminal-result-presentation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Patch stale Mirai and Iwabee terminal chronology harnesses
        shell: python
        run: |
          from pathlib import Path

          qa105=Path('tools/qa_issue_105_origin_presentation_browser.js')
          q105=qa105.read_text(encoding='utf-8')
          old_105='''    const returned=await page.evaluate(({terminalOutcome,expectedReturnBeat})=>{\n      if(!currentBattle)return{success:false,reason:"battle_missing"};\n      currentBattle.battleOver=true;\n      currentBattle.outcome={type:terminalOutcome};\n      if(terminalOutcome==="victory"){\n        currentBattle.rewards={\n          generated:true,claimed:true,ryo:50,exp:0,items:[],rareDrops:[],\n          mirai338FixedReward:true,\n          requiresExplicitPostClaimContinue:false\n        };\n      }\n      try{globalThis.hardSettleBattlePresentationQueue33000?.("issue_105_mirai_direct_story_return");}catch(_error){}\n      const result=globalThis.resumeBattleCallerAfterCompletion?.(terminalOutcome);\n      return{\n        result,\n        overlay:typeof currentOverlayType==="undefined"?null:currentOverlayType,\n        beatId:globalThis.getActiveStorySceneRuntime?.()?.beatId||null,\n        expectedReturnBeat\n      };\n    },{terminalOutcome,expectedReturnBeat});\n    assert.strictEqual(returned.result?.success,true,"Mirai #338 caller return failed "+JSON.stringify(returned));\n    assert.strictEqual(returned.beatId,expectedReturnBeat,"Mirai #338 caller returned to wrong Story beat "+JSON.stringify(returned));'''
          new_105='''    let returned=await page.evaluate(({terminalOutcome,expectedReturnBeat})=>{\n      if(!currentBattle)return{success:false,reason:"battle_missing"};\n      currentBattle.battleOver=true;\n      currentBattle.outcome={type:terminalOutcome};\n      if(terminalOutcome==="victory"){\n        currentBattle.rewards={\n          generated:true,claimed:true,ryo:50,exp:0,items:[],rareDrops:[],\n          mirai338FixedReward:true,\n          requiresExplicitPostClaimContinue:false\n        };\n      }\n      try{globalThis.hardSettleBattlePresentationQueue33000?.("issue_105_mirai_direct_story_return");}catch(_error){}\n      const result=globalThis.resumeBattleCallerAfterCompletion?.(terminalOutcome);\n      return{\n        result,\n        overlay:typeof currentOverlayType==="undefined"?null:currentOverlayType,\n        beatId:globalThis.getActiveStorySceneRuntime?.()?.beatId||null,\n        expectedReturnBeat\n      };\n    },{terminalOutcome,expectedReturnBeat});\n    if(terminalOutcome==="defeat"){\n      assert.strictEqual(returned.result?.callerResumeWithheldUntilTerminalResultContinue,true,"Mirai defeat bypassed #544 terminal presentation guard "+JSON.stringify(returned));\n      await page.waitForSelector(".alpha331-setback",{state:"visible",timeout:12000});\n      const gate=await page.evaluate(()=>({overlay:typeof currentOverlayType==="undefined"?null:currentOverlayType,outcome:currentBattle?.outcome?.type||null}));\n      assert.strictEqual(gate.overlay,"setback","Mirai defeat did not present code-owned Setback");\n      assert.strictEqual(gate.outcome,"defeat","Mirai Setback mutated terminal outcome");\n      await page.locator(".alpha331-setback button").click();\n      await page.waitForFunction(expected=>globalThis.getActiveStorySceneRuntime?.()?.beatId===expected,expectedReturnBeat,{timeout:12000});\n      returned={...returned,result:{success:true,viaSetbackContinue:true},beatId:await page.evaluate(()=>globalThis.getActiveStorySceneRuntime?.()?.beatId||null)};\n    }else{\n      assert.strictEqual(returned.result?.success,true,"Mirai #338 caller return failed "+JSON.stringify(returned));\n    }\n    assert.strictEqual(returned.beatId,expectedReturnBeat,"Mirai #338 caller returned to wrong Story beat "+JSON.stringify(returned));'''
          assert old_105 in q105, 'Mirai direct-return QA block drifted'
          qa105.write_text(q105.replace(old_105,new_105,1),encoding='utf-8')

          qa396=Path('tools/qa_issues_396_399_400_browser.js')
          q396=qa396.read_text(encoding='utf-8')
          start=q396.index('async function runIwabeeBattle(browser,outcome){')
          end=q396.index('\nasync function runIwabeeWorldBranch',start)
          seg=q396[start:end]
          assert '    const result=await page.evaluate(({outcome})=>{' in seg, 'Iwabee result binding drifted'
          seg=seg.replace('    const result=await page.evaluate(({outcome})=>{','    let result=await page.evaluate(({outcome})=>{',1)
          old_inner='''        const resumed=resumeBattleCallerAfterCompletion(outcome);\n        if(outcome==="defeat"){\n          // The frozen natural-voice Story can paginate one authored beat across\n          // multiple presentation cues. Advance the real Story until the\n          // canonical World consequence commits instead of assuming five clicks.\n          for(let i=0;i<24;i++){\n            const committed=(playerData.activityHistory||[]).find(x=>x&&x.occurrenceId==="occ_origin_iwabee_rogue_genin_response_resolution");\n            if(committed&&committed.fact&&committed.fact.rogueDisposition)break;\n            advanceStoryScene();\n          }\n        }\n        const rt=getActiveStorySceneRuntime();'''
          new_inner='''        const resumed=resumeBattleCallerAfterCompletion(outcome);\n        const rt=getActiveStorySceneRuntime();'''
          assert old_inner in seg, 'Iwabee pre-#544 direct defeat advancement block drifted'
          seg=seg.replace(old_inner,new_inner,1)
          marker='''    assert.strictEqual(result.resumed?.success,true,label+" caller resume");\n    assert.strictEqual(result.rewards?.ryo,outcome==="victory"?50:0,label+" Battle reward projection");'''
          replacement='''    if(outcome==="defeat"){\n      assert.strictEqual(result.resumed?.callerResumeWithheldUntilTerminalResultContinue,true,label+" defeat bypassed #544 terminal presentation guard");\n      await page.waitForSelector(".alpha331-setback",{state:"visible",timeout:12000});\n      const setbackGate=await page.evaluate(()=>({overlay:typeof currentOverlayType==="undefined"?null:currentOverlayType,outcome:currentBattle?.outcome?.type||null,rewardClaimed:currentBattle?.rewards?.claimed===true}));\n      assert.strictEqual(setbackGate.overlay,"setback",label+" did not present code-owned Setback");\n      assert.strictEqual(setbackGate.outcome,"defeat",label+" Setback mutated terminal outcome");\n      assert.strictEqual(setbackGate.rewardClaimed,false,label+" Setback incorrectly claimed reward");\n      await page.locator(".alpha331-setback button").click();\n      const post=await page.evaluate(()=>{\n        // The frozen natural-voice Story can paginate one authored beat across\n        // multiple presentation cues. Advance only after Setback Continue has\n        // restored the exact owning Story caller.\n        for(let i=0;i<24;i++){\n          const committed=(playerData.activityHistory||[]).find(x=>x&&x.occurrenceId==="occ_origin_iwabee_rogue_genin_response_resolution");\n          if(committed&&committed.fact&&committed.fact.rogueDisposition)break;\n          advanceStoryScene();\n        }\n        const rt=getActiveStorySceneRuntime();\n        const row=(playerData.activityHistory||[]).find(x=>x&&x.occurrenceId==="occ_origin_iwabee_rogue_genin_response_resolution");\n        return{beatId:rt?.beatId||null,local:JSON.parse(JSON.stringify(rt?.localContext||{})),fact:JSON.parse(JSON.stringify(row?.fact||null))};\n      });\n      result={...result,beatId:post.beatId,local:post.local,fact:post.fact};\n    }\n    assert.strictEqual(result.resumed?.success,true,label+" caller resume");\n    assert.strictEqual(result.rewards?.ryo,outcome==="victory"?50:0,label+" Battle reward projection");'''
          assert marker in seg, 'Iwabee post-evaluate assertion block drifted'
          seg=seg.replace(marker,replacement,1)
          qa396.write_text(q396[:start]+seg+q396[end:],encoding='utf-8')

      - name: Source and safety verification
        run: |
          node --check runtime/alpha-battle-terminal-result-54400.js
          node --check tools/qa_issue_369_menma_evolved_pl_battle_browser.js
          node --check tools/qa_issue_105_origin_presentation_browser.js
          node --check tools/qa_issues_396_399_400_browser.js
          node tools/qa_runtime_ownership_safety_300.js
          node tools/qa_issue_303_runtime_build_fingerprint.js
          node tools/qa_save_compatibility_311.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python3 -m http.server 8080 > /tmp/issue-544-terminal-http.log 2>&1 &
          echo $! > /tmp/issue-544-terminal-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/issue-544-terminal-http.log
          exit 1

      - name: Menma evolved PL Battle terminal chronology
        env:
          ISSUE_369_BASE_URL: http://127.0.0.1:8080/index.html
          ISSUE_369_BROWSER_OUT: artifacts/issue-544-menma-369
        run: xvfb-run -a node tools/qa_issue_369_menma_evolved_pl_battle_browser.js

      - name: Menma durable reward reload and post-claim Continue
        env:
          ISSUE_362_BASE_URL: http://127.0.0.1:8080/index.html
          ISSUE_362_BROWSER_OUT: artifacts/issue-544-menma-362
        run: xvfb-run -a node tools/qa_issue_362_menma_reward_browser.js

      - name: Mirai terminal return chronology
        env:
          ISSUE_105_PRESENTATION_BASE_URL: http://127.0.0.1:8080/index.html
          ISSUE_105_PRESENTATION_BROWSER_OUT: artifacts/issue-544-mirai-105
        run: xvfb-run -a node tools/qa_issue_105_origin_presentation_browser.js

      - name: Metal and Iwabee terminal return chronology
        env:
          ISSUES_396_399_400_BASE_URL: http://127.0.0.1:8080/index.html
          ISSUES_396_399_400_BROWSER_OUT: artifacts/issue-544-iwabee-396
        run: xvfb-run -a node tools/qa_issues_396_399_400_browser.js

      - name: Commit QA chronology corrections and remove one-shot workflow
        run: |
          rm .github/workflows/issue-544-one-shot-menma-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/qa_issue_105_origin_presentation_browser.js tools/qa_issues_396_399_400_browser.js .github/workflows/issue-544-one-shot-menma-compat.yml
          git diff --cached --check
          git commit -m '[CODING][#544] Align legacy browser QA with terminal result chronology'
          git push origin HEAD:coding/544-terminal-result-presentation
