name: Issue 597 Legacy Save Migration Bootstrap

on:
  push:
    branches:
      - coding/597-academy-origin-registry-recalibration
    paths:
      - 'tools/apply_issue_597_save_migration.py'
      - '.github/workflows/issue-597-save-migration-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-save-migration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/597-academy-origin-registry-recalibration
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply #582 save compatibility migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/apply_issue_597_save_migration.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
              'load_end = text.find("// =========================================================\\n// SAVE PLAYER DATA", load_start)',
              'load_end = text.find("function savePlayerData()", load_start)'
          )
          path.write_text(text,encoding='utf-8')
          PY
          python tools/apply_issue_597_save_migration.py

      - name: Focused syntax and contract validation
        run: |
          node --check game.js
          node --check tools/qa_issue_597_academy_origin_registry_recalibration.js
          node --check tools/qa_issue_597_academy_origin_registry_recalibration_browser.js
          node tools/qa_issue_597_academy_origin_registry_recalibration.js

      - name: Commit bounded production migration
        run: |
          if git diff --quiet -- game.js tools/qa_issue_597_academy_origin_registry_recalibration_browser.js; then
            echo 'Save migration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js tools/qa_issue_597_academy_origin_registry_recalibration_browser.js
          git commit -m '[CODING][#597] Preserve Current development across Base recalibration'
          git push origin HEAD:coding/597-academy-origin-registry-recalibration
