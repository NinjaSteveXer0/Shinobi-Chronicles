name: TMP 603 Inspect Test State Owner

on:
  push:
    branches:
      - coding/603-step7-promotion-integration
    paths:
      - .github/workflows/tmp-603-inspect-teststate-owner.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/603-step7-promotion-integration
          fetch-depth: 0
      - name: Print canonical test-state functions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('game.js').read_text(encoding='utf-8')
          for needle in ['function saveTestState','function restoreTestState']:
              idx=text.find(needle)
              print('\n===',needle,'index',idx,'===')
              if idx<0: continue
              start=max(0,idx-1200); end=min(len(text),idx+8000)
              print(text[start:end])
          PY
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-603-inspect-teststate-owner.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "codex-connector@users.noreply.github.com"
          git add .github/workflows/tmp-603-inspect-teststate-owner.yml
          git commit -m "[CHORE][#603] Remove temporary test-state inspection workflow"
          git push origin HEAD:coding/603-step7-promotion-integration
