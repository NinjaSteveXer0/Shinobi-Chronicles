name: Issue 544 Kakashi Wasabi Compatibility Proof

on:
  push:
    branches:
      - coding/544-terminal-proof
    paths:
      - '.github/workflows/issue-544-kakashi-wasabi-compat-proof.yml'

permissions:
  contents: write

jobs:
  prove-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/544-terminal-result-presentation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Patch Kakashi legacy browser chronology only
        shell: python
        run: |
          from pathlib import Path
          import base64

          old_visual=base64.b64decode('').decode()
          new_visual=base64.b64decode('').decode()
          old_helper=base64.b64decode('').decode()
          new_helper=base64.b64decode('').decode()

          kak=Path('tools/qa_kakashi_v2_browser.js')
          text=kak.read_text(encoding='utf-8')
          assert old_visual in text, 'Kakashi visualAndBattle terminal block drifted'
          assert old_helper in text, 'Kakashi launchAndReturnBattle terminal branch drifted'
          text=text.replace(old_visual,new_visual,1).replace(old_helper,new_helper,1)
          kak.write_text(text,encoding='utf-8')

      - name: Source safety
        run: |
          node --check tools/qa_kakashi_v2_browser.js
          node --check tools/qa_issue_343_wasabi_browser.js
          node tools/qa_runtime_ownership_safety_300.js
          node tools/qa_issue_303_runtime_build_fingerprint.js
          node tools/qa_save_compatibility_311.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start local Alpha server
        run: |
          python3 -m http.server 8080 >/tmp/issue-544-kakashi-wasabi-proof-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/issue-544-kakashi-wasabi-proof-http.log
          exit 1

      - name: Kakashi terminal chronology compatibility
        env:
          KAKASHI_V2_BASE_URL: http://127.0.0.1:8080/index.html
          KAKASHI_V2_BROWSER_OUT: artifacts/issue-544-proof-kakashi
        run: xvfb-run -a node tools/qa_kakashi_v2_browser.js

      - name: Wasabi regression on current feature head
        env:
          ISSUE_343_BASE_URL: http://127.0.0.1:8080/index.html
          ISSUE_343_BROWSER_OUT: artifacts/issue-544-proof-wasabi
        run: xvfb-run -a node tools/qa_issue_343_wasabi_browser.js

      - name: Publish Kakashi QA correction to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/qa_kakashi_v2_browser.js
          git diff --cached --check
          git commit -m '[CODING][#544] Align Kakashi browser QA with terminal result chronology'
          git push origin HEAD:coding/544-terminal-result-presentation
