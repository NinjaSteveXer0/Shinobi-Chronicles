name: TMP603 Login Resume
on:
  push:
    branches:
      - coding/603-step7-promotion-integration
    paths:
      - .github/workflows/tmp-603-explicit-login-battle-resume.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/603-step7-promotion-integration
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply bounded repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          onboarding=Path('runtime/alpha-browser-onboarding-fixes-33400.js')
          text=onboarding.read_text(encoding='utf-8')
          old='''        release33400();
        // Returning-player login is presentation release, not navigation.
'''
          new='''        release33400();
        // Explicit LOGIN / CONTINUE is the player-authorised saved-session resume boundary.
        // Restore canonical Battle session state only after that returning-player choice.
        try{if(typeof restoreTestState==="function")restoreTestState();}catch(_error){}
        // Returning-player login is presentation release, not navigation.
'''
          if text.count(old)!=1:
              raise SystemExit(f'login anchor count={text.count(old)}')
          text=text.replace(old,new,1)
          onboarding.write_text(text,encoding='utf-8')

          browser=Path('tools/qa_issue_603_step7_promotion_browser.js')
          text=browser.read_text(encoding='utf-8')
          old='''    await page.reload({waitUntil:"domcontentloaded",timeout:60000});await waitRuntime(page);await releaseFrontDoor(page);await clearTutorialChrome(page);
'''
          new='''    await page.reload({waitUntil:"domcontentloaded",timeout:60000});
    await waitRuntime(page);
    const returningLogin=page.locator('[data-afd2-action="login"]');
    if(await returningLogin.count()>0&&await returningLogin.isEnabled())await returningLogin.click();
    else await releaseFrontDoor(page);
    await clearTutorialChrome(page);
'''
          if text.count(old)!=1:
              raise SystemExit(f'browser reload anchor count={text.count(old)}')
          text=text.replace(old,new,1)
          browser.write_text(text,encoding='utf-8')
          PY
          node --check runtime/alpha-browser-onboarding-fixes-33400.js
          node --check tools/qa_issue_603_step7_promotion_browser.js
          grep -F 'typeof restoreTestState==="function"' runtime/alpha-browser-onboarding-fixes-33400.js
          grep -F 'data-afd2-action="login"' tools/qa_issue_603_step7_promotion_browser.js
          node tools/qa_issue_165_front_door_runtime.js
          node tools/qa_issue_165_front_door_v2_runtime.js
          node tools/qa_issue_603_step7_promotion.js
          node tools/qa_issue_607_courier_adapter.js
          node tools/qa_issue_603_installed_integration.js
          node tools/qa_issue_141_traversal_runtime.js
          node tools/qa_runtime_ownership_safety_300.js
          node tools/qa_save_compatibility_311.js
      - name: Commit repair
        shell: bash
        run: |
          rm .github/workflows/tmp-603-explicit-login-battle-resume.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "codex-connector@users.noreply.github.com"
          git add runtime/alpha-browser-onboarding-fixes-33400.js tools/qa_issue_603_step7_promotion_browser.js .github/workflows/tmp-603-explicit-login-battle-resume.yml
          git commit -m "[CODING][#603] Resume saved Battle after explicit returning-player login"
          git push origin HEAD:coding/603-step7-promotion-integration
