name: Issue 557 Unobstructed Map Canvas

on:
  push:
    branches:
      - coding/557-unobstructed-map-canvases
    paths:
      - 'runtime/alpha-map-canvas-unobstructed-55700.js'
      - 'runtime/alpha-hud-my-clan-return-context-50600.js'
      - 'runtime/alpha-phase2-live-hud-49900.js'
      - 'tools/qa_map_canvas_unobstructed_557.js'
      - 'tools/qa_map_canvas_unobstructed_557_browser.js'
      - 'tools/fixtures/runtime_build_manifest_303.json'
      - 'runtime/alpha-runtime-build-fingerprint-303.js'
      - 'tools/fixtures/runtime_change_declarations_300.json'
      - '.github/workflows/issue-557-unobstructed-map-canvas.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unobstructed-map-canvas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Source syntax
        run: |
          node --check runtime/alpha-map-canvas-unobstructed-55700.js
          node --check runtime/alpha-hud-my-clan-return-context-50600.js
          node --check tools/qa_map_canvas_unobstructed_557.js
          node --check tools/qa_map_canvas_unobstructed_557_browser.js

      - name: Bounded unobstructed-canvas contract
        run: node tools/qa_map_canvas_unobstructed_557.js

      - name: Runtime build fingerprint
        run: node tools/qa_issue_303_runtime_build_fingerprint.js

      - name: Runtime ownership safety
        run: node tools/qa_runtime_ownership_safety_300.js

      - name: Existing save compatibility
        run: node tools/qa_save_compatibility_311.js

      - name: Phase 2 current-team regression
        run: node tools/qa_phase2_konoha_player_surfaces_431.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > issue-557-server.log 2>&1 &
          echo $! > issue-557-server.pid
          sleep 2

      - name: Existing #499 HUD browser regression
        run: node tools/qa_phase2_live_hud_499_browser.js

      - name: Installed-browser zero-overlap proof
        run: node tools/qa_map_canvas_unobstructed_557_browser.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-557-unobstructed-map-canvas-browser
          path: |
            artifacts/issue-557-unobstructed-map-canvas
            artifacts/phase2-live-hud-499
            issue-557-server.log
          if-no-files-found: ignore
