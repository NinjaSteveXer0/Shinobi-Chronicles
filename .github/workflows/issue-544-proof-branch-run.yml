name: Issue 544 Isolated Terminal Proof

on:
  push:
    branches:
      - coding/544-terminal-proof
    paths:
      - '.github/workflows/issue-544-proof-branch-run.yml'

permissions:
  contents: write

jobs:
  prove-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/544-terminal-result-presentation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Patch proven terminal chronology QA
        shell: python
        run: |
          from pathlib import Path

          qa105=Path('tools/qa_issue_105_origin_presentation_browser.js')
          q105=qa105.read_text(encoding='utf-8')
          old_105='''    const returned=await page.evaluate(({terminalOutcome,expectedReturnBeat})=>{\n      if(!currentBattle)return{success:false,reason:"battle_missing"};\n      currentBattle.battleOver=true;\n      currentBattle.outcome={type:terminalOutcome};\n      if(terminalOutcome==="victory"){\n        currentBattle.rewards={\n          generated:true,claimed:true,ryo:50,exp:0,items:[],rareDrops:[],\n          mirai338FixedReward:true,\n          requiresExplicitPostClaimContinue:false\n        };\n      }\n      try{globalThis.hardSettleBattlePresentationQueue33000?.("issue_105_mirai_direct_story_return");}catch(_error){}\n      const result=globalThis.resumeBattleCallerAfterCompletion?.(terminalOutcome);\n      return{\n        result,\n        overlay:typeof currentOverlayType==="undefined"?null:currentOverlayType,\n        beatId:globalThis.getActiveStorySceneRuntime?.()?.beatId||null,\n        expectedReturnBeat\n      };\n    },{terminalOutcome,expectedReturnBeat});\n    assert.strictEqual(returned.result?.success,true,"Mirai #338 caller return failed "+JSON.stringify(returned));\n    assert.strictEqual(returned.beatId,expectedReturnBeat,"Mirai #338 caller returned to wrong Story beat "+JSON.stringify(returned));'''
          new_105='''    let returned=await page.evaluate(({terminalOutcome,expectedReturnBeat})=>{\n      if(!currentBattle)return{success:false,reason:"battle_missing"};\n      currentBattle.battleOver=true;\n      currentBattle.outcome={type:terminalOutcome};\n      if(terminalOutcome==="victory"){\n        currentBattle.rewards={\n          generated:true,claimed:true,ryo:50,exp:0,items:[],rareDrops:[],\n          mirai338FixedReward:true,\n          requiresExplicitPostClaimContinue:false\n        };\n      }\n      try{globalThis.hardSettleBattlePresentationQueue33000?.("issue_105_mirai_direct_story_return");}catch(_error){}\n      const result=globalThis.resumeBattleCallerAfterCompletion?.(terminalOutcome);\n      return{\n        result,\n        overlay:typeof currentOverlayType==="undefined"?null:currentOverlayType,\n        beatId:globalThis.getActiveStorySceneRuntime?.()?.beatId||null,\n        expectedReturnBeat\n      };\n    },{terminalOutcome,expectedReturnBeat});\n    if(terminalOutcome==="defeat"){\n      assert.strictEqual(returned.result?.callerResumeWithheldUntilTerminalResultContinue,true,"Mirai defeat bypassed #544 terminal presentation guard "+JSON.stringify(returned));\n      await page.waitForSelector(".alpha331-setback",{state:"visible",timeout:12000});\n      const gate=await page.evaluate(()=>({overlay:typeof currentOverlayType==="undefined"?null:currentOverlayType,outcome:currentBattle?.outcome?.type||null}));\n      assert.strictEqual(gate.overlay,"setback","Mirai defeat did not present code-owned Setback");\n      assert.strictEqual(gate.outcome,"defeat","Mirai Setback mutated terminal outcome");\n      await page.locator(".alpha331-setback button").click();\n      await page.waitForFunction(expected=>globalThis.getActiveStorySceneRuntime?.()?.beatId===expected,expectedReturnBeat,{timeout:12000});\n      returned={...returned,result:{success:true,viaSetbackContinue:true},beatId:await page.evaluate(()=>globalThis.getActiveStorySceneRuntime?.()?.beatId||null)};\n    }else{\n      assert.strictEqual(returned.result?.success,true,"Mirai #338 caller return failed "+JSON.stringify(returned));\n    }\n    assert.strictEqual(returned.beatId,expectedReturnBeat,"Mirai #338 caller returned to wrong Story beat "+JSON.stringify(returned));'''
          assert old_105 in q105, 'Mirai QA contract drifted'
          qa105.write_text(q105.replace(old_105,new_105,1),encoding='utf-8')

          qa396=Path('tools/qa_issues_396_399_400_browser.js')
          q396=qa396.read_text(encoding='utf-8')
          start=q396.index('async function runIwabeeBattle(browser,outcome){')
          end=q396.index('\nasync function runIwabeeWorldBranch',start)
          seg=q396[start:end]
          seg=seg.replace('    const result=await page.evaluate(({outcome})=>{','    let result=await page.evaluate(({outcome})=>{',1)

          old_terminal='''        currentBattle.outcome={type:outcome,committed:true,completedAt:Date.now(),finishingShinobiId:outcome==="victory"?"academy_iwabee":null};\n        currentBattle.battleOver=true;currentBattle.active=false;'''
          new_terminal='''        let authoritativeDefeat=null;\n        if(outcome==="defeat"){\n          const actionId="qa396_iwabee_rogue_finisher";\n          setBattleRemainingPL("player","academy_iwabee",0);\n          const enemy=getBattleParticipantByIdentity("enemy","iwabee_origin_rogue_genin_01");\n          const envelope={\n            actionId,\n            actorRef:createBattleParticipantRef("enemy","iwabee_origin_rogue_genin_01"),\n            targetRef:createBattleParticipantRef("player","academy_iwabee")\n          };\n          authoritativeDefeat=handleBattleParticipantAtZeroPL("player","academy_iwabee",enemy,envelope);\n        }else{\n          currentBattle.outcome={type:"victory",committed:true,completedAt:Date.now(),finishingShinobiId:"academy_iwabee"};\n          currentBattle.battleOver=true;currentBattle.active=false;\n        }'''
          assert old_terminal in seg, 'Iwabee synthetic terminal block drifted'
          seg=seg.replace(old_terminal,new_terminal,1)

          old_inner='''        const resumed=resumeBattleCallerAfterCompletion(outcome);\n        if(outcome==="defeat"){\n          // The frozen natural-voice Story can paginate one authored beat across\n          // multiple presentation cues. Advance the real Story until the\n          // canonical World consequence commits instead of assuming five clicks.\n          for(let i=0;i<24;i++){\n            const committed=(playerData.activityHistory||[]).find(x=>x&&x.occurrenceId==="occ_origin_iwabee_rogue_genin_response_resolution");\n            if(committed&&committed.fact&&committed.fact.rogueDisposition)break;\n            advanceStoryScene();\n          }\n        }\n        const rt=getActiveStorySceneRuntime();'''
          assert old_inner in seg, 'Iwabee pre-#544 defeat continuation block drifted'
          seg=seg.replace(old_inner,'        const resumed=resumeBattleCallerAfterCompletion(outcome);\n        const rt=getActiveStorySceneRuntime();',1)

          old_return='''        return{rewards:JSON.parse(JSON.stringify(rewards||null)),firstClaim,secondClaim,walletDeltaFirst:walletAfterFirst-walletBefore,walletDeltaSecond:walletAfterSecond-walletBefore,rewardReceiptCount:rewardReceipts.length,rewardReceipt:JSON.parse(JSON.stringify(rewardReceipts[0]||null)),resumed,beatId:rt?.beatId||null,local:JSON.parse(JSON.stringify(rt?.localContext||{})),fact:JSON.parse(JSON.stringify(row?.fact||null))};'''
          assert old_return in seg, 'Iwabee result projection block drifted'
          seg=seg.replace(old_return,'''        return{rewards:JSON.parse(JSON.stringify(rewards||null)),firstClaim,secondClaim,walletDeltaFirst:walletAfterFirst-walletBefore,walletDeltaSecond:walletAfterSecond-walletBefore,rewardReceiptCount:rewardReceipts.length,rewardReceipt:JSON.parse(JSON.stringify(rewardReceipts[0]||null)),authoritativeDefeat:JSON.parse(JSON.stringify(authoritativeDefeat||null)),resumed,beatId:rt?.beatId||null,local:JSON.parse(JSON.stringify(rt?.localContext||{})),fact:JSON.parse(JSON.stringify(row?.fact||null))};''',1)

          marker='''    assert.strictEqual(result.resumed?.success,true,label+" caller resume");\n    assert.strictEqual(result.rewards?.ryo,outcome==="victory"?50:0,label+" Battle reward projection");'''
          replacement='''    if(outcome==="defeat"){\n      assert.strictEqual(result.authoritativeDefeat?.setbackPresented,true,label+" authoritative zero-PL hook did not commit Setback");\n      assert.strictEqual(result.resumed?.callerResumeWithheldUntilTerminalResultContinue,true,label+" defeat bypassed #544 terminal presentation guard");\n      await page.waitForSelector(".alpha331-setback",{state:"visible",timeout:12000});\n      const setbackGate=await page.evaluate(()=>({overlay:typeof currentOverlayType==="undefined"?null:currentOverlayType,battleOver:currentBattle?.battleOver===true,outcome:currentBattle?.outcome?.type||null,rewardClaimed:currentBattle?.rewards?.claimed===true}));\n      assert.strictEqual(setbackGate.overlay,"setback",label+" did not present code-owned Setback");\n      assert.strictEqual(setbackGate.battleOver,true,label+" authoritative defeat was not retained");\n      assert.strictEqual(setbackGate.outcome,"defeat",label+" Setback mutated terminal outcome");\n      assert.strictEqual(setbackGate.rewardClaimed,false,label+" Setback incorrectly claimed reward");\n      await page.locator(".alpha331-setback button").click();\n      const post=await page.evaluate(()=>{\n        for(let i=0;i<24;i++){\n          const committed=(playerData.activityHistory||[]).find(x=>x&&x.occurrenceId==="occ_origin_iwabee_rogue_genin_response_resolution");\n          if(committed&&committed.fact&&committed.fact.rogueDisposition)break;\n          advanceStoryScene();\n        }\n        const rt=getActiveStorySceneRuntime();\n        const row=(playerData.activityHistory||[]).find(x=>x&&x.occurrenceId==="occ_origin_iwabee_rogue_genin_response_resolution");\n        return{beatId:rt?.beatId||null,local:JSON.parse(JSON.stringify(rt?.localContext||{})),fact:JSON.parse(JSON.stringify(row?.fact||null))};\n      });\n      result={...result,beatId:post.beatId,local:post.local,fact:post.fact,resumed:{success:true,viaSetbackContinue:true}};\n    }\n    assert.strictEqual(result.resumed?.success,true,label+" caller resume");\n    assert.strictEqual(result.rewards?.ryo,outcome==="victory"?50:0,label+" Battle reward projection");'''
          assert marker in seg, 'Iwabee assertion block drifted'
          seg=seg.replace(marker,replacement,1)
          qa396.write_text(q396[:start]+seg+q396[end:],encoding='utf-8')

      - name: Source safety
        run: |
          node --check tools/qa_issue_105_origin_presentation_browser.js
          node --check tools/qa_issues_396_399_400_browser.js
          node tools/qa_runtime_ownership_safety_300.js
          node tools/qa_issue_303_runtime_build_fingerprint.js
          node tools/qa_save_compatibility_311.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start local Alpha server
        run: |
          python3 -m http.server 8080 >/tmp/issue-544-proof-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/issue-544-proof-http.log
          exit 1

      - name: Mirai terminal chronology
        env:
          ISSUE_105_PRESENTATION_BASE_URL: http://127.0.0.1:8080/index.html
          ISSUE_105_PRESENTATION_BROWSER_OUT: artifacts/issue-544-proof-mirai
        run: xvfb-run -a node tools/qa_issue_105_origin_presentation_browser.js

      - name: Iwabee authoritative terminal chronology
        env:
          ISSUES_396_399_400_BASE_URL: http://127.0.0.1:8080/index.html
          ISSUES_396_399_400_BROWSER_OUT: artifacts/issue-544-proof-iwabee
        run: xvfb-run -a node tools/qa_issues_396_399_400_browser.js

      - name: Publish clean QA correction to feature branch
        run: |
          rm .github/workflows/issue-544-one-shot-menma-compat.yml
          rm .github/workflows/issue-544-iwabee-visibility-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/qa_issue_105_origin_presentation_browser.js tools/qa_issues_396_399_400_browser.js .github/workflows/issue-544-one-shot-menma-compat.yml .github/workflows/issue-544-iwabee-visibility-diagnostic.yml
          git diff --cached --check
          git commit -m '[CODING][#544] Align legacy browser QA with terminal result chronology'
          git push origin HEAD:coding/544-terminal-result-presentation
