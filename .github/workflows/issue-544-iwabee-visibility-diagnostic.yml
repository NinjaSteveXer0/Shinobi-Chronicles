name: Issue 544 Iwabee Setback Visibility Diagnostic

on:
  push:
    branches:
      - coding/544-terminal-result-presentation
    paths:
      - '.github/workflows/issue-544-iwabee-visibility-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/544-terminal-result-presentation
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch Iwabee defeat to use authoritative zero-PL hook
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools/qa_issues_396_399_400_browser.js')
          text=p.read_text(encoding='utf-8')
          start=text.index('async function runIwabeeBattle(browser,outcome){')
          end=text.index('\nasync function runIwabeeWorldBranch',start)
          seg=text[start:end]
          seg=seg.replace('    const result=await page.evaluate(({outcome})=>{','    let result=await page.evaluate(({outcome})=>{',1)

          old_terminal='''        currentBattle.outcome={type:outcome,committed:true,completedAt:Date.now(),finishingShinobiId:outcome==="victory"?"academy_iwabee":null};\n        currentBattle.battleOver=true;currentBattle.active=false;'''
          new_terminal='''        let authoritativeDefeat=null;\n        if(outcome==="defeat"){\n          const actionId="qa396_iwabee_rogue_finisher";\n          setBattleRemainingPL("player","academy_iwabee",0);\n          const enemy=getBattleParticipantByIdentity("enemy","iwabee_origin_rogue_genin_01");\n          const envelope={\n            actionId,\n            actorRef:createBattleParticipantRef("enemy","iwabee_origin_rogue_genin_01"),\n            targetRef:createBattleParticipantRef("player","academy_iwabee")\n          };\n          authoritativeDefeat=handleBattleParticipantAtZeroPL("player","academy_iwabee",enemy,envelope);\n        }else{\n          currentBattle.outcome={type:"victory",committed:true,completedAt:Date.now(),finishingShinobiId:"academy_iwabee"};\n          currentBattle.battleOver=true;currentBattle.active=false;\n        }'''
          assert old_terminal in seg, 'Iwabee synthetic terminal block drifted'
          seg=seg.replace(old_terminal,new_terminal,1)

          old_resume='''        const resumed=resumeBattleCallerAfterCompletion(outcome);\n        if(outcome==="defeat"){\n          // The frozen natural-voice Story can paginate one authored beat across\n          // multiple presentation cues. Advance the real Story until the\n          // canonical World consequence commits instead of assuming five clicks.\n          for(let i=0;i<24;i++){\n            const committed=(playerData.activityHistory||[]).find(x=>x&&x.occurrenceId==="occ_origin_iwabee_rogue_genin_response_resolution");\n            if(committed&&committed.fact&&committed.fact.rogueDisposition)break;\n            advanceStoryScene();\n          }\n        }\n        const rt=getActiveStorySceneRuntime();'''
          new_resume='''        const resumed=resumeBattleCallerAfterCompletion(outcome);\n        const rt=getActiveStorySceneRuntime();'''
          assert old_resume in seg, 'Iwabee old automatic Story advancement block drifted'
          seg=seg.replace(old_resume,new_resume,1)

          old_return='''        return{rewards:JSON.parse(JSON.stringify(rewards||null)),firstClaim,secondClaim,walletDeltaFirst:walletAfterFirst-walletBefore,walletDeltaSecond:walletAfterSecond-walletBefore,rewardReceiptCount:rewardReceipts.length,rewardReceipt:JSON.parse(JSON.stringify(rewardReceipts[0]||null)),resumed,beatId:rt?.beatId||null,local:JSON.parse(JSON.stringify(rt?.localContext||{})),fact:JSON.parse(JSON.stringify(row?.fact||null))};'''
          new_return='''        return{rewards:JSON.parse(JSON.stringify(rewards||null)),firstClaim,secondClaim,walletDeltaFirst:walletAfterFirst-walletBefore,walletDeltaSecond:walletAfterSecond-walletBefore,rewardReceiptCount:rewardReceipts.length,rewardReceipt:JSON.parse(JSON.stringify(rewardReceipts[0]||null)),authoritativeDefeat:JSON.parse(JSON.stringify(authoritativeDefeat||null)),resumed,beatId:rt?.beatId||null,local:JSON.parse(JSON.stringify(rt?.localContext||{})),fact:JSON.parse(JSON.stringify(row?.fact||null))};'''
          assert old_return in seg, 'Iwabee result return block drifted'
          seg=seg.replace(old_return,new_return,1)

          marker='''    assert.strictEqual(result.resumed?.success,true,label+" caller resume");\n    assert.strictEqual(result.rewards?.ryo,outcome==="victory"?50:0,label+" Battle reward projection");'''
          replacement='''    if(outcome==="defeat"){\n      assert.strictEqual(result.authoritativeDefeat?.setbackPresented,true,label+" authoritative zero-PL hook did not commit Setback");\n      assert.strictEqual(result.resumed?.callerResumeWithheldUntilTerminalResultContinue,true,label+" defeat bypassed #544 terminal presentation guard");\n      await page.waitForSelector(".alpha331-setback",{state:"visible",timeout:12000});\n      const setbackGate=await page.evaluate(()=>({\n        overlay:typeof currentOverlayType==="undefined"?null:currentOverlayType,\n        battleOver:currentBattle?.battleOver===true,\n        outcome:currentBattle?.outcome?.type||null,\n        terminal:globalThis.getBattleTerminalResultPresentation54400?.()||null\n      }));\n      console.log("IWABEE_544_AUTHORITATIVE_SETBACK",JSON.stringify(setbackGate));\n      assert.strictEqual(setbackGate.overlay,"setback",label+" did not visibly present Setback");\n      assert.strictEqual(setbackGate.battleOver,true,label+" authoritative defeat was not retained");\n      assert.strictEqual(setbackGate.outcome,"defeat",label+" authoritative defeat outcome drifted");\n      await page.locator(".alpha331-setback button").click();\n      const post=await page.evaluate(()=>{\n        for(let i=0;i<24;i++){\n          const committed=(playerData.activityHistory||[]).find(x=>x&&x.occurrenceId==="occ_origin_iwabee_rogue_genin_response_resolution");\n          if(committed&&committed.fact&&committed.fact.rogueDisposition)break;\n          advanceStoryScene();\n        }\n        const rt=getActiveStorySceneRuntime();\n        const row=(playerData.activityHistory||[]).find(x=>x&&x.occurrenceId==="occ_origin_iwabee_rogue_genin_response_resolution");\n        return{beatId:rt?.beatId||null,local:JSON.parse(JSON.stringify(rt?.localContext||{})),fact:JSON.parse(JSON.stringify(row?.fact||null))};\n      });\n      result={...result,beatId:post.beatId,local:post.local,fact:post.fact,resumed:{success:true,viaSetbackContinue:true}};\n    }\n    assert.strictEqual(result.resumed?.success,true,label+" caller resume");\n    assert.strictEqual(result.rewards?.ryo,outcome==="victory"?50:0,label+" Battle reward projection");'''
          assert marker in seg, 'Iwabee assertion block drifted'
          seg=seg.replace(marker,replacement,1)
          p.write_text(text[:start]+seg+text[end:],encoding='utf-8')
      - name: Source safety
        run: |
          node --check tools/qa_issues_396_399_400_browser.js
          node tools/qa_runtime_ownership_safety_300.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start server
        run: |
          python3 -m http.server 8080 >/tmp/issue544-iwabee-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/issue544-iwabee-http.log; exit 1
      - name: Iwabee authoritative terminal chronology
        env:
          ISSUES_396_399_400_BASE_URL: http://127.0.0.1:8080/index.html
          ISSUES_396_399_400_BROWSER_OUT: artifacts/issue-544-iwabee-authoritative
        run: xvfb-run -a node tools/qa_issues_396_399_400_browser.js
