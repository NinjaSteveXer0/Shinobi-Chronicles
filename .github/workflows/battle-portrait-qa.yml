name: Battle Portrait QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Assets/Portraits/**'
      - 'Documentation/Assets/Battle Portrait Authority and Manifest.md'
      - 'Documentation/Assets/Battle Portrait Registry Ratification.md'
      - 'tools/qa_battle_portraits.py'
      - '.github/workflows/battle-portrait-qa.yml'
      - 'game.js'
  pull_request:
    paths:
      - 'Assets/Portraits/**'
      - 'Documentation/Assets/Battle Portrait Authority and Manifest.md'
      - 'Documentation/Assets/Battle Portrait Registry Ratification.md'
      - 'tools/qa_battle_portraits.py'
      - '.github/workflows/battle-portrait-qa.yml'
      - 'game.js'

jobs:
  portrait-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate 102 ratified Battle portraits
        run: python tools/qa_battle_portraits.py
