name: Live 115 Battle Portrait QA

# UI/Assets current-main verification trigger after physical repair.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Portraits/**'
      - 'Documentation/Assets/Battle Portrait Authority and Manifest.md'
      - 'Documentation/Assets/Live 116 Battle Portrait Representation Audit 2026-09-07.md'
      - 'Documentation/Registry/Teen Nagato Retirement and Live 115 Cardinality Ratification 2026-09-11.md'
      - 'tools/qa_battle_portraits.py'
      - '.github/workflows/battle-portrait-qa.yml'
      - 'game.js'
  pull_request:
    paths:
      - 'Portraits/**'
      - 'Documentation/Assets/Battle Portrait Authority and Manifest.md'
      - 'Documentation/Assets/Live 116 Battle Portrait Representation Audit 2026-09-07.md'
      - 'Documentation/Registry/Teen Nagato Retirement and Live 115 Cardinality Ratification 2026-09-11.md'
      - 'tools/qa_battle_portraits.py'
      - '.github/workflows/battle-portrait-qa.yml'
      - 'game.js'

jobs:
  portrait-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate 115 ratified Battle/UI portraits
        run: python tools/qa_battle_portraits.py
