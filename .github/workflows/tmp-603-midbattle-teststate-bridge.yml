name: TMP 603 Mid Battle Test State Bridge

on:
  push:
    branches:
      - coding/603-step7-promotion-integration
    paths:
      - .github/workflows/tmp-603-midbattle-teststate-bridge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/603-step7-promotion-integration
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Patch bounded Courier mid-Battle test-state extension
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path=Path('runtime/alpha-promotion-courier-assessment-60310.js')
          text=path.read_text(encoding='utf-8')
          anchor='function expireRogueFeintAtActionOpportunity60310(){\n'
          if text.count(anchor)!=1:
              raise SystemExit(f'anchor count={text.count(anchor)}')
          block=base64.b64decode('').decode()
          text=text.replace(anchor,block+anchor,1)
          path.write_text(text,encoding='utf-8')
          guard=Path('tools/qa_issue_603_installed_integration.js')
          lines=guard.read_text(encoding='utf-8').splitlines()
          idx=[i for i,line in enumerate(lines) if line.startswith('  courierFeintAtCanonicalOpportunity:')]
          if len(idx)!=1:
              raise SystemExit(f'guard anchor count={len(idx)}')
          lines.insert(idx[0]+1,"  courierMidBattleRestore:read('runtime/alpha-promotion-courier-assessment-60310.js').includes('PRE_SAVE_TEST_STATE_60310')&&read('runtime/alpha-promotion-courier-assessment-60310.js').includes('PRE_RESTORE_TEST_STATE_60310'),")
          guard.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          node --check runtime/alpha-promotion-courier-assessment-60310.js
          node --check tools/qa_issue_603_installed_integration.js
          node tools/qa_issue_603_step7_promotion.js
          node tools/qa_issue_607_courier_adapter.js
          node tools/qa_issue_603_installed_integration.js
          node tools/qa_save_compatibility_311.js
      - name: Commit bounded repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-603-midbattle-teststate-bridge.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "codex-connector@users.noreply.github.com"
          git add runtime/alpha-promotion-courier-assessment-60310.js tools/qa_issue_603_installed_integration.js .github/workflows/tmp-603-midbattle-teststate-bridge.yml
          git commit -m "[CODING][#603] Restore Courier Battle runtime across reload"
          git push origin HEAD:coding/603-step7-promotion-integration
