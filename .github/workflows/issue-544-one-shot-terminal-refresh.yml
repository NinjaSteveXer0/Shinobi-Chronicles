name: Issue 544 One-Shot Terminal Refresh Compatibility

on:
  push:
    branches:
      - coding/544-terminal-result-presentation
    paths:
      - '.github/workflows/issue-544-one-shot-terminal-refresh.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/544-terminal-result-presentation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Distinguish terminal entry from same-surface refresh
        shell: python
        run: |
          from pathlib import Path
          path=Path('runtime/alpha-battle-terminal-result-54400.js')
          text=path.read_text(encoding='utf-8')
          old='''      if(battle&&battle.battleOver===true){\n        if(target==="victory"&&outcome==="victory"){\n          return presentCommittedBattleTerminalResult54400("victory",{source:"open_overlay_victory"});\n        }\n        if((target==="defeat"||target==="setback")&&outcome==="defeat"){\n          return presentCommittedBattleTerminalResult54400("defeat",{source:"open_overlay_defeat"});\n        }\n      }'''
          new='''      if(battle&&battle.battleOver===true){\n        const requestedOutcome=target==="victory"&&outcome==="victory"\n          ?"victory"\n          :((target==="defeat"||target==="setback")&&outcome==="defeat"?"defeat":null);\n        if(requestedOutcome){\n          const marker=marker54400(battle,requestedOutcome,false);\n          const surface=surfaceForOutcome54400(requestedOutcome);\n          let sameSurfaceActive=false;\n          try{\n            const activeType=typeof currentOverlayType!=="undefined"?String(currentOverlayType||"").trim().toLowerCase():"";\n            sameSurfaceActive=activeType===surface;\n          }catch(_error){}\n          if(!sameSurfaceActive&&typeof document!=="undefined"){\n            try{\n              const overlay=document.getElementById("screen-overlay");\n              const visible=!!(overlay&&getComputedStyle(overlay).display!=="none");\n              const selector=surface==="victory"?".alpha-victory-code-screen":".alpha331-setback";\n              sameSurfaceActive=visible&&!!document.querySelector(selector);\n            }catch(_error){}\n          }\n          // Exactly-once applies to terminal entry, not to a legitimate refresh\n          // of the result surface already on screen (for example Victory\n          // CLAIM REWARDS -> CONTINUE). Presentation refresh must not be\n          // mistaken for a semantic reroll/recommit.\n          if(marker&&marker.status==="presented"&&sameSurfaceActive){\n            return PRIOR_OPEN_OVERLAY.apply(this,arguments);\n          }\n          return presentCommittedBattleTerminalResult54400(requestedOutcome,{\n            source:requestedOutcome==="victory"?"open_overlay_victory":"open_overlay_defeat"\n          });\n        }\n      }'''
          assert old in text, 'exact pre-refresh #544 openOverlay block missing'
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')

      - name: Source and ownership safeguards
        run: |
          node --check runtime/alpha-battle-terminal-result-54400.js
          node tools/qa_runtime_ownership_safety_300.js
          node tools/qa_issue_303_runtime_build_fingerprint.js
          node tools/qa_save_compatibility_311.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python3 -m http.server 8080 > /tmp/issue-544-refresh-http.log 2>&1 &
          echo $! > /tmp/issue-544-refresh-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/issue-544-refresh-http.log
          exit 1

      - name: Menma Victory claim refresh regression
        env:
          ISSUE_369_BASE_URL: http://127.0.0.1:8080/index.html
          ISSUE_369_BROWSER_OUT: artifacts/issue-544-menma-refresh
        run: xvfb-run -a node tools/qa_issue_369_menma_evolved_pl_battle_browser.js

      - name: Commit exact fix and remove one-shot workflow
        run: |
          rm .github/workflows/issue-544-one-shot-terminal-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/alpha-battle-terminal-result-54400.js .github/workflows/issue-544-one-shot-terminal-refresh.yml
          git diff --cached --check
          git commit -m '[CODING][#544] Allow active terminal-surface refresh without re-entry'
          git push origin HEAD:coding/544-terminal-result-presentation
