name: Issues 431 436 Phase 2 Konoha Onboarding

on:
  push:
    branches:
      - coding/phase-2-konoha-onboarding-431-436
    paths:
      - 'index.html'
      - 'runtime/alpha-chronicle-state-manifest-43600.js'
      - 'runtime/alpha-first-konoha-tutorial-35000.js'
      - 'tools/fixtures/runtime_change_declarations_300.json'
      - 'tools/fixtures/runtime_responsibility_registry_300.json'
      - 'tools/qa_phase2_chronicle_state_manifest_436.js'
      - 'tools/qa_first_konoha_tutorial_35000.js'
      - 'tools/qa_phase2_konoha_onboarding_browser_431.js'
      - 'tools/qa_save_compatibility_311.js'
      - '.github/workflows/issues-431-436-phase2-konoha-onboarding.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-konoha-onboarding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Source syntax
        run: |
          node --check runtime/alpha-chronicle-state-manifest-43600.js
          node --check runtime/alpha-first-konoha-tutorial-35000.js
          node --check tools/qa_phase2_chronicle_state_manifest_436.js
          node --check tools/qa_first_konoha_tutorial_35000.js
          node --check tools/qa_phase2_konoha_onboarding_browser_431.js
      - name: Chronicle State Manifest
        run: node tools/qa_phase2_chronicle_state_manifest_436.js
      - name: Konoha onboarding deterministic trial
        run: node tools/qa_first_konoha_tutorial_35000.js
      - name: Existing save compatibility
        run: node tools/qa_save_compatibility_311.js
      - name: Runtime ownership safety
        run: node tools/qa_runtime_ownership_safety_300.js
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local Alpha server
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > phase2-konoha-server.log 2>&1 &
          echo $! > phase2-konoha-server.pid
          sleep 2
      - name: Installed-browser Konoha onboarding trial
        run: node tools/qa_phase2_konoha_onboarding_browser_431.js
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-konoha-onboarding-browser
          path: |
            artifacts/phase2-konoha-onboarding
            phase2-konoha-server.log
          if-no-files-found: ignore
