name: Issue 151 Arc-1 Reward Evaluation QA

on:
  push:
    branches: [ main ]
    paths:
      - 'runtime/alpha-arc1-reward-evaluation-35400.js'
      - 'tools/qa_arc1_reward_evaluation_35400.js'
      - '.github/workflows/issue-151-arc1-reward-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arc1-reward-evaluation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Arc-1 reward evaluator
        run: node --check runtime/alpha-arc1-reward-evaluation-35400.js
      - name: Issue 151 decision-sensitive reward snapshot QA
        run: node tools/qa_arc1_reward_evaluation_35400.js
