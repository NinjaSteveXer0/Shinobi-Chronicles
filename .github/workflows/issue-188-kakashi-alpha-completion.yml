name: Issue 188 Kakashi Alpha Completion QA

on:
  push:
    branches: [ main ]
    paths:
      - 'runtime/alpha-origin-scenes-32900-integrator.js'
      - 'runtime/alpha-story-decision-realisation-34000.js'
      - 'runtime/alpha-kakashi-final-origin-adapter-34100.js'
      - 'runtime/alpha-kakashi-sequential-post-ps-recovery-35600.js'
      - 'runtime/alpha-kakashi-terminal-scene-board-35610.js'
      - 'tools/qa_academy_kakashi_alpha_completion_356xx.js'
      - '.github/workflows/issue-188-kakashi-alpha-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kakashi-alpha-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and delivery generation
        run: |
          node --check runtime/alpha-origin-scenes-32900-integrator.js
          node --check runtime/alpha-story-decision-realisation-34000.js
          node --check runtime/alpha-kakashi-final-origin-adapter-34100.js
          node --check runtime/alpha-kakashi-sequential-post-ps-recovery-35600.js
          node --check runtime/alpha-kakashi-terminal-scene-board-35610.js
          node --check tools/qa_academy_kakashi_alpha_completion_356xx.js
          grep -Fq 'story-decision-20260917-5' runtime/alpha-origin-scenes-32900-integrator.js
          grep -Fq 'runtime/alpha-kakashi-final-origin-adapter-34100.js?sc=kakashi-final-20260917-19' runtime/alpha-story-decision-realisation-34000.js
          grep -Fq 'const BUILD="kakashi-final-20260917-19";' runtime/alpha-kakashi-final-origin-adapter-34100.js
          grep -Fq 'alpha-kakashi-sequential-post-ps-recovery-35600.js' runtime/alpha-kakashi-final-origin-adapter-34100.js
          grep -Fq 'alpha-kakashi-terminal-scene-board-35610.js' runtime/alpha-kakashi-final-origin-adapter-34100.js
      - name: AK_SA_033 + terminal Scene Board harness
        run: node tools/qa_academy_kakashi_alpha_completion_356xx.js
