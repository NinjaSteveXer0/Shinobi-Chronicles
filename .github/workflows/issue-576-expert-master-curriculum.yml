name: Issue 576 Expert Master Curriculum Profiles

on:
  push:
    branches:
      - coding/576-expert-master-curriculum-profiles
    paths:
      - 'runtime/alpha-discipline-curriculum-profiles-57600.js'
      - 'tools/qa_issue_576_expert_master_curriculum_profiles.js'
      - 'tools/qa_issue_576_expert_master_curriculum_profiles_browser.js'
      - 'tools/qa_issue_576_expert_master_curriculum_real_surface_browser.js'
      - '.github/workflows/issue-576-expert-master-curriculum.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'runtime/alpha-discipline-curriculum-profiles-57600.js'
      - 'tools/qa_issue_576_expert_master_curriculum_profiles.js'
      - 'tools/qa_issue_576_expert_master_curriculum_profiles_browser.js'
      - 'tools/qa_issue_576_expert_master_curriculum_real_surface_browser.js'
      - '.github/workflows/issue-576-expert-master-curriculum.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expert-master-curriculum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Source syntax
        run: |
          node --check runtime/alpha-discipline-curriculum-profiles-57600.js
          node --check tools/qa_issue_576_expert_master_curriculum_profiles.js
          node --check tools/qa_issue_576_expert_master_curriculum_profiles_browser.js
          node --check tools/qa_issue_576_expert_master_curriculum_real_surface_browser.js

      - name: Issue 576 deterministic curriculum contract
        shell: bash
        run: |
          set -o pipefail
          node tools/qa_issue_576_expert_master_curriculum_profiles.js 2>&1 | tee issue-576-focused-qa.log

      - name: Upload focused QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-576-focused-qa
          path: issue-576-focused-qa.log
          if-no-files-found: ignore

      - name: Existing Discipline Development regression
        run: node tools/qa_issue_448_discipline_stat_growth.js

      - name: Chronicle State Manifest regression
        run: node tools/qa_phase2_chronicle_state_manifest_436.js

      - name: Existing save compatibility
        run: node tools/qa_save_compatibility_311.js

      - name: Runtime ownership safety
        run: node tools/qa_runtime_ownership_safety_300.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > issue-576-server.log 2>&1 &
          echo $! > issue-576-server.pid
          sleep 2

      - name: Installed-browser isolated curriculum proof
        run: node tools/qa_issue_576_expert_master_curriculum_profiles_browser.js

      - name: Installed-browser click-driven real-surface proof
        run: node tools/qa_issue_576_expert_master_curriculum_real_surface_browser.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-576-isolated-browser
          path: |
            artifacts/issue-576-expert-master-curriculum
            artifacts/issue-576-expert-master-curriculum-real-surface
            issue-576-server.log
          if-no-files-found: ignore

  bounded-selector-bootstrap:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/576-expert-master-curriculum-profiles
          fetch-depth: 2

      - name: Verify exact pre-bootstrap tree boundary
        run: |
          set -euo pipefail
          test "$(git diff --name-only aa488f77c8333182578fdea62dc27a42390d38db..HEAD)" = ".github/workflows/issue-576-expert-master-curriculum.yml"

      - name: Patch transferred Practical owners and QA
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          game_path=Path("game.js")
          game=game_path.read_text(encoding="utf-8")
          owners=["getKonohaPracticalSelectedDisciplineId","selectKonohaPracticalDiscipline","validateKonohaPracticalFinalReadiness"]
          old=re.compile(r'const\s+validDisciplines\s*=\s*\[\s*"tai"\s*,\s*"buki"\s*,\s*"stamina"\s*\]\s*;',re.S)
          new='''const validDisciplines = [
              "tai",
              "buki",
              "stamina",
              "nin",
              "gen",
              "fuin"
            ];'''
          expected=["tai","buki","stamina","nin","gen","fuin"]
          profile_ids=["discipline_curriculum_nin_expert_v1","discipline_curriculum_nin_master_v1","discipline_curriculum_gen_expert_v1","discipline_curriculum_gen_master_v1","discipline_curriculum_fuin_expert_v1","discipline_curriculum_fuin_master_v1"]

          def section(src,name):
            start=src.find("function "+name)
            if start<0: raise SystemExit("missing transferred owner: "+name)
            end=src.find("// =========================================================",start+len(name)+9)
            if end<0: raise SystemExit("missing owner boundary: "+name)
            return start,end,src[start:end]

          for name in owners:
            start,end,src=section(game,name)
            hits=list(old.finditer(src))
            if len(hits)!=1: raise SystemExit(f"{name}: expected one legacy allowlist, got {len(hits)}")
            src=old.sub(new,src,count=1)
            game=game[:start]+src+game[end:]

          for name in owners:
            _,_,src=section(game,name)
            m=re.search(r'const\s+validDisciplines\s*=\s*\[(.*?)\]\s*;',src,re.S)
            ids=re.findall(r'"([^"]+)"',m.group(1)) if m else []
            if ids!=expected: raise SystemExit(f"{name}: wrong selector domain {ids!r}")
            if any(pid in src for pid in profile_ids): raise SystemExit(name+": activityProfileId leaked into selector identity")
          game_path.write_text(game,encoding="utf-8")

          qa_path=Path("tools/qa_issue_576_expert_master_curriculum_profiles.js")
          qa=qa_path.read_text(encoding="utf-8")
          game_decl='const GAME=fs.readFileSync(path.join(ROOT,"game.js"),"utf8");'
          if game_decl not in qa:
            anchor='const SRC576=fs.readFileSync(path.join(ROOT,"runtime/alpha-discipline-curriculum-profiles-57600.js"),"utf8");\n'
            if qa.count(anchor)!=1: raise SystemExit("#576 QA source anchor drifted")
            qa=qa.replace(anchor,anchor+game_decl+'\n',1)
            guard=r'''
function practicalOwnerSource576(name){
  const marker="function "+name;
  const start=GAME.indexOf(marker);
  assert(start>=0,"missing Practical root owner "+name);
  const next=GAME.indexOf("// =========================================================",start+marker.length);
  return GAME.slice(start,next>start?next:GAME.length);
}
{
  const selectorIds=["tai","buki","stamina","nin","gen","fuin"];
  const owners=["getKonohaPracticalSelectedDisciplineId","selectKonohaPracticalDiscipline","validateKonohaPracticalFinalReadiness"];
  for(const name of owners){
    const src=practicalOwnerSource576(name);
    const match=src.match(/const\s+validDisciplines\s*=\s*\[([\s\S]*?)\]\s*;/);
    assert(match,name+" missing Practical selector allowlist");
    const ids=[...match[1].matchAll(/"([^"]+)"/g)].map(m=>m[1]);
    assert.deepStrictEqual(ids,selectorIds,name+" selector domain drifted");
    for(const profileId of EXACT_IDS)assert(!src.includes(profileId),name+" collapsed activityProfileId into selector identity");
    assert(!ids.includes("kin"),name+" admitted unrelated Kin selector");
  }
  const rowStart=SRC576.indexOf("function advancedRow");
  assert(rowStart>=0,"advanced row builder missing");
  const rowBuilder=SRC576.slice(rowStart,rowStart+2400);
  assert(/id\s*:\s*disciplineId/.test(rowBuilder),"advanced Practical rows must submit discipline selector IDs");
  assert(/activityProfileId\s*:\s*resolved\.activityProfileId/.test(rowBuilder),"advanced rows must preserve separate curriculum profile provenance");
}
'''
            insertion='for(const id of EXACT_IDS)assert(SRC576.includes(id),"missing exact curriculum profile: "+id);\n'
            if qa.count(insertion)!=1: raise SystemExit("#576 QA guard anchor drifted")
            qa=qa.replace(insertion,insertion+guard,1)
          qa_path.write_text(qa,encoding="utf-8")
          PY

      - name: Fail-closed validation before write
        run: |
          set -euo pipefail
          node --check game.js
          node --check runtime/alpha-discipline-curriculum-profiles-57600.js
          node --check tools/qa_issue_576_expert_master_curriculum_profiles.js
          node tools/qa_issue_576_expert_master_curriculum_profiles.js
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          expected={"game.js","tools/qa_issue_576_expert_master_curriculum_profiles.js"}
          if changed!=expected: raise SystemExit(f"unexpected bounded writes: {sorted(changed)}")
          PY

      - name: Restore workflow and commit only bounded production plus QA change
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/issue-576-expert-master-curriculum.yml > .github/workflows/issue-576-expert-master-curriculum.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js tools/qa_issue_576_expert_master_curriculum_profiles.js .github/workflows/issue-576-expert-master-curriculum.yml
          git commit -m "[CODING][#576] Fix Practical advanced discipline selection"
          git push origin HEAD:coding/576-expert-master-curriculum-profiles
