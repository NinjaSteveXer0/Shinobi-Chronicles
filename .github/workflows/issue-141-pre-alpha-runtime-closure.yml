name: Issue 141 Pre-Alpha Runtime Closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'index.html'
      - 'runtime/**'
      - 'tools/qa_*.py'
      - 'tools/qa_*.js'
      - '.github/workflows/issue-141-pre-alpha-runtime-closure.yml'
  pull_request:
    paths:
      - 'game.js'
      - 'index.html'
      - 'runtime/**'
      - 'tools/qa_*.py'
      - 'tools/qa_*.js'
      - '.github/workflows/issue-141-pre-alpha-runtime-closure.yml'

jobs:
  pre-alpha-runtime-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install image QA dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Execute complete source/headless Alpha closure spine
        run: python tools/qa_issue_141_pre_alpha_runtime_closure.py

      - name: Execute Promotion roster reload Journey integration seam
        run: node tools/qa_issue_141_traversal_runtime.js

      - name: Execute Arc-1 and exact Story Battle return runtime seam
        run: node tools/qa_issue_141_arc1_battle_return_runtime.js

      - name: Execute Origin public-handler DOM-event realization seam
        run: |
          node --check runtime/alpha-origin-browser-realisation-33500.js
          node --check tools/qa_issue_105_origin_browser_realisation_runtime.js
          node tools/qa_issue_105_origin_browser_realisation_runtime.js

      - name: Execute non-Kakashi screen-first Origin activation seam
        run: |
          node --check runtime/alpha-origin-screen-first-33700.js
          node --check tools/qa_issue_105_origin_screen_first_activation.js
          node tools/qa_issue_105_origin_screen_first_activation.js

      - name: Execute generic Story decision and Scene Board seam
        run: |
          node --check runtime/alpha-story-decision-realisation-34000.js
          node --check runtime/alpha-story-factual-resolver-34600.js
          node --check runtime/alpha-story-scene-board-33900.js
          node --check tools/qa_issue_188_story_decision_runtime.js
          node --check tools/qa_story_factual_resolver_34600.js
          node tools/qa_issue_188_story_decision_runtime.js
          node tools/qa_story_factual_resolver_34600.js

      - name: Enforce Kakashi V2 legacy exclusion
        run: |
          node --check tools/qa_kakashi_v2_legacy_exclusion.js
          node tools/qa_kakashi_v2_legacy_exclusion.js
