name: Issue 597 Registry Bootstrap

on:
  push:
    branches:
      - coding/597-academy-origin-registry-recalibration
    paths:
      - '.github/workflows/issue-597-registry-bootstrap.yml'
      - 'tools/apply_issue_597_registry_recalibration.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-registry-recalibration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/597-academy-origin-registry-recalibration
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply exact Registry correction
        run: python tools/apply_issue_597_registry_recalibration.py

      - name: Focused deterministic validation
        run: |
          node --check game.js
          node --check tools/qa_issue_597_academy_origin_registry_recalibration.js
          node tools/qa_issue_597_academy_origin_registry_recalibration.js

      - name: Commit canonical Registry correction
        run: |
          if git diff --quiet -- game.js; then
            echo 'Registry correction already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js
          git commit -m '[CODING][#597] Consume Academy-Origin Base Stat recalibration'
          git push origin HEAD:coding/597-academy-origin-registry-recalibration
