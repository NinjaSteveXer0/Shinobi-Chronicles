name: Issue 188 Story Decision QA

on:
  push:
    branches: [ main ]
    paths:
      - 'runtime/alpha-origin-scenes-32900-integrator.js'
      - 'runtime/alpha-story-decision-realisation-34000.js'
      - 'runtime/alpha-kakashi-final-origin-adapter-34100.js'
      - 'runtime/alpha-kakashi-final-origin-adapter-34100-core.js'
      - 'runtime/alpha-kakashi-final-authority-guard-34200.js'
      - 'runtime/alpha-kakashi-origin-battle-deployment-34300.js'
      - 'tools/qa_issue_188_story_decision_runtime.js'
      - 'tools/qa_issue_188_kakashi_final_guard.js'
      - 'tools/qa_academy_kakashi_origin_battle_deployment.js'
      - '.github/workflows/issue-188-story-decision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-188-story-decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax and activation gate
        run: |
          node --check runtime/alpha-origin-scenes-32900-integrator.js
          node --check runtime/alpha-story-decision-realisation-34000.js
          node --check runtime/alpha-kakashi-final-origin-adapter-34100.js
          node --check runtime/alpha-kakashi-final-origin-adapter-34100-core.js
          node --check runtime/alpha-kakashi-final-authority-guard-34200.js
          node --check runtime/alpha-kakashi-origin-battle-deployment-34300.js
          node --check tools/qa_issue_188_story_decision_runtime.js
          node --check tools/qa_issue_188_kakashi_final_guard.js
          node --check tools/qa_academy_kakashi_origin_battle_deployment.js
          grep -Fq 'alpha-story-decision-realisation-34000.js' runtime/alpha-origin-scenes-32900-integrator.js
          grep -Fq 'alpha-kakashi-final-origin-adapter-34100.js' runtime/alpha-story-decision-realisation-34000.js
          grep -Fq 'alpha-kakashi-final-origin-adapter-34100-core.js' runtime/alpha-kakashi-final-origin-adapter-34100.js
          grep -Fq 'alpha-kakashi-final-authority-guard-34200.js' runtime/alpha-kakashi-final-origin-adapter-34100.js
          grep -Fq 'alpha-kakashi-origin-battle-deployment-34300.js' runtime/alpha-kakashi-final-origin-adapter-34100.js
      - name: Neutral Story decision and Kakashi autonomy harness
        run: node tools/qa_issue_188_story_decision_runtime.js
      - name: Kakashi stale-terminal final-authority guard
        run: node tools/qa_issue_188_kakashi_final_guard.js
      - name: Kakashi Origin Combat deployment harness
        run: node tools/qa_academy_kakashi_origin_battle_deployment.js
