name: Issue 469 First Live CE Hotspot

on:
  push:
    branches:
      - coding/first-live-ce-hotspot-469
    paths:
      - 'index.html'
      - 'runtime/alpha-first-live-ce-hotspot-46900.js'
      - 'runtime/alpha-chronicle-state-manifest-43600.js'
      - 'runtime/alpha-runtime-build-fingerprint-303.js'
      - 'tools/qa_issue_469_first_live_ce_hotspot.js'
      - 'tools/qa_issue_469_first_live_ce_hotspot_browser.js'
      - 'tools/fixtures/runtime_build_manifest_303.json'
      - 'tools/fixtures/runtime_change_declarations_300.json'
      - 'tools/fixtures/runtime_responsibility_registry_300.json'
      - 'tools/qa_issue_141_pre_alpha_runtime_closure.py'
      - '.github/workflows/issue-469-first-live-ce-hotspot.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-live-ce-hotspot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Source syntax
        run: |
          node --check runtime/alpha-first-live-ce-hotspot-46900.js
          node --check runtime/alpha-chronicle-state-manifest-43600.js
          node --check tools/qa_issue_469_first_live_ce_hotspot.js
          node --check tools/qa_issue_469_first_live_ce_hotspot_browser.js

      - name: Deterministic CE hotspot contract
        run: node tools/qa_issue_469_first_live_ce_hotspot.js

      - name: Chronicle State manifest regression
        run: node tools/qa_phase2_chronicle_state_manifest_436.js

      - name: Save compatibility
        run: node tools/qa_save_compatibility_311.js

      - name: Runtime ownership safety
        run: node tools/qa_runtime_ownership_safety_300.js

      - name: Runtime build fingerprint
        run: node tools/qa_runtime_build_fingerprint_303.js

      - name: Pre-Alpha production closure
        run: python tools/qa_issue_141_pre_alpha_runtime_closure.py

      - name: Phase 2 current-team regression
        run: node tools/qa_phase2_konoha_player_surfaces_431.js

      - name: Phase 2 persistent-development regression
        run: node tools/qa_issue_448_discipline_stat_growth.js

      - name: Inventory core regression
        run: node tools/qa_phase2_inventory_core_461.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > issue-469-server.log 2>&1 &
          echo $! > issue-469-server.pid
          sleep 2

      - name: Installed-browser first live CE hotspot
        run: node tools/qa_issue_469_first_live_ce_hotspot_browser.js

      - name: Upload #469 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-469-first-live-ce-hotspot-browser
          path: |
            artifacts/issue-469-first-live-ce-hotspot
            issue-469-server.log
          if-no-files-found: ignore
