name: Issue 469 First Live CE Hotspot

on:
  push:
    branches:
      - coding/phase-2-ce-hotspot-469
    paths:
      - 'runtime/alpha-phase2-ce-hotspot-46900.js'
      - 'runtime/alpha-kakashi-v2-battle-36010.js'
      - 'runtime/alpha-chronicle-state-manifest-43600.js'
      - 'runtime/alpha-traversal-bridge-33200.js'
      - 'runtime/alpha-runtime-build-fingerprint-303.js'
      - 'tools/fixtures/runtime_build_manifest_303.json'
      - 'tools/fixtures/runtime_responsibility_registry_300.json'
      - 'tools/fixtures/runtime_change_declarations_300.json'
      - 'tools/qa_issue_469_ce_hotspot.js'
      - 'tools/qa_issue_469_ce_hotspot_browser.js'
      - 'tools/qa_phase2_chronicle_state_manifest_436.js'
      - '.github/workflows/issue-469-first-live-ce-hotspot.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-live-ce-hotspot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Source syntax
        run: |
          node --check runtime/alpha-phase2-ce-hotspot-46900.js
          node --check runtime/alpha-kakashi-v2-battle-36010.js
          node --check runtime/alpha-chronicle-state-manifest-43600.js
          node --check tools/qa_issue_469_ce_hotspot.js
          node --check tools/qa_issue_469_ce_hotspot_browser.js

      - name: CE hotspot deterministic contract
        run: node tools/qa_issue_469_ce_hotspot.js

      - name: Chronicle state manifest
        run: node tools/qa_phase2_chronicle_state_manifest_436.js

      - name: Story decision participant-first authority
        run: node tools/qa_issue_188_story_decision_runtime.js

      - name: Frozen Kakashi clean-room regression
        run: node tools/qa_kakashi_v2_clean_room.js

      - name: Frozen Kakashi route matrix regression
        run: node tools/qa_kakashi_v2_route_matrix.js

      - name: Runtime build fingerprint
        run: node tools/qa_issue_303_runtime_build_fingerprint.js

      - name: Runtime ownership safety
        run: node tools/qa_runtime_ownership_safety_300.js

      - name: Save compatibility
        run: node tools/qa_save_compatibility_311.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > ce469-server.log 2>&1 &
          echo $! > ce469-server.pid
          sleep 2

      - name: Installed-browser CE hotspot GOLDEN+ gate
        run: node tools/qa_issue_469_ce_hotspot_browser.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-ce-hotspot-469-browser
          path: |
            artifacts/phase2-ce-hotspot-469
            ce469-server.log
          if-no-files-found: ignore
