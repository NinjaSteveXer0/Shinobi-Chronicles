name: TMP603 Factual Browser QA Fold
on:
  push:
    branches:
      - coding/603-step7-promotion-integration
    paths:
      - .github/workflows/tmp-603-factual-browser-qa-fold.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/603-step7-promotion-integration
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fold factual Hold-Line expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/qa_issue_603_step7_promotion_browser.js')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('    const actor=currentBattle.characterId||getBattleDeploymentParticipant?.("player",1)?.id||null;',
             '    const actor=currentBattle.activePlayer?.id||getBattleDeploymentParticipant?.("player",1)?.id||currentBattle.characterId||null;'),
            ('    assert.strictEqual(terminal.outcome,"victory","real-action Hold-Line route failed to produce Victory: "+JSON.stringify(terminal));',
             '    assert(["victory","defeat"].includes(terminal.outcome),"real-action Hold-Line route produced invalid factual outcome: "+JSON.stringify(terminal));'),
            ('    assert.strictEqual(returned.battle.returnEnvelope?.battleResult,"victory");',
             '    assert.strictEqual(returned.battle.returnEnvelope?.battleResult,terminal.outcome);'),
            ('    assert.strictEqual(returned.missionObjectiveCompleted,null,"Battle victory manufactured mission completion");\n    const battleRewards=(await rewardSnapshot(page)).rows.filter(r=>r.cause==="battle_victory");\n    assert.strictEqual(battleRewards.length,1,"Hold-Line Victory must award one separate 50 Ryō cause");\n    assert.strictEqual(battleRewards[0].ryo,50);',
             '    assert.strictEqual(returned.missionObjectiveCompleted,null,"Battle result manufactured mission completion");\n    const battleRewards=(await rewardSnapshot(page)).rows.filter(r=>r.cause==="battle_victory");\n    if(terminal.outcome==="victory"){assert.strictEqual(battleRewards.length,1,"Hold-Line Victory must award one separate 50 Ryō cause");assert.strictEqual(battleRewards[0].ryo,50);}\n    else assert.strictEqual(battleRewards.length,0,"Hold-Line defeat manufactured Battle-victory reward");'),
            ('    assert.strictEqual(afterFinalize.ryo-beforeRewards.ryo,300,"Battle+mission route should award exact 300 Ryō total");',
             '    const expectedRyo=terminal.outcome==="victory"?300:250;\n    assert.strictEqual(afterFinalize.ryo-beforeRewards.ryo,expectedRyo,"Battle+mission route reward total drift");'),
            ('    const causes=afterFinalize.rows.map(r=>r.cause).sort();\n    for(const cause of ["battle_victory","courier_recovered_alive","dispatch_returned_intact","full_mission_objective_completion"])assert(causes.includes(cause),"missing reward cause "+cause+": "+JSON.stringify(causes));',
             '    const causes=afterFinalize.rows.map(r=>r.cause).sort();\n    for(const cause of ["courier_recovered_alive","dispatch_returned_intact","full_mission_objective_completion"])assert(causes.includes(cause),"missing reward cause "+cause+": "+JSON.stringify(causes));\n    assert.strictEqual(causes.includes("battle_victory"),terminal.outcome==="victory","Battle reward cause did not match factual Battle result");'),
            ('    assert.strictEqual(replay?.success,true,"resolved PASS replay should remain idempotent");',
             '    assert.strictEqual(replay?.success,true,"resolved PASS replay should remain idempotent: "+JSON.stringify(replay));'),
            ('    assert(/150 Ryō/.test(receiptText)&&/100 Ryō/.test(receiptText)&&/50 Ryō/.test(receiptText)&&/Field Recovery Pill/i.test(receiptText),"Receipt did not project exact causal rewards");',
             '    assert(/150 Ryō/.test(receiptText)&&/100 Ryō/.test(receiptText)&&/Field Recovery Pill/i.test(receiptText),"Receipt did not project exact mission reward causes");\n    assert.strictEqual(/50 Ryō/.test(receiptText),terminal.outcome==="victory","Receipt Battle reward projection did not match factual outcome");'),
            ('    return{attemptId:committed.attemptId,packageId:committed.packageId,battleOutcome:terminal.outcome,midBattleReloadStable:true,pass:true,genin:true,ryoDelta:300,pillDelta:1};',
             '    return{attemptId:committed.attemptId,packageId:committed.packageId,battleOutcome:terminal.outcome,midBattleReloadStable:true,pass:true,genin:true,ryoDelta:terminal.outcome==="victory"?300:250,pillDelta:1};')
          ]
          for old,new in replacements:
              count=s.count(old)
              if count!=1: raise SystemExit(f'replacement count={count} for {old[:90]}')
              s=s.replace(old,new,1)
          start=s.index('async function battlePassScenario(browser){')
          end=s.index('\nasync function viewportSmoke',start)
          segment=s[start:end]
          old='    await completeReturnRoute(page,{courierOutcome:"recovered_with_team",handoff:true,debrief:true});'
          if segment.count(old)!=1: raise SystemExit(f'battlePass completeReturnRoute count={segment.count(old)}')
          new='    if(terminal.outcome==="defeat"){const postBattle=await page.evaluate(()=>SC_PROMOTION_INSTALLED_60330.resolveNonBattleContact("agen_m01_contact_extract_under_cover_v1","pressured_extraction"));assert.strictEqual(postBattle?.success,true,"post-defeat mission continuation was not actionable: "+JSON.stringify(postBattle));}\n    await completeReturnRoute(page,{courierOutcome:"recovered_with_team",handoff:true,debrief:true});'
          segment=segment.replace(old,new,1)
          s=s[:start]+segment+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          node --check tools/qa_issue_603_step7_promotion_browser.js
          node tools/qa_issue_603_step7_promotion.js
          node tools/qa_issue_607_courier_adapter.js
          node tools/qa_issue_603_installed_integration.js
          node tools/qa_issue_141_traversal_runtime.js
          node tools/qa_runtime_ownership_safety_300.js
          node tools/qa_save_compatibility_311.js
      - name: Commit QA fold and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-603-factual-browser-qa-fold.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "codex-connector@users.noreply.github.com"
          git add tools/qa_issue_603_step7_promotion_browser.js .github/workflows/tmp-603-factual-browser-qa-fold.yml
          git commit -m "[QA][#603] Follow factual Hold-Line Battle outcome"
          git push origin HEAD:coding/603-step7-promotion-integration
