name: Issue 300 Runtime Ownership Safety

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/alpha-traversal-bridge-33200.js'
      - 'runtime/alpha-runtime-build-fingerprint-303.js'
      - 'runtime/alpha-story-scene-board-33900.js'
      - 'runtime/alpha-story-decision-realisation-34000.js'
      - 'runtime/alpha-story-factual-resolver-34600.js'
      - 'runtime/academy-kakashi-v2-content-36000.js'
      - 'runtime/alpha-kakashi-v2-*.js'
      - 'runtime/alpha-alpha-sprint-33100.js'
      - 'runtime/alpha-battle-terminal-result-54400.js'
      - 'tools/fixtures/runtime_*_300.json'
      - 'tools/fixtures/runtime_build_manifest_303.json'
      - 'tools/qa_issue_303_runtime_build_fingerprint.js'
      - 'tools/qa_runtime_ownership_safety_300.js'
      - 'tools/qa_kakashi_v2_legacy_exclusion.js'
      - 'tools/qa_kakashi_v2_browser.js'
      - '.github/workflows/issue-300-runtime-ownership-safety.yml'
  push:
    branches: [ main ]
    paths:
      - 'runtime/alpha-traversal-bridge-33200.js'
      - 'runtime/alpha-runtime-build-fingerprint-303.js'
      - 'runtime/alpha-story-scene-board-33900.js'
      - 'runtime/alpha-story-decision-realisation-34000.js'
      - 'runtime/alpha-story-factual-resolver-34600.js'
      - 'runtime/academy-kakashi-v2-content-36000.js'
      - 'runtime/alpha-kakashi-v2-*.js'
      - 'tools/fixtures/runtime_*_300.json'
      - 'tools/fixtures/runtime_build_manifest_303.json'
      - 'tools/qa_issue_303_runtime_build_fingerprint.js'
      - 'tools/qa_runtime_ownership_safety_300.js'
      - 'tools/qa_kakashi_v2_legacy_exclusion.js'
      - '.github/workflows/issue-300-runtime-ownership-safety.yml'

permissions:
  contents: write

jobs:
  runtime-ownership-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/544-terminal-result-presentation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Migrate #544 canonical owner metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          owner='runtime/alpha-battle-terminal-result-54400.js'
          retired='runtime/alpha-alpha-sprint-33100.js'

          rp=Path('tools/fixtures/runtime_responsibility_registry_300.json')
          reg=json.loads(rp.read_text())

          row=next((r for r in reg.get('responsibilities',[]) if r.get('responsibilityId')=='battle.return.story_scene.shared'),None)
          if not row:
              raise SystemExit('battle.return.story_scene.shared missing')
          row['canonicalOwner']=owner
          row['ownerType']='shared_battle_terminal_result_runtime'
          row['productionLoadPath']=['index.html',owner]
          row['extensionHooks']=[
              'presentCommittedBattleTerminalResult54400',
              'continueAfterSetback54400',
              'continueAfterVictory',
              'resumeBattleCallerAfterCompletion'
          ]
          retired_owners=row.setdefault('retiredOwners',[])
          if retired not in retired_owners:
              retired_owners.append(retired)

          for semantic in reg.get('semanticOwners',[]):
              if semantic.get('semanticId')=='battle.return.story_scene':
                  semantic['owner']=owner

          terminal_symbols={'openOverlay','continueAfterVictory','handleBattleParticipantAtZeroPL'}
          for chain in reg.get('wrapperChains',[]):
              if chain.get('symbol') in terminal_symbols and isinstance(chain.get('chain'),list):
                  chain['chain']=[p for p in chain['chain'] if p!=retired]
              if chain.get('symbol')=='openOverlay':
                  chain['canonicalActiveOwner']=owner
                  chain['activationCondition']='#544 is the sole terminal-result presentation owner for already-committed Battle victory/defeat. #33000 remains the distinct immutable presentation-queue owner; #33100 terminal overlay ownership is retired.'
              if chain.get('symbol')=='resumeBattleCallerAfterCompletion':
                  chain['canonicalActiveOwner']=owner
                  chain['activationCondition']='#544 withholds exact caller restoration until the canonical Victory/Setback surface has been presented, then delegates to the existing Story/World return service.'

          rp.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')

          dp=Path('tools/fixtures/runtime_change_declarations_300.json')
          dec=json.loads(dp.read_text())
          d=next((r for r in dec.get('declarations',[]) if r.get('changeId')=='issue-544-canonical-battle-terminal-result-presentation-2026-10-07'),None)
          if not d:
              raise SystemExit('issue-544 declaration missing')
          d['classification']='REPLACES'
          d['contractChangeReason']='AUTHORITY_CHANGED_CANONICAL_OWNER_CONSOLIDATION_601_624'
          d['rationale']='Issue #544 is the sole live Battle terminal-result presentation/continuation owner. It preserves committed victory/defeat semantics, Victory reward authority, #33000 ordered presentation receipts, and exact caller restoration while absorbing the approved Setback surface and retiring the overlapping #33100 terminal-result slice.'
          replaces=d.setdefault('replaces',[])
          replacement='runtime/alpha-alpha-sprint-33100.js::battle_terminal_result_slice'
          if replacement not in replaces:
              replaces.append(replacement)
          dp.write_text(json.dumps(dec,indent=2,ensure_ascii=False)+'\n')

          old_id='SC-ALPHA-RUNTIME-R303-2026-10-07-EK'
          new_id='SC-ALPHA-RUNTIME-R303-2026-10-08-EL'
          old_gen='canonical-battle-terminal-result-routing-544'
          new_gen='canonical-battle-terminal-result-owner-consolidated-544'
          for path in ['runtime/alpha-runtime-build-fingerprint-303.js','tools/fixtures/runtime_build_manifest_303.json']:
              p=Path(path)
              text=p.read_text()
              if old_id not in text:
                  raise SystemExit(f'fingerprint id anchor missing: {path}')
              if old_gen not in text:
                  raise SystemExit(f'runtime generation anchor missing: {path}')
              p.write_text(text.replace(old_id,new_id).replace(old_gen,new_gen))
          PY

      - name: Validate migrated ownership source
        run: |
          node --check runtime/alpha-battle-terminal-result-54400.js
          node --check runtime/alpha-alpha-sprint-33100.js
          node --check tools/qa_runtime_ownership_safety_300.js
          node tools/qa_runtime_ownership_safety_300.js
          node tools/qa_issue_303_runtime_build_fingerprint.js
          node tools/qa_contract_integrity_311.js

      - name: Publish metadata migration and restore permanent workflow
        shell: bash
        run: |
          git show origin/main:.github/workflows/issue-300-runtime-ownership-safety.yml > .github/workflows/issue-300-runtime-ownership-safety.yml
          git config user.name 'shinobi-chronicles-runtime-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/fixtures/runtime_responsibility_registry_300.json tools/fixtures/runtime_change_declarations_300.json runtime/alpha-runtime-build-fingerprint-303.js tools/fixtures/runtime_build_manifest_303.json .github/workflows/issue-300-runtime-ownership-safety.yml
          git commit -m '[CODING][#544] Reconcile canonical terminal-result ownership authority'
          git push origin HEAD:coding/544-terminal-result-presentation

      - name: Runtime ownership safety gate
        run: |
          node --check tools/qa_runtime_ownership_safety_300.js
          node tools/qa_runtime_ownership_safety_300.js

      - name: Kakashi V2 negative legacy gate remains GREEN
        run: |
          node --check tools/qa_kakashi_v2_legacy_exclusion.js
          node tools/qa_kakashi_v2_legacy_exclusion.js

      - name: Kakashi V2 clean-room ownership remains GREEN
        run: |
          node --check tools/qa_kakashi_v2_clean_room.js
          node tools/qa_kakashi_v2_clean_room.js
