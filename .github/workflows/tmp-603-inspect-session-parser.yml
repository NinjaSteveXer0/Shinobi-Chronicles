name: TMP 603 Inspect Session Parser
on:
  push:
    branches: [coding/603-step7-promotion-integration]
    paths: [.github/workflows/tmp-603-inspect-session-parser.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/603-step7-promotion-integration
          fetch-depth: 0
      - name: Print session parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('game.js').read_text(encoding='utf-8')
          for needle in ['function parseAlphaSessionState','function normalizeAlphaSessionState']:
              idx=text.find(needle)
              print('\n===',needle,idx,'===')
              if idx>=0: print(text[idx:idx+14000])
          PY
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-603-inspect-session-parser.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "codex-connector@users.noreply.github.com"
          git add .github/workflows/tmp-603-inspect-session-parser.yml
          git commit -m "[CHORE][#603] Remove temporary session-parser inspection workflow"
          git push origin HEAD:coding/603-step7-promotion-integration
