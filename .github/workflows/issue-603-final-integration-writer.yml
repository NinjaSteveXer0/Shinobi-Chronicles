name: Issue 603 Final Integration Writer

on:
  push:
    branches:
      - coding/603-step7-promotion-integration

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[603-INTEGRATION-WRITER]') }}
    runs-on: ubuntu-latest
