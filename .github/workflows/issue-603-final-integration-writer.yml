              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {count}')
              return text.replace(old,new,1)

          # 1) Canonical Battle caller dispatch + enemy action-opportunity boundary.
          p='game.js'; s=read(p)
