name: Issue 597 Integration Tail Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/bootstrap_issue_597_integration_tail.py'
      - '.github/workflows/issue-597-integration-tail-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'coding/597-academy-origin-registry-recalibration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/597-academy-origin-registry-recalibration
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply bounded #597 integration tail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("tools/bootstrap_issue_597_integration_tail.py")
          s=p.read_text(encoding="utf-8")
          old='    fingerprint = fingerprint.replace(old, new)\n'
          new='    if label == "generation":\n        fingerprint = fingerprint.replace(f\'"{old}"\', f\'"{new}"\', 1)\n        fingerprint = fingerprint.replace(f\'first.runtimeGeneration==="{old}"\', f\'first.runtimeGeneration==="{new}"\', 1)\n    else:\n        fingerprint = fingerprint.replace(old, new)\n'
          if s.count(old) != 1:
              raise SystemExit("expected fingerprint replacement line missing/not unique")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY
          set -o pipefail
          python tools/bootstrap_issue_597_integration_tail.py 2>&1 | tee /tmp/issue-597-integration-tail.log
      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-597-integration-tail-bootstrap
          path: /tmp/issue-597-integration-tail.log
      - name: Validate exact audit repins and protected fingerprint
        run: |
          python tools/qa_issue_111_menma_tutorial.py
          python tools/qa_issue_63_genin_v2_roster.py
          node tools/qa_issue_303_runtime_build_fingerprint.js
          node tools/qa_issue_597_academy_origin_registry_recalibration.js
          node tools/qa_production_conformance_528_selftest.js
      - name: Commit bounded integration tail
        run: |
          git config user.name 'NinjaSteveXer0'
          git config user.email 'sc68957hcm@privaterelay.appleid.com'
          git add \
            tools/qa_issue_111_menma_tutorial.py \
            tools/qa_issue_63_genin_v2_roster.py \
            qa/production_change_impact_matrix_528.json \
            runtime/alpha-runtime-build-fingerprint-303.js \
            tools/fixtures/runtime_build_manifest_303.json
          if git diff --cached --quiet; then
            echo 'No integration-tail changes required.'
            exit 0
          fi
          git commit -m '[CODING][#597] Integrate conformance tail after #560'
          git push origin HEAD:coding/597-academy-origin-registry-recalibration
