name: QA Kakashi Gen18 Alignment One-Shot

on:
  push:
    branches:
      - tmp-kakashi-gen18-alignment
    paths:
      - .github/workflows/qa-kakashi-gen18-alignment-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact QA alignment
        env:
          BASE_SHA: 51f94e1c0e700fe60b4998ea9b9587cc92f95b4c
        run: |
          git checkout --detach "$BASE_SHA"
          python - <<'PY'
          from pathlib import Path

          old = "kakashi-final-20260917-17"
          new = "kakashi-final-20260917-18"
          expected = {
              "tools/qa_academy_kakashi_get_closer_factual_commit.js": 1,
              "tools/qa_academy_kakashi_sequential_consumer.js": 3,
              "tools/qa_academy_kakashi_factual_bindings_34700.js": 2,
              "tools/qa_kakashi_terminal_debrief_35100.js": 1,
          }
          for rel, count in expected.items():
              path = Path(rel)
              text = path.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{rel}: expected {count} generation-17 refs, found {actual}")
              path.write_text(text.replace(old, new))

          path = Path("tools/qa_kakashi_pakkun_interception_35300.js")
          text = path.read_text()
          old_assert = "assert(!consumer.includes('attemptAcademyKakashiPakkunBattleAction'),\"pre-Battle autonomy must not grant a free Battle action\");"
          new_assert = "const resolveTakeStart=consumer.indexOf('function resolveTake(choice)');\nconst resolveAskStart=consumer.indexOf('function resolveAsk(choice)');\nassert(resolveTakeStart>=0&&resolveAskStart>resolveTakeStart,\"resolveTake function boundary missing\");\nconst resolveTakeSource=consumer.slice(resolveTakeStart,resolveAskStart);\nassert(!resolveTakeSource.includes('attemptAcademyKakashiPakkunBattleAction'),\"pre-Battle autonomy must not grant a free Battle action\");"
          if text.count(old_assert) != 1:
              raise SystemExit("35300 QA: expected one whole-file no-free-action assertion")
          path.write_text(text.replace(old_assert, new_assert))

          stale=[]
          for path in Path("tools").glob("qa*.js"):
              if old in path.read_text(errors="ignore"):
                  stale.append(str(path))
          if stale:
              raise SystemExit("remaining generation-17 Kakashi QA refs: " + ", ".join(stale))
          PY

          git diff --check
          node --check tools/qa_academy_kakashi_get_closer_factual_commit.js
          node --check tools/qa_academy_kakashi_sequential_consumer.js
          node --check tools/qa_academy_kakashi_factual_bindings_34700.js
          node --check tools/qa_kakashi_terminal_debrief_35100.js
          node --check tools/qa_kakashi_pakkun_interception_35300.js
          node tools/qa_kakashi_pakkun_interception_35300.js
          node tools/qa_academy_kakashi_get_closer_factual_commit.js
          node tools/qa_academy_kakashi_sequential_consumer.js
          node tools/qa_academy_kakashi_factual_bindings_34700.js
          node tools/qa_kakashi_terminal_debrief_35100.js
      - name: Commit exact QA alignment to main
        env:
          BASE_SHA: 51f94e1c0e700fe60b4998ea9b9587cc92f95b4c
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$BASE_SHA"
          git config user.name "NinjaSteveXer0"
          git config user.email "sc68957hcm@privaterelay.appleid.com"
          git add tools/qa_academy_kakashi_get_closer_factual_commit.js \
                  tools/qa_academy_kakashi_sequential_consumer.js \
                  tools/qa_academy_kakashi_factual_bindings_34700.js \
                  tools/qa_kakashi_terminal_debrief_35100.js \
                  tools/qa_kakashi_pakkun_interception_35300.js
          git commit -m "qa: align Kakashi generation 18 checks"
          git push origin HEAD:main
