name: Temporary Issue 576 Browser Fix

on:
  push:
    branches:
      - coding/576-expert-master-curriculum-profiles
    paths:
      - '.github/workflows/tmp-issue-576-browser-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/576-expert-master-curriculum-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply exact bounded fix and self-clean
        run: node tools/tmp_issue_576_browser_fix.js
      - name: Commit bounded #576 fix
        run: |
          git config user.name "Shinobi Chronicles QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-only
          test -n "$(git status --porcelain)"
          git commit -m "[CODING][#576] Fix advanced Practical curriculum context"
          git push origin HEAD:coding/576-expert-master-curriculum-profiles
