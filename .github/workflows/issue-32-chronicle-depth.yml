name: Issue 32 Chronicle Interaction Depth

on:
  push:
    branches:
      - coding/chronicle-depth-32
    paths:
      - 'runtime/alpha-story-scene-board-33900.js'
      - 'runtime/alpha-runtime-build-fingerprint-303.js'
      - 'tools/fixtures/runtime_build_manifest_303.json'
      - 'tools/qa_issue_32_chronicle_depth_browser.js'
      - 'tools/qa_obito_story_presentation_browser.js'
      - 'tools/qa_issue_312_browser.js'
      - 'tools/qa_issue_312_story_battle_benchmark.js'
      - 'tools/qa_issue_105_origin_presentation_repair.js'
      - 'tools/qa_runtime_ownership_safety_300.js'
      - 'tools/qa_save_compatibility_311.js'
      - '.github/workflows/issue-32-chronicle-depth.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chronicle-depth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Source syntax
        run: |
          node --check game.js
          node --check runtime/alpha-story-scene-board-33900.js
          node --check runtime/alpha-runtime-build-fingerprint-303.js
          node --check tools/qa_issue_32_chronicle_depth_browser.js
          node --check tools/qa_obito_story_presentation_browser.js
          node --check tools/qa_issue_312_browser.js

      - name: Existing Scene Board diagnostics
        run: |
          node tools/qa_issue_105_origin_presentation_repair.js
          node tools/qa_issue_312_story_battle_benchmark.js

      - name: Runtime ownership and fingerprint safety
        run: |
          node tools/qa_runtime_ownership_safety_300.js
          node tools/qa_issue_303_runtime_build_fingerprint.js
          node tools/qa_save_compatibility_311.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > issue-32-server.log 2>&1 &
          echo $! > issue-32-server.pid
          sleep 2

      - name: Installed-browser Chronicle depth proof
        run: node tools/qa_issue_32_chronicle_depth_browser.js

      - name: Existing shared Scene Board browser regression
        run: xvfb-run -a node tools/qa_obito_story_presentation_browser.js

      - name: Existing Story to Battle to Story browser regression
        run: xvfb-run -a node tools/qa_issue_312_browser.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-32-chronicle-depth-browser
          path: |
            artifacts/issue-32-chronicle-depth
            artifacts/obito-story-presentation-browser
            artifacts/issue-312-browser
            issue-32-server.log
          if-no-files-found: ignore
