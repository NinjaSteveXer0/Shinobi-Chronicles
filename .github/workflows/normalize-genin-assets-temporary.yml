name: Temporary deterministic Genin asset normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-genin-assets-temporary.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Preflight exact 50 authoritative PNG paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          IDS = [
              'genin_hashirama','genin_hiruzen','genin_mito','genin_tsunade','genin_sakumo',
              'genin_duy','genin_guy','genin_rin','genin_dan','genin_nawaki','genin_shizune',
              'genin_yamato','genin_sai','genin_kagami','genin_danzo','genin_torifu',
              'genin_inoichi','genin_choza','genin_shibi','genin_tsume','genin_hiashi',
              'genin_yugao','genin_hayate','genin_mukai','genin_kosuke'
          ]
          pairs = []
          for rid in IDS:
              pairs.append((Path('Assets/Genin') / f'{rid}.png', (980, 1400), 'card'))
              pairs.append((Path('Portraits/Genin') / f'{rid}.png', (1024, 1024), 'portrait'))

          errors = []
          for path, target, kind in pairs:
              if not path.is_file():
                  errors.append(f'MISSING {path}')
                  continue
              try:
                  with Image.open(path) as im:
                      fmt, size = im.format, im.size
                      frames = getattr(im, 'n_frames', 1)
                      im.verify()
                  with Image.open(path) as im:
                      im.load()
              except Exception as exc:
                  errors.append(f'DECODE_FAIL {path}: {type(exc).__name__}: {exc}')
                  continue
              if fmt != 'PNG':
                  errors.append(f'FORMAT_FAIL {path}: {fmt!r}')
              if frames != 1:
                  errors.append(f'FRAME_FAIL {path}: {frames} frames')
              print(f'PREFLIGHT {kind:8s} {path} {size[0]}x{size[1]} PNG -> {target[0]}x{target[1]}')

          if errors:
              print('\nPRE-FLIGHT BLOCKERS:')
              for e in errors:
                  print('-', e)
              raise SystemExit(1)
          print(f'PRE-FLIGHT PASS: {len(pairs)}/50 exact source paths exist and decode as single-frame PNG.')
          PY

      - name: Lanczos resize only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, PngImagePlugin

          IDS = [
              'genin_hashirama','genin_hiruzen','genin_mito','genin_tsunade','genin_sakumo',
              'genin_duy','genin_guy','genin_rin','genin_dan','genin_nawaki','genin_shizune',
              'genin_yamato','genin_sai','genin_kagami','genin_danzo','genin_torifu',
              'genin_inoichi','genin_choza','genin_shibi','genin_tsume','genin_hiashi',
              'genin_yugao','genin_hayate','genin_mukai','genin_kosuke'
          ]

          targets = []
          for rid in IDS:
              targets.append((Path('Assets/Genin') / f'{rid}.png', (980, 1400)))
              targets.append((Path('Portraits/Genin') / f'{rid}.png', (1024, 1024)))

          changed = 0
          skipped = 0
          for path, target in targets:
              with Image.open(path) as im:
                  im.load()
                  original_size = im.size
                  if original_size == target:
                      print(f'SKIP already exact: {path} {target[0]}x{target[1]}')
                      skipped += 1
                      continue

                  # Preserve only non-visual metadata where Pillow can safely round-trip it.
                  save_kwargs = {'format': 'PNG', 'optimize': False, 'compress_level': 6}
                  if im.info.get('icc_profile'):
                      save_kwargs['icc_profile'] = im.info['icc_profile']
                  if im.info.get('dpi'):
                      save_kwargs['dpi'] = im.info['dpi']
                  if im.info.get('exif'):
                      save_kwargs['exif'] = im.info['exif']
                  if 'transparency' in im.info:
                      save_kwargs['transparency'] = im.info['transparency']

                  pnginfo = None
                  if getattr(im, 'text', None):
                      pnginfo = PngImagePlugin.PngInfo()
                      for key, value in im.text.items():
                          if isinstance(value, str):
                              pnginfo.add_text(key, value)
                      if im.text:
                          save_kwargs['pnginfo'] = pnginfo

                  resized = im.resize(target, Image.Resampling.LANCZOS)
                  resized.save(path, **save_kwargs)
                  print(f'RESIZED {path}: {original_size[0]}x{original_size[1]} -> {target[0]}x{target[1]} LANCZOS')
                  changed += 1

          print(f'NORMALISATION COMPLETE: resized={changed}, already_exact={skipped}, total={len(targets)}')
          PY

      - name: Verify exact dimensions and run locked QA
        shell: bash
        run: |
          set -o pipefail
          python tools/qa_genin_expansion_assets.py | tee /tmp/genin_qa_output.txt

      - name: Guard changed paths and commit normalised binaries
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t allowed <<'EOF'
          Assets/Genin/genin_hashirama.png
          Portraits/Genin/genin_hashirama.png
          Assets/Genin/genin_hiruzen.png
          Portraits/Genin/genin_hiruzen.png
          Assets/Genin/genin_mito.png
          Portraits/Genin/genin_mito.png
          Assets/Genin/genin_tsunade.png
          Portraits/Genin/genin_tsunade.png
          Assets/Genin/genin_sakumo.png
          Portraits/Genin/genin_sakumo.png
          Assets/Genin/genin_duy.png
          Portraits/Genin/genin_duy.png
          Assets/Genin/genin_guy.png
          Portraits/Genin/genin_guy.png
          Assets/Genin/genin_rin.png
          Portraits/Genin/genin_rin.png
          Assets/Genin/genin_dan.png
          Portraits/Genin/genin_dan.png
          Assets/Genin/genin_nawaki.png
          Portraits/Genin/genin_nawaki.png
          Assets/Genin/genin_shizune.png
          Portraits/Genin/genin_shizune.png
          Assets/Genin/genin_yamato.png
          Portraits/Genin/genin_yamato.png
          Assets/Genin/genin_sai.png
          Portraits/Genin/genin_sai.png
          Assets/Genin/genin_kagami.png
          Portraits/Genin/genin_kagami.png
          Assets/Genin/genin_danzo.png
          Portraits/Genin/genin_danzo.png
          Assets/Genin/genin_torifu.png
          Portraits/Genin/genin_torifu.png
          Assets/Genin/genin_inoichi.png
          Portraits/Genin/genin_inoichi.png
          Assets/Genin/genin_choza.png
          Portraits/Genin/genin_choza.png
          Assets/Genin/genin_shibi.png
          Portraits/Genin/genin_shibi.png
          Assets/Genin/genin_tsume.png
          Portraits/Genin/genin_tsume.png
          Assets/Genin/genin_hiashi.png
          Portraits/Genin/genin_hiashi.png
          Assets/Genin/genin_yugao.png
          Portraits/Genin/genin_yugao.png
          Assets/Genin/genin_hayate.png
          Portraits/Genin/genin_hayate.png
          Assets/Genin/genin_mukai.png
          Portraits/Genin/genin_mukai.png
          Assets/Genin/genin_kosuke.png
          Portraits/Genin/genin_kosuke.png
          EOF

          printf '%s\n' "${allowed[@]}" | sort > /tmp/allowed.txt
          git diff --name-only | sort > /tmp/changed.txt
          echo 'Changed paths:'
          cat /tmp/changed.txt
          unexpected=$(comm -23 /tmp/changed.txt /tmp/allowed.txt || true)
          if [[ -n "$unexpected" ]]; then
            echo 'ERROR: unintended files changed:'
            echo "$unexpected"
            exit 1
          fi

          if [[ ! -s /tmp/changed.txt ]]; then
            echo 'No binary changes required; all 50 were already exact.'
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${allowed[@]}"
          git commit -m 'assets: normalize 25 Genin cards and portraits'
          asset_sha=$(git rev-parse HEAD)
          git push origin HEAD:main
          echo "commit_sha=$asset_sha" >> "$GITHUB_OUTPUT"
          echo "NORMALISATION_COMMIT=$asset_sha"

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Genin deterministic raster normalisation'
            echo
            echo "Asset commit: \`${{ steps.commit.outputs.commit_sha }}\`"
            echo
            echo '```text'
            cat /tmp/genin_qa_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
