name: TEMP #603 Lane-D preflight hardening

on:
  push:
    branches:
      - coding/603-step7-promotion-integration
    paths:
      - '.github/workflows/tmp-603-lane-d-preflight-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/603-step7-promotion-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove active-harm Courier global wrappers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('runtime/alpha-promotion-courier-assessment-60310.js')
          s = p.read_text()

          old = '''const PRE_CHOOSE=typeof globalThis.chooseEnemyAuthoredBattleAction==="function"?globalThis.chooseEnemyAuthoredBattleAction:null;\nif(PRE_CHOOSE)globalThis.chooseEnemyAuthoredBattleAction=function(){const pkg=globalThis.currentBattle?.promotionCourier60310&&globalThis.enemyDatabase?.[ROGUE]?.promotionCourier60310PackageState;if(pkg?.expireFeint)pkg.expireFeint();return PRE_CHOOSE.apply(this,arguments);};\nconst PRE_RESUME=typeof globalThis.resumeFieldReadinessAssessmentFromBattle==="function"?globalThis.resumeFieldReadinessAssessmentFromBattle:null;\nif(PRE_RESUME){globalThis.resumeFieldReadinessAssessmentFromBattle=function(ctx){if(ctx?.assessmentScenarioId===SCENARIO){const x=resumeFromCurrentBattle(ctx);if(x.handled)return x;}return PRE_RESUME.apply(this,arguments);};try{resumeFieldReadinessAssessmentFromBattle=globalThis.resumeFieldReadinessAssessmentFromBattle;}catch(_){}}\n'''
          if old not in s:
              raise SystemExit('expected #60310 PRE wrapper block not found')

          replacement = '''function expireRogueFeintAtActionOpportunity60310(){\n  const battle=globalThis.currentBattle;\n  if(!battle?.promotionCourier60310)return{handled:false,expired:false};\n  const pkg=globalThis.enemyDatabase?.[ROGUE]?.promotionCourier60310PackageState;\n  if(!pkg||typeof pkg.expireFeint!=="function")return{handled:true,success:false,reason:"rogue_genin_shared_package_state_missing",expired:false};\n  return{handled:true,success:true,expired:pkg.expireFeint()===true};\n}\n'''
          s = s.replace(old, replacement, 1)

          old_api = 'projectJourney,projectRankEvidence,applyEligibleRewards,runDiagnostics:diagnostics});'
          new_api = 'projectJourney,projectRankEvidence,applyEligibleRewards,expireRogueFeintAtActionOpportunity:expireRogueFeintAtActionOpportunity60310,runDiagnostics:diagnostics});'
          if old_api not in s:
              raise SystemExit('expected #60310 API export anchor not found')
          s = s.replace(old_api, new_api, 1)

          p.write_text(s)
          PY

          node --check runtime/alpha-promotion-courier-assessment-60310.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('runtime/alpha-promotion-courier-assessment-60310.js').read_text()
          forbidden=[
            'globalThis.chooseEnemyAuthoredBattleAction=function',
            'globalThis.resumeFieldReadinessAssessmentFromBattle=function',
            'const PRE_CHOOSE=',
            'const PRE_RESUME='
          ]
          bad=[x for x in forbidden if x in s]
          if bad:
            raise SystemExit('forbidden #603 wrapper ownership remains: '+', '.join(bad))
          required=[
            'resumeFromCurrentBattle',
            'expireRogueFeintAtActionOpportunity60310',
            'promotionCourier60310PackageState'
          ]
          missing=[x for x in required if x not in s]
          if missing:
            raise SystemExit('required bounded Courier API missing: '+', '.join(missing))
          print('PASS #60310 wrapper-free preflight hardening')
          PY
      - name: Commit bounded preflight hardening and remove temporary workflow
        shell: bash
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "14957082+openai@users.noreply.github.com"
          git rm .github/workflows/tmp-603-lane-d-preflight-hardening.yml
          git add runtime/alpha-promotion-courier-assessment-60310.js
          git commit -m "[CODING][#603] Remove Courier PRE-wrapper ownership"
          git push origin HEAD:coding/603-step7-promotion-integration
