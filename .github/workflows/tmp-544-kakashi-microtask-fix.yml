name: TEMP 544 Kakashi QA microtask fix

on:
  push:
    branches:
      - coding/544-terminal-result-presentation
    paths:
      - 'tools/tmp_544_kakashi_microtask_fix.js'
      - '.github/workflows/tmp-544-kakashi-microtask-fix.yml'

permissions:
  contents: write

jobs:
  apply-bounded-qa-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/544-terminal-result-presentation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Kakashi QA timing fix
        run: node tools/tmp_544_kakashi_microtask_fix.js
      - name: Validate syntax
        run: |
          node --check tools/qa_kakashi_v2_browser.js
          git diff --check
      - name: Commit QA fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/qa_kakashi_v2_browser.js
          git commit -m '[QA][#544] Await terminal presentation before Kakashi Continue'
          git push origin HEAD:coding/544-terminal-result-presentation
