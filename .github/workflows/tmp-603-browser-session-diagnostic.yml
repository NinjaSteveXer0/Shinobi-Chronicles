name: TMP 603 Browser Session Diagnostic

on:
  push:
    branches:
      - coding/603-step7-promotion-integration
    paths:
      - .github/workflows/tmp-603-browser-session-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/603-step7-promotion-integration
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch browser harness in workspace only for session diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/qa_issue_603_step7_promotion_browser.js')
          text=path.read_text(encoding='utf-8')
          before='    assert(beforeReload.battle.active&&!beforeReload.battle.over,"Battle terminated before mid-Battle persistence proof");'
          before_diag='''    console.log("SC603_DIAG_BEFORE",JSON.stringify(await page.evaluate(()=>{\n      let parsed=null;try{parsed=JSON.parse(sessionStorage.getItem("shinobiTestState")||"null");}catch(_){}\n      return {\n        overlayType:parsed?.overlayType||null,\n        courierField:parsed?.promotionCourier60310Battle||null,\n        enemyId:parsed?.enemyId||null,\n        battleId:parsed?.battleId||null,\n        encounterId:parsed?.encounterId||null,\n        battleOver:parsed?.battleOver,\n        current:{active:!!currentBattle?.active,over:!!currentBattle?.battleOver,battleId:currentBattle?.battleId||null,config:currentBattle?.battleConfigId||null,encounter:currentBattle?.encounterId||null,meta:currentBattle?.promotionCourier60310||null,returnContext:currentBattle?.returnContext||null,enemy:currentBattle?.enemy?.id||null},\n        selectedEnemyId:typeof selectedEnemy!=="undefined"?selectedEnemy?.id||null:null\n      };\n    })));\n'''+before
          if text.count(before)!=1:
              raise SystemExit(f'before insertion count={text.count(before)}')
          text=text.replace(before,before_diag,1)
          after='    assert.strictEqual(afterReload.attemptId,committed.attemptId,"mid-Battle reload lost assessment lineage");'
          after_diag='''    console.log("SC603_DIAG_AFTER",JSON.stringify(await page.evaluate(()=>{\n      let parsed=null;try{parsed=JSON.parse(sessionStorage.getItem("shinobiTestState")||"null");}catch(_){}\n      const saved=parsed?.promotionCourier60310Battle||null;\n      return {\n        overlayType:parsed?.overlayType||null,\n        courierField:saved,\n        enemyId:parsed?.enemyId||null,\n        battleId:parsed?.battleId||null,\n        encounterId:parsed?.encounterId||null,\n        battleOver:parsed?.battleOver,\n        current:{active:!!currentBattle?.active,over:!!currentBattle?.battleOver,battleId:currentBattle?.battleId||null,config:currentBattle?.battleConfigId||null,encounter:currentBattle?.encounterId||null,meta:currentBattle?.promotionCourier60310||null,returnContext:currentBattle?.returnContext||null,enemy:currentBattle?.enemy?.id||null},\n        selectedEnemyId:typeof selectedEnemy!=="undefined"?selectedEnemy?.id||null:null,\n        apiPresent:!!globalThis.SC_PROMOTION_COURIER_ASSESSMENT_60310,\n        restoreFn:typeof globalThis.SC_PROMOTION_COURIER_ASSESSMENT_60310?.restoreBattleSessionState\n      };\n    })));\n'''+after
          if text.count(after)!=1:
              raise SystemExit(f'after insertion count={text.count(after)}')
          text=text.replace(after,after_diag,1)
          path.write_text(text,encoding='utf-8')
          PY
          node --check tools/qa_issue_603_step7_promotion_browser.js
      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Alpha server
        shell: bash
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > sc603-diag-server.log 2>&1 &
          echo $! > sc603-diag-server.pid
          sleep 2
      - name: Run exact browser diagnostic
        shell: bash
        env:
          SC603_REQUIRE_INTEGRATION: '1'
          SC603_OUT: artifacts/promotion-603-diag
        run: node tools/qa_issue_603_step7_promotion_browser.js
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git checkout -- tools/qa_issue_603_step7_promotion_browser.js
          rm .github/workflows/tmp-603-browser-session-diagnostic.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "codex-connector@users.noreply.github.com"
          git add .github/workflows/tmp-603-browser-session-diagnostic.yml
          git commit -m "[CHORE][#603] Remove temporary browser session diagnostic"
          git push origin HEAD:coding/603-step7-promotion-integration
