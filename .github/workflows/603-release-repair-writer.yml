name: Issue 603 bounded release repair writer

on:
  push:
    branches:
      - coding/603-step7-promotion-integration
    paths:
      - 'tools/issue603_release_repair_writer.py'
      - '.github/workflows/603-release-repair-writer.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/603-step7-promotion-integration
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bind writer to the authorised #603 ancestor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/issue603_release_repair_writer.py')
          s=p.read_text(encoding='utf-8')
          old='''    parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], cwd=ROOT, text=True).strip()\n    if parent != EXPECTED_PARENT:\n        raise RuntimeError(f"stale writer parent: expected {EXPECTED_PARENT}, got {parent}")\n'''
          new='''    ancestor=subprocess.run(["git","merge-base","--is-ancestor",EXPECTED_PARENT,"HEAD"],cwd=ROOT,check=False)\n    if ancestor.returncode != 0:\n        raise RuntimeError(f"stale writer ancestry: {EXPECTED_PARENT} is not an ancestor of HEAD")\n    allowed={"tools/issue603_release_repair_writer.py",".github/workflows/603-release-repair-writer.yml"}\n    changed=set(subprocess.check_output(["git","diff","--name-only",EXPECTED_PARENT+"..HEAD"],cwd=ROOT,text=True).splitlines())\n    if not changed.issubset(allowed):\n        raise RuntimeError("unexpected writes since authorised #603 head: "+", ".join(sorted(changed-allowed)))\n'''
          if s.count(old)!=1:
              raise SystemExit('writer ancestry guard needle drifted')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply source-proven #603 release repairs and run local guards
        run: python3 tools/issue603_release_repair_writer.py
      - name: Commit bounded repair and remove temporary writer infrastructure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "[CODING][#603] Repair final integration conformance and regression drift"
          git push origin HEAD:coding/603-step7-promotion-integration
