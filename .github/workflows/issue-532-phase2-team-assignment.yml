name: Issue 532 Phase 2 Deliberate Team Assignment

on:
  push:
    branches:
      - coding/phase2-team-assignment-532
    paths:
      - 'game.js'
      - 'runtime/alpha-chronicle-state-manifest-43600.js'
      - 'runtime/alpha-phase2-live-hud-49900.js'
      - 'runtime/alpha-runtime-build-fingerprint-303.js'
      - 'tools/fixtures/runtime_build_manifest_303.json'
      - 'tools/fixtures/runtime_change_declarations_300.json'
      - 'tools/fixtures/runtime_responsibility_registry_300.json'
      - 'tools/qa_phase2_team_assignment_532.js'
      - 'tools/qa_phase2_team_assignment_532_browser.js'
      - 'tools/qa_phase2_character_card_shop_524_browser.js'
      - 'tools/qa_phase2_live_hud_499_browser.js'
      - '.github/workflows/issue-532-phase2-team-assignment.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-team-assignment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Source syntax
        run: |
          node --check game.js
          node --check runtime/alpha-chronicle-state-manifest-43600.js
          node --check runtime/alpha-phase2-live-hud-49900.js
          node --check tools/qa_phase2_team_assignment_532.js
          node --check tools/qa_phase2_team_assignment_532_browser.js
          node --check tools/qa_phase2_character_card_shop_524_browser.js
          node --check tools/qa_phase2_live_hud_499_browser.js

      - name: Deliberate team assignment static contract
        run: node tools/qa_phase2_team_assignment_532.js

      - name: Runtime build fingerprint
        run: node tools/qa_issue_303_runtime_build_fingerprint.js

      - name: Runtime ownership safety
        run: node tools/qa_runtime_ownership_safety_300.js

      - name: Existing save compatibility
        run: node tools/qa_save_compatibility_311.js

      - name: Chronicle State Manifest regression
        run: node tools/qa_phase2_chronicle_state_manifest_436.js

      - name: Character Card Shop regression
        run: node tools/qa_phase2_character_card_shop_524.js

      - name: Basic Item Shop regression
        run: node tools/qa_phase2_basic_item_shop_517.js

      - name: Inventory regression
        run: node tools/qa_phase2_inventory_core_461.js

      - name: Live HUD regression
        run: node tools/qa_phase2_live_hud_499.js

      - name: My Clan return-context regression
        run: node tools/qa_hud_my_clan_return_506.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > phase2-532-server.log 2>&1 &
          echo $! > phase2-532-server.pid
          sleep 2

      - name: Installed-browser deliberate team assignment
        run: node tools/qa_phase2_team_assignment_532_browser.js

      - name: Existing Character Card Shop installed-browser regression
        run: node tools/qa_phase2_character_card_shop_524_browser.js

      - name: Existing live HUD installed-browser regression
        run: node tools/qa_phase2_live_hud_499_browser.js

      - name: Existing My Clan return installed-browser regression
        run: node tools/qa_hud_my_clan_return_506_browser.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-team-assignment-532-browser
          path: |
            artifacts/phase2-team-assignment-532
            artifacts/phase2-character-card-shop-524
            artifacts/phase2-live-hud-499
            artifacts/hud-my-clan-return-506
            phase2-532-server.log
          if-no-files-found: ignore
