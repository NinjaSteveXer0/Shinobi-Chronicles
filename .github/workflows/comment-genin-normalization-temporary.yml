name: Temporary report Genin normalization to issue 74

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/comment-genin-normalization-temporary.yml'

permissions:
  contents: read
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment exact normalization evidence on issue 74
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/comment.md <<'EOF'
          CHARACTER CREATION / VISUALS — MECHANICAL ASSET NORMALISATION COMPLETE — NO IMAGE GENERATION

          Exact normalisation commit:
          `21b8952ec68bf278500d18f003a41c14cdee828c`

          Preflight on current `main` before modification:
          - 50/50 exact authoritative source paths existed;
          - all 50 decoded successfully as single-frame PNG;
          - all 25 cards were approximately 1049×1499/1500;
          - all 25 portraits were 1254×1254.

          Operation performed:
          - deterministic Pillow `Image.Resampling.LANCZOS` resize only;
          - 25 collectible cards -> exact 980×1400 PNG;
          - 25 independent UI portraits -> exact 1024×1024 PNG;
          - no crop, pad, redraw, enhancement, inpaint, generative edit, recomposition, or new visual content;
          - approved Chōza and Kosuke representations preserved;
          - `collectibleCard != uiPortrait` preserved.

          Commit scope verification:
          - 50 files changed;
          - exactly the 25 `Assets/Genin/{registry_id}.png` paths plus 25 `Portraits/Genin/{registry_id}.png` paths;
          - no unintended asset paths changed.

          Exact `python tools/qa_genin_expansion_assets.py` result:
          ```text
          collectibleCard physical GREEN: 25/25
          uiPortrait physical GREEN: 25/25
          total blocking rows/channels: 0

          PASS: 25/25 collectible cards and 25/25 uiPortraits satisfy the #74 production asset gate.
          ```

          No Registry identity, PL, Rank, candidate policy, ownership, assignment, deployment, or Combat/Skills authority was altered.

          Temporary execution workflow used solely to perform the deterministic resize was removed after success; cleanup commit: `e71faed6b6ad25dcc769cb3a3311bd7a5510df34`.

          From Character Creation / Visuals, the physical-format repair is complete. UI / Assets retains ownership of the durable #74 projection/table reconciliation and issue closure/next routing.
          EOF
          gh issue comment 74 --repo NinjaSteveXer0/Shinobi-Chronicles --body-file /tmp/comment.md
