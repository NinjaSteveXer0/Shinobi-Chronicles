          helper=r'''function exactOppositionParticipants(result){
  const participants=Array.isArray(result&&result.participants)?result.participants:[];
  const refs=participants.filter(row=>row&&row.side==="opposition").map(row=>String(row.participantRef||""));
  return refs.length===3&&[AMT,PS,MI].every(id=>refs.includes(id));
}
function commitDirectPickpocket3v1Return(){
  const rt=active();if(!rt||rt.sceneId!==SCENE_ID)return{success:false,reason:"kakashi_direct_pickpocket_story_occurrence_missing"};
  if(String(rt.localContext&&rt.localContext.kakashiDirectOpeningOutcomeRef||"")!=="PICKPOCKET_DIRECT_FAILURE_DETECTED_3V1")return{success:false,reason:"kakashi_direct_pickpocket_failure_fact_required"};
  const result=latestBattleResult();if(!result)return{success:false,reason:"kakashi_direct_pickpocket_battle_result_missing"};
  if(String(result.battleConfigId||"")!==PICKPOCKET_3V1_CONFIG)return{success:false,reason:"kakashi_direct_pickpocket_battle_config_mismatch"};
  if(String(result.sourceAnchorRef||"")!=="AK_SA_028"||String(result.bindingRef||"")!==PICKPOCKET_BINDING)return{success:false,reason:"kakashi_direct_pickpocket_battle_provenance_mismatch"};
  if(result.storyOccurrenceId&&String(result.storyOccurrenceId)!==String(rt.instanceId||""))return{success:false,reason:"kakashi_direct_pickpocket_battle_story_occurrence_mismatch"};
  if(!exactOppositionParticipants(result))return{success:false,reason:"kakashi_direct_pickpocket_battle_participants_mismatch"};
  const resultState=String(result.resultState||"");
  if(!["player_side_victory","opposition_side_victory","withdrawn"].includes(resultState))return{success:false,reason:"kakashi_direct_pickpocket_battle_result_unresolved"};
  const participants=Array.isArray(result.participants)?result.participants:[];
  if(resultState==="player_side_victory"&&[AMT,PS,MI].some(id=>!participants.some(row=>row&&row.participantRef===id&&row.battleStatus==="defeated")))return{success:false,reason:"kakashi_direct_pickpocket_victory_missing_defeated_participant"};
  const holder=resultState==="player_side_victory"?"KAKASHI":"ANBU_MARKED_TARGET";
  const recovered=holder==="KAKASHI";
  const occurrenceId=postBattleOccurrenceRef(rt,result);
  const parentId=String(rt.localContext&&rt.localContext.kakashiDirectOpeningOccurrenceId||"");
  const fact={
    factClass:"academy_kakashi_direct_pickpocket_3v1_post_battle_factual_state",anchorRef:"AK_SA_028",storySceneInstanceId:String(rt.instanceId||""),
    parentDirectPickpocketOccurrenceId:parentId,battleOccurrenceId:String(result.battleOccurrenceId||""),battleConfigId:PICKPOCKET_3V1_CONFIG,battleResultState:resultState,
    packageState:{objectRef:WORLD_OBJECT_REF,currentHolderClass:holder,custodyClass:holder,handoffCompleted:false,recovered},
    participantBattleFacts:participants.map(row=>({participantRef:row&&row.participantRef||null,side:row&&row.side||null,battleStatus:row&&row.battleStatus||null,lifeState:row&&row.lifeState||null,custodyState:row&&row.custodyState||null})).filter(row=>row.participantRef),
    worldFacts:{cleanExtractionSucceeded:false,maskedInterceptorVisible:true,maskedInterceptorInvolved:true,pakkunPresent:false,battleRequired:true,packageRecovered:recovered},
    participantDeathCommitted:false,participantCustodyCommitted:false
  };
  let existing=A.findOccurrence(occurrenceId);
  if(existing){
    const ef=factOf(existing);
    if(String(ef.battleOccurrenceId||"")!==String(result.battleOccurrenceId||"")||String(ef.packageState&&ef.packageState.currentHolderClass||"")!==holder)return{success:false,reason:"kakashi_direct_pickpocket_post_battle_replay_mismatch"};
  }else{
    const committed=A.commitOccurrence(ORIGIN_ID,occurrenceId,fact,[],{type:"origin_story_post_battle_factual_occurrence",outcome:resultState,participantRefs:[ORIGIN_ID,AMT,PS,MI],sourceRefs:[{type:"origin_occurrence",id:parentId,role:"direct_pickpocket_failure"},{type:"battle_occurrence",id:String(result.battleOccurrenceId||""),role:"battle_fact"}]});
    if(!committed||committed.success!==true)return committed||{success:false,reason:"kakashi_direct_pickpocket_post_battle_commit_failed"};
  }
  if(resultState==="player_side_victory"){
    for(const id of [AMT,PS,MI]){
      const row=participants.find(p=>p&&p.participantRef===id);
      if(row&&row.battleStatus==="defeated"&&String(row.lifeState||"unresolved")==="unresolved"&&String(row.custodyState||"unresolved")==="unresolved"){
        const classified=CORE.recordParticipantClassification({storyUnitRef:ORIGIN_ID,participantRef:id,stateClass:"DEFEATED_BUT_NOT_CONTROLLED",resultRef:String(result.battleOccurrenceId||"")});
        if(!classified||classified.success!==true)return classified||{success:false,reason:"kakashi_direct_pickpocket_participant_classification_failed",participantRef:id};
      }
    }
  }
  rt.localContext={...(rt.localContext||{}),kakashiDirectOpeningPostBattleOccurrenceId:occurrenceId,kakashiDirectOpeningPostBattleOutcome:resultState};
  save();
  return{success:true,occurrenceId,battleOccurrenceId:String(result.battleOccurrenceId||""),resultState,packageHolderClass:holder,packageRecovered:recovered,nextBeatId:PENDING_BEAT};
}

'''
