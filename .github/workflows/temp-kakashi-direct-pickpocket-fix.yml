          s=rep(s,'const PICKPOCKET_SUCCESS_BOUNDARY="kak_scene03d_pickpocket_success_authoring_boundary_34710";\n','','34710 retire empty success boundary')
          s=rep(s,'function occurrenceRef(rt,decisionReceipt,bindingRef){return PROVIDER.stableRef("occ_origin_kakashi_direct_opening",{storySceneInstanceId:String(rt&&rt.instanceId||""),storyDecisionReceiptId:String(decisionReceipt&&decisionReceipt.storyDecisionReceiptId||""),bindingRef:String(bindingRef||"")});}',
                'function occurrenceRef(rt,decisionReceipt,bindingRef){return PROVIDER.stableRef("occ_origin_kakashi_direct_opening",{storySceneInstanceId:String(rt&&rt.instanceId||""),storyDecisionReceiptId:String(decisionReceipt&&decisionReceipt.storyDecisionReceiptId||""),bindingRef:String(bindingRef||"")});}\nfunction postBattleOccurrenceRef(rt,result){return PROVIDER.stableRef("occ_origin_kakashi_direct_pickpocket_3v1_return",{storySceneInstanceId:String(rt&&rt.instanceId||""),battleOccurrenceId:String(result&&result.battleOccurrenceId||""),bindingRef:PICKPOCKET_BINDING});}\nfunction latestBattleResult(){const rt=active();return rt&&rt.sceneId===SCENE_ID&&rt.battleResume&&rt.battleResume.authored&&typeof rt.battleResume.authored==="object"?rt.battleResume.authored:null;}',
                '34710 post battle refs')
