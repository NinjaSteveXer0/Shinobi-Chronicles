    {beatId:PICKPOCKET_BATTLE_RETURN,mode:"narration",environmentRef:action.environmentRef||SAKURA,text:"",onEnterConsequences:[{requestId:PICKPOCKET_RETURN_REQUEST,kind:"domain",resolve:commitDirectPickpocket3v1Return}],nextBeatId:PENDING_BEAT,exitScene:false,allowPresentationClose:false}
  ];
