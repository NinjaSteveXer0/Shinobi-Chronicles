name: Temporary Kakashi Direct Pickpocket Patch

on:
  push:
    branches: [ coding/kakashi-direct-pickpocket-20260917 ]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/kakashi-direct-pickpocket-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch canonical Kakashi owners surgically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def rep(text, old, new, label):
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {n}")
              return text.replace(old,new,1)

          # 34710 — existing canonical Scene 02 direct-opening owner.
