name: Issue 499 Phase 2 Live HUD

on:
  push:
    branches:
      - coding/phase-2-live-hud-499
      - coding/557-unobstructed-map-canvases
    paths:
      - 'index.html'
      - 'runtime/alpha-phase2-live-hud-49900.js'
      - 'Logo/sc_title.png'
      - 'tools/qa_phase2_live_hud_499.js'
      - 'tools/qa_phase2_live_hud_499_browser.js'
      - 'tools/qa_map_canvas_unobstructed_557.js'
      - 'tools/qa_map_canvas_unobstructed_557_browser.js'
      - 'tools/fixtures/runtime_build_manifest_303.json'
      - 'runtime/alpha-runtime-build-fingerprint-303.js'
      - 'tools/fixtures/runtime_change_declarations_300.json'
      - '.github/workflows/issue-499-phase2-live-hud.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-live-hud:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Source syntax
        run: |
          node --check runtime/alpha-phase2-live-hud-49900.js
          node --check tools/qa_phase2_live_hud_499.js
          node --check tools/qa_phase2_live_hud_499_browser.js
          node --check tools/qa_map_canvas_unobstructed_557.js
          node --check tools/qa_map_canvas_unobstructed_557_browser.js

      - name: Bounded live HUD projection contract
        run: node tools/qa_phase2_live_hud_499.js

      - name: Unobstructed Village/Region canvas contract
        run: node tools/qa_map_canvas_unobstructed_557.js

      - name: Runtime build fingerprint
        run: node tools/qa_issue_303_runtime_build_fingerprint.js

      - name: Runtime ownership safety
        run: node tools/qa_runtime_ownership_safety_300.js

      - name: Existing save compatibility
        run: node tools/qa_save_compatibility_311.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > phase2-499-server.log 2>&1 &
          echo $! > phase2-499-server.pid
          sleep 2

      - name: Phase 2 current-team regression
        run: node tools/qa_phase2_konoha_player_surfaces_431.js

      - name: Inventory route regression
        run: node tools/qa_phase2_inventory_core_461.js

      - name: Installed-browser Phase 2 live HUD
        run: node tools/qa_phase2_live_hud_499_browser.js

      - name: Installed-browser unobstructed Village/Region canvases
        run: node tools/qa_map_canvas_unobstructed_557_browser.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-live-hud-499-browser
          path: |
            artifacts/phase2-live-hud-499
            artifacts/issue-557-unobstructed-map-canvas
            phase2-499-server.log
          if-no-files-found: ignore
