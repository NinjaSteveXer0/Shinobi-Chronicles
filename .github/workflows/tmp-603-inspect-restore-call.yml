name: TMP 603 Inspect Restore Call
on:
  push:
    branches: [coding/603-step7-promotion-integration]
    paths: [.github/workflows/tmp-603-inspect-restore-call.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/603-step7-promotion-integration
          fetch-depth: 0
      - name: Print restore call contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('game.js').read_text(encoding='utf-8')
          needle='restoreTestState();'
          pos=0
          while True:
              idx=text.find(needle,pos)
              if idx<0: break
              print('\n=== CALL',idx,'===')
              print(text[max(0,idx-2500):min(len(text),idx+2500)])
              pos=idx+1
          PY
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-603-inspect-restore-call.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "codex-connector@users.noreply.github.com"
          git add .github/workflows/tmp-603-inspect-restore-call.yml
          git commit -m "[CHORE][#603] Remove temporary restore-call inspection workflow"
          git push origin HEAD:coding/603-step7-promotion-integration
