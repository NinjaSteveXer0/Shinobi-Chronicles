name: Issue 544 One-Shot 141 Load Order

on:
  push:
    branches:
      - coding/544-terminal-result-presentation
    paths:
      - '.github/workflows/issue-544-one-shot-141-load-order.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/544-terminal-result-presentation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install #141 image QA dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Append canonical #544 terminal module to exact production order
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/qa_issue_141_pre_alpha_runtime_closure.py')
          text = path.read_text(encoding='utf-8')
          old = '    "runtime/alpha-phase2-character-card-shop-52400.js",\n]'
          new = '    "runtime/alpha-phase2-character-card-shop-52400.js",\n    "runtime/alpha-battle-terminal-result-54400.js",\n]'
          assert old in text, 'expected pre-#544 #141 loader tail not found'
          assert '"runtime/alpha-battle-terminal-result-54400.js",\n]' not in text, 'terminal-result module already declared at #141 tail'
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify exact #141 closure spine
        run: python tools/qa_issue_141_pre_alpha_runtime_closure.py

      - name: Commit #141 manifest correction and remove one-shot workflow
        run: |
          rm .github/workflows/issue-544-one-shot-141-load-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/qa_issue_141_pre_alpha_runtime_closure.py .github/workflows/issue-544-one-shot-141-load-order.yml
          git diff --cached --check
          git commit -m '[CODING][#544] Teach #141 closure final terminal-result load order'
          git push origin HEAD:coding/544-terminal-result-presentation
