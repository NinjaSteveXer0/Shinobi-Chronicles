name: TEMP 544 QA migration updater

on:
  push:
    branches:
      - coding/544-terminal-result-presentation
    paths:
      - 'tools/tmp_544_qa_migration_updater.js'
      - '.github/workflows/tmp-544-qa-migration-updater.yml'

permissions:
  contents: write

jobs:
  apply-bounded-qa-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/544-terminal-result-presentation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded source migration
        run: node tools/tmp_544_qa_migration_updater.js
      - name: Validate migrated QA syntax
        run: |
          node --check tools/qa_issues_396_399_400_browser.js
          node --check tools/qa_issue_362_menma_reward_browser.js
          node --check tools/qa_kakashi_v2_browser.js
          git diff --check
      - name: Commit migrated QA sources
        run: |
          if git diff --quiet -- tools/qa_issues_396_399_400_browser.js tools/qa_issue_362_menma_reward_browser.js tools/qa_kakashi_v2_browser.js; then
            echo 'No bounded QA changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/qa_issues_396_399_400_browser.js tools/qa_issue_362_menma_reward_browser.js tools/qa_kakashi_v2_browser.js
          git commit -m '[QA][#544] Migrate stale terminal-result browser fixtures'
          git push origin HEAD:coding/544-terminal-result-presentation
