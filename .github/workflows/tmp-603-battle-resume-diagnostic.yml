name: TMP603 Hold Line Resume Diagnostic
on:
  push:
    branches:
      - coding/603-step7-promotion-integration
    paths:
      - .github/workflows/tmp-603-battle-resume-diagnostic.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/603-step7-promotion-integration
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instrument Hold-Line continuation only
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('tools/qa_issue_603_step7_promotion_browser.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function driveBattleToTerminal(page){')
          end=s.index('\nasync function continueTerminalResult', start)
          diagnostic=base64.b64decode('').decode()
          s=s[:start]+diagnostic+s[end:]
          old='    results.viewport1366=await viewportSmoke(browser,1366,768,"1366x768");\n    results.viewport1920=await viewportSmoke(browser,1920,1080,"1920x1080");\n    results.nonBattle=await fullNonBattleScenario(browser);\n    results.partialRetryReload=await partialRetryReloadScenario(browser);\n    results.courierOnly=await courierOnlyScenario(browser);\n    results.battlePass=await battlePassScenario(browser);'
          if old not in s: raise SystemExit('bottom execution block missing')
          s=s.replace(old,'    results.battlePass=await battlePassScenario(browser);',1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m http.server 8080 --bind 127.0.0.1 > sc603-diag-server.log 2>&1 &
          sleep 2
          set +e
          SC603_REQUIRE_INTEGRATION=1 SC603_OUT=artifacts/promotion-603-diagnostic node tools/qa_issue_603_step7_promotion_browser.js
          echo "SC603_DIAG_EXIT=$?"
          exit 0
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm .github/workflows/tmp-603-battle-resume-diagnostic.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "codex-connector@users.noreply.github.com"
          git add .github/workflows/tmp-603-battle-resume-diagnostic.yml
          git commit -m "[TMP603] Remove Hold-Line post-reload diagnostic"
          git push origin HEAD:coding/603-step7-promotion-integration
