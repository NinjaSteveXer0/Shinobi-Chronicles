name: Issue 601 coordination safety adversarial QA

on:
  push:
    branches:
      - qa/601-s05-coordination-safety-j
    paths:
      - 'tools/fixtures/coordination_safety_601_adversarial.json'
      - 'tools/qa_issue_601_coordination_safety_adversarial.js'
      - '.github/workflows/issue-601-coordination-safety-adversarial.yml'
  pull_request:
    paths:
      - 'tools/fixtures/coordination_safety_601_adversarial.json'
      - 'tools/qa_issue_601_coordination_safety_adversarial.js'
      - '.github/workflows/issue-601-coordination-safety-adversarial.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact Lane-I candidate SHA to adversarially test'
        required: false
        type: string
      target_path:
        description: 'Candidate analyzer module path at target_sha'
        required: false
        default: 'tools/coordination_safety_601.js'
        type: string

permissions:
  contents: read

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check Lane J runner
        run: node --check tools/qa_issue_601_coordination_safety_adversarial.js
      - name: Validate adversarial fixture contract
        run: node tools/qa_issue_601_coordination_safety_adversarial.js --self-test

  exact-candidate-adversarial:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact Lane I candidate
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_SHA"
          mkdir -p .qa-target
          git show "$TARGET_SHA:$TARGET_PATH" > .qa-target/coordination-safety-601-candidate.js
          echo "Testing exact candidate: $TARGET_SHA:$TARGET_PATH"
      - name: Syntax check exact candidate
        run: node --check .qa-target/coordination-safety-601-candidate.js
      - name: Run Lane J hostile coordination-safety matrix
        run: node tools/qa_issue_601_coordination_safety_adversarial.js .qa-target/coordination-safety-601-candidate.js
