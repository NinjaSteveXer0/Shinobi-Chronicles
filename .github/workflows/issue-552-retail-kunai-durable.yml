name: Issue 552 Durable Retail Kunai

on:
  push:
    branches:
      - coding/552-retail-kunai-durable-benchmark
    paths:
      - 'runtime/alpha-phase2-basic-item-shop-51700.js'
      - 'tools/qa_phase2_basic_item_shop_517.js'
      - 'tools/qa_retail_kunai_durable_552.js'
      - 'tools/qa_retail_kunai_durable_552_browser.js'
      - '.github/workflows/issue-552-retail-kunai-durable.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-retail-kunai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Source syntax
        run: |
          node --check runtime/alpha-phase2-basic-item-shop-51700.js
          node --check tools/qa_phase2_basic_item_shop_517.js
          node --check tools/qa_retail_kunai_durable_552.js
          node --check tools/qa_retail_kunai_durable_552_browser.js

      - name: Durable retail Kunai contract
        run: node tools/qa_retail_kunai_durable_552.js

      - name: Existing Basic Item Shop regression
        run: node tools/qa_phase2_basic_item_shop_517.js

      - name: Existing durable provenance regression
        run: node tools/qa_durable_object_provenance_545.js

      - name: Inventory projection regression
        run: node tools/qa_phase2_inventory_core_461.js

      - name: Runtime build fingerprint
        run: node tools/qa_issue_303_runtime_build_fingerprint.js

      - name: Runtime ownership safety
        run: node tools/qa_runtime_ownership_safety_300.js

      - name: Existing save compatibility
        run: node tools/qa_save_compatibility_311.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > phase2-552-server.log 2>&1 &
          echo $! > phase2-552-server.pid
          sleep 2

      - name: Installed-browser durable retail Kunai
        run: node tools/qa_retail_kunai_durable_552_browser.js

      - name: Existing installed-browser Shop regression
        run: node tools/qa_phase2_basic_item_shop_517_browser.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-retail-kunai-552-browser
          path: |
            artifacts/phase2-retail-kunai-552
            artifacts/phase2-basic-item-shop-517
            phase2-552-server.log
          if-no-files-found: ignore
