name: Issue 621 Bounded Geometry Handoff Patch

on:
  push:
    branches:
      - coding/621-region-hud-stability-lane-c
    paths:
      - '.github/workflows/issue-621-bounded-geometry-handoff-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coding/621-region-hud-stability-lane-c
          fetch-depth: 0
      - name: Apply bounded handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('runtime/alpha-phase2-live-hud-49900.js')
          s = p.read_text()
          old = '''function scheduleRefresh(){
            if(typeof queueMicrotask==="function")queueMicrotask(()=>render(true));
            else if(typeof setTimeout==="function")setTimeout(()=>render(true),0);
          }
          function routeAction(action){'''
          new = '''function scheduleRefresh(){
            if(typeof queueMicrotask==="function")queueMicrotask(()=>render(true));
            else if(typeof setTimeout==="function")setTimeout(()=>render(true),0);
          }
          function refreshMapGeometry49900(surfaceKind=null){
            if(typeof document==="undefined")return null;
            const root=document.getElementById(ROOT_ID);
            if(!root||root.hidden)return null;
            const surface=String(surfaceKind||root.dataset.surface||"");
            return{
              gutter:syncMapGutterGeometry(root,surface),
              echo:syncMapEchoPresentation(root,surface)
            };
          }
          function routeAction(action){'''
          if old not in s:
              raise SystemExit('scheduleRefresh insertion anchor not found')
          s = s.replace(old, new, 1)

          old = '''globalThis.getPhase2LiveHudSnapshot49900=snapshot;
          globalThis.refreshPhase2LiveHud49900=()=>render(true);
          globalThis.openPhase2LiveHudRoute49900=action=>{const result=routeAction(action);scheduleRefresh();return result;};'''
          new = '''globalThis.getPhase2LiveHudSnapshot49900=snapshot;
          globalThis.refreshPhase2LiveHud49900=()=>render(true);
          globalThis.refreshPhase2LiveHudMapGeometry49900=refreshMapGeometry49900;
          globalThis.openPhase2LiveHudRoute49900=action=>{const result=routeAction(action);scheduleRefresh();return result;};'''
          if old not in s:
              raise SystemExit('global export anchor not found')
          s = s.replace(old, new, 1)

          old = '''  if(targetChanged)observeGeometryTargets(map,box);
            constrainMap(map,box);
            const geometry=applyGeometry(root,map,box,surface);'''
          new = '''  if(targetChanged)observeGeometryTargets(map,box);
            const constraint=constrainMap(map,box);
            if(constraint.changed){
              const refresh=globalThis.refreshPhase2LiveHudMapGeometry49900;
              if(typeof refresh==="function")refresh(surface);
            }
            const geometry=applyGeometry(root,map,box,surface);'''
          if old not in s:
              raise SystemExit('constrainMap handoff anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check runtime/alpha-phase2-live-hud-49900.js
          node tools/qa_issue_621_region_hud_stability.js
      - name: Commit bounded handoff and remove temporary workflow
        run: |
          rm .github/workflows/issue-621-bounded-geometry-handoff-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/alpha-phase2-live-hud-49900.js .github/workflows/issue-621-bounded-geometry-handoff-patch.yml
          git commit -m '[CODING][#621] Order canonical HUD geometry after map constraint'
          git push origin HEAD:coding/621-region-hud-stability-lane-c
