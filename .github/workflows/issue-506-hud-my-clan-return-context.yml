name: Issue 506 HUD My Clan Return Context

on:
  push:
    branches:
      - coding/hud-my-clan-return-context-506
    paths:
      - 'index.html'
      - 'runtime/alpha-hud-my-clan-return-context-50600.js'
      - 'runtime/alpha-runtime-build-fingerprint-303.js'
      - 'tools/fixtures/runtime_build_manifest_303.json'
      - 'tools/fixtures/runtime_change_declarations_300.json'
      - 'tools/fixtures/runtime_responsibility_registry_300.json'
      - 'tools/qa_issue_141_pre_alpha_runtime_closure.py'
      - 'tools/qa_hud_my_clan_return_506.js'
      - 'tools/qa_hud_my_clan_return_506_browser.js'
      - '.github/workflows/issue-506-hud-my-clan-return-context.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hud-my-clan-return-context:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Source syntax
        run: |
          node --check runtime/alpha-hud-my-clan-return-context-50600.js
          node --check tools/qa_hud_my_clan_return_506.js
          node --check tools/qa_hud_my_clan_return_506_browser.js

      - name: Exact HUD My Clan return-context contract
        run: node tools/qa_hud_my_clan_return_506.js

      - name: Runtime build fingerprint
        run: node tools/qa_issue_303_runtime_build_fingerprint.js

      - name: Runtime ownership safety
        run: node tools/qa_runtime_ownership_safety_300.js

      - name: Existing save compatibility
        run: node tools/qa_save_compatibility_311.js

      - name: Live HUD regression
        run: node tools/qa_phase2_live_hud_499.js

      - name: Inventory regression
        run: node tools/qa_phase2_inventory_core_461.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Alpha server
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > issue-506-server.log 2>&1 &
          echo $! > issue-506-server.pid
          sleep 2

      - name: Installed-browser exact map return
        run: node tools/qa_hud_my_clan_return_506_browser.js

      - name: Existing live HUD installed-browser regression
        run: node tools/qa_phase2_live_hud_499_browser.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-506-hud-my-clan-return-browser
          path: |
            artifacts/hud-my-clan-return-506
            artifacts/phase2-live-hud-499
            issue-506-server.log
          if-no-files-found: ignore
